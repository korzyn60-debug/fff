<title>Покерный штаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single felt "table" column; top nav of rails, each screen a stack of panels; scenarios render on a felt strip with real cards. */
:root{
  --felt:#0d3530; --felt-2:#12443d; --felt-3:#18554b;
  --rail:#2a1d14; --rail-2:#3a2a1d;
  --ink:#f1ead9; --muted:#a8bcb2; --faint:#6f8a80;
  --brass:#d9ad55; --brass-ink:#1c140a;
  --line:rgba(241,234,217,.13); --line-2:rgba(241,234,217,.22);
  --panel:rgba(5,24,21,.42);
  --paper:#f8f3e7; --paper-ink:#1b1a17;
  --s-spade:#1b1a17; --s-heart:#c8382e; --s-diam:#2463c9; --s-club:#1f7f45;
  --bk-strong:#ef7a63; --bk-medium:#e8bf55; --bk-draw:#73a9ff; --bk-air:#5e7a71;
  --ch-r:#ef7a63; --ch-c:#5f9cf5; --ch-f:rgba(241,234,217,.05);
  --good:#63d18f; --bad:#f0705f; --warn:#f0c04f; --info:#7fb7ff;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--felt);background-image:radial-gradient(ellipse 120% 70% at 50% 0%,var(--felt-3) 0%,var(--felt) 55%,#0a2b26 100%);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,5vw,36px);line-height:1.1}
h2{font-size:clamp(18px,3.4vw,22px);line-height:1.2}
h3{font-size:15px;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.grid2>*,.grid3>*{min-width:0}

/* header + nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--rail-2),var(--rail));border-bottom:1px solid #000;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{font:800 15px/1 var(--f-display);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.logo .chip{width:22px;height:22px;border-radius:50%;background:repeating-conic-gradient(var(--brass) 0 30deg,var(--paper) 30deg 60deg);box-shadow:inset 0 0 0 4px var(--rail),inset 0 0 0 5px var(--brass)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.on i{background:var(--good)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
nav.tabs button:hover{color:var(--ink)}

main{padding-top:22px}
section.screen{display:flex;flex-direction:column;gap:18px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.tight{padding:14px}
.panel h2+p,.panel h3+p{margin-top:6px}
.hero{padding-block:8px 4px;display:flex;flex-direction:column;gap:10px}
.hero p{max-width:62ch;color:var(--muted)}
.divider{height:1px;background:var(--line);border:0;margin:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 18px;font-weight:600;border:1px solid var(--line-2);background:rgba(241,234,217,.06);transition:background .15s,transform .05s}
.btn:hover{background:rgba(241,234,217,.12)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.primary:hover{background:#e6bd68}
.btn.small{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brass);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* chips/pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.brass{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 50%,transparent)}

/* playing cards */
.cards{display:inline-flex;gap:5px;flex-wrap:wrap}
.pc{width:40px;height:56px;border-radius:6px;background:var(--paper);color:var(--paper-ink);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font:700 19px/1 var(--f-mono);box-shadow:0 2px 0 rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.25);position:relative}
.pc .s{font-size:17px;margin-top:2px;font-family:system-ui,sans-serif}
.st{font-family:system-ui,sans-serif;font-weight:700}.st.h{color:#ff6b5e}.st.d{color:#7fb0ff}.st.c{color:#5fd28d}.st.s{color:var(--ink)}
.pc.h{color:var(--s-heart)} .pc.d{color:var(--s-diam)} .pc.c{color:var(--s-club)} .pc.s_{color:var(--s-spade)}
.pc.back{background:repeating-linear-gradient(45deg,#7a2a22 0 5px,#8e352c 5px 10px);box-shadow:inset 0 0 0 3px var(--paper),0 2px 0 rgba(0,0,0,.35)}
.pc.sm{width:30px;height:42px;font-size:14px}
.pc.sm .s{font-size:13px}

/* felt table strip for scenarios */
.table{border-radius:18px;padding:16px;background:radial-gradient(ellipse at 50% 30%,#1d6a5b,#114237 75%);box-shadow:inset 0 0 0 6px var(--rail-2),inset 0 0 0 7px #000,inset 0 0 40px rgba(0,0,0,.45);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.table.nohero{grid-template-columns:1fr auto}
.table .slot{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.table .slot.mid{align-items:center}
.table .lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(241,234,217,.65);font-weight:600}
.table .nums{display:flex;flex-direction:column;gap:4px;align-items:flex-end;text-align:right}
.table .num{font:700 15px/1.1 var(--f-mono)}
.table .pos{font:700 12px/1.2 var(--f-body);color:var(--brass);text-align:center}
@media (max-width:560px){.table{grid-template-columns:1fr 1fr}.table .slot.mid{grid-column:1/-1;order:-1}.table .nums{align-items:flex-start;text-align:left}}

/* question */
.q-text{font-size:16.5px;line-height:1.6;max-width:68ch;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line-2);background:rgba(241,234,217,.04);width:100%}
.opt:hover:not([disabled]){background:rgba(241,234,217,.09);border-color:var(--brass)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--f-mono);border:1px solid var(--line-2);color:var(--muted)}
.opt.sel{border-color:var(--brass);background:rgba(217,173,85,.12)}
.opt.sel .k{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.right .k{background:var(--good);color:#0b2a1c;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.opt.wrong .k{background:var(--bad);color:#2a0b07;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{border-left:3px solid var(--brass);padding:10px 14px;background:rgba(217,173,85,.07);border-radius:0 10px 10px 0;max-width:72ch}
.why.good{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 8%,transparent)}
.why.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.conf{display:flex;gap:6px;flex-wrap:wrap}
.conf button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.conf button[aria-pressed="true"]{background:var(--ink);color:var(--felt);border-color:var(--ink)}
.progress{height:6px;border-radius:999px;background:rgba(241,234,217,.1);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brass);border-radius:999px;transition:width .3s}
.progress.timer>i{background:var(--good);transition:width .1s linear}
.progress.timer.low>i{background:var(--bad)}

/* stat tiles */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font:700 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:8px;border-radius:999px;background:rgba(241,234,217,.1);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:999px}
.bar .n{font-family:var(--f-mono);text-align:right}

/* checklist */
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--brass);flex:none}
.check label{flex:1;min-width:0}
.check .sub{font-size:13px;color:var(--muted)}
.check.done label>span:first-child{text-decoration:line-through;color:var(--muted)}

/* range grid */
.rg-wrap{overflow-x:auto}
.rg{display:grid;grid-template-columns:repeat(13,minmax(24px,1fr));gap:2px;max-width:560px;user-select:none;-webkit-user-select:none;touch-action:none}
.rg div{aspect-ratio:1;display:grid;place-items:center;font:600 clamp(8px,1.7vw,11.5px)/1 var(--f-mono);border-radius:3px;background:rgba(241,234,217,.06);color:var(--muted);cursor:pointer;position:relative}
.rg div.pair{background:rgba(241,234,217,.11)}
.rg div.on{background:var(--brass);color:var(--brass-ink)}
.rg div.ok{background:var(--good);color:#0b2a1c}
.rg div.border-in{background:color-mix(in srgb,var(--warn) 70%,transparent);color:#2a2005}
.rg div.border-out{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn) 70%,transparent);color:var(--warn)}
.rg div.extra{background:var(--bad);color:#2a0b07}
.rg div.miss{background:transparent;box-shadow:inset 0 0 0 2px var(--info);color:var(--info)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:rgba(0,0,0,.25);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:120px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--brass)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:7px 11px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--brass);color:var(--ink);background:rgba(217,173,85,.14)}

/* AI output */
.ai-out{white-space:pre-wrap;line-height:1.65;max-width:76ch;font-size:15px}
.ai-out h4{font:700 14px/1.3 var(--f-display);margin:14px 0 4px;color:var(--brass)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:min(76ch,100%);white-space:pre-wrap;line-height:1.6}
.msg.me{align-self:flex-end;background:rgba(217,173,85,.16);border:1px solid color-mix(in srgb,var(--brass) 40%,transparent)}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}

/* week plan */
.week{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.week>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel)}
.week>summary::-webkit-details-marker{display:none}
.week[open]>summary{border-bottom:1px solid var(--line)}
.week .wb{padding:12px 16px}
.wk-n{font:800 12px/1 var(--f-display);color:var(--brass);letter-spacing:.06em}

.term{border-bottom:1.5px dotted color-mix(in srgb,var(--brass) 80%,transparent);cursor:help}
.term:hover,.term:focus{color:var(--brass);outline:none}
#pop{position:fixed;z-index:60;background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:10px 13px;font-size:14px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:3px}
#pop b{font-weight:700}
#pop[hidden],[hidden]{display:none!important}
.lesson{max-width:72ch}
.lesson h1{margin-bottom:4px}
.lp{font-size:16px;line-height:1.65}
.ll{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15.5px;line-height:1.55}
.rule{border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);background:rgba(217,173,85,.1);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.rule p{font-size:16px;font-weight:600;line-height:1.5}
table.lt td{font-size:14.5px;line-height:1.5}
table.lt td.lt-first{font-weight:600;white-space:nowrap}
.ex{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--panel)}
.ex>p{font-size:15.5px}
.lcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:10px;border:1px solid var(--line-2);background:rgba(241,234,217,.04);min-width:0}
.lcard:hover{border-color:var(--brass);background:rgba(241,234,217,.08)}
.lcard b{font-size:15.5px;line-height:1.35}
.bk{display:flex;flex-direction:column;gap:7px}
.bk-t{font-size:13px;font-weight:600;color:var(--muted)}
.bk-bar{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px;background:rgba(241,234,217,.06)}
.bk-bar i{display:block;height:100%}
.bk-l{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.bk-l i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}
.bk-l b{color:var(--ink)}
.rg.ro div{cursor:default}
.rg.ch div{color:rgba(241,234,217,.55)}
.rg.ch div.ch-r{background:var(--ch-r);color:#2a0b07}
.rg.ch div.ch-c{background:var(--ch-c);color:#06142b}
.rg.ch div.ch-f{background:var(--ch-f)}
.rg.ch div.ch-sel{outline:2.5px solid var(--ink);outline-offset:-1px;z-index:1}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--paper-ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:50}
.big-num{font:800 clamp(40px,9vw,64px)/1 var(--f-display);letter-spacing:-.02em}
.archetype{border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);background:linear-gradient(135deg,rgba(217,173,85,.12),rgba(217,173,85,.02));border-radius:var(--r);padding:18px}
svg text{font-family:var(--f-body)}
table.mini{border-collapse:collapse;width:100%;font-size:13.5px}
table.mini th,table.mini td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.mini th{color:var(--muted);font-weight:600;font-size:12px}
.scroll-x{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* ============================== constants ============================== */
const AXES=[
  {id:'math',short:'Счёт',name:'Простой счёт',desc:'хватает ли шансов для колла, сколько аутов'},
  {id:'ranges',short:'Что у него',name:'Что у соперника',desc:'какие руки остались у соперника после его действий'},
  {id:'postflop',short:'После флопа',name:'Игра после флопа',desc:'когда ставить, сколько улиц, дро, ривер'},
  {id:'exploit',short:'Соперники',name:'Типы соперников',desc:'станция, нит, маньяк, регуляр — как играть против каждого'},
  {id:'preflop',short:'Префлоп',name:'Префлоп',desc:'какие руки играть, против рейза, короткий стек'},
  {id:'mental',short:'Дистанция',name:'Голова и дистанция',desc:'тилт, банкролл, как быть в плюсе на длинной дистанции'},
];
const AXIS=Object.fromEntries(AXES.map(a=>[a.id,a]));
const RANKS='AKQJT98765432';
const SUITS={s:'♠',h:'♥',d:'♦',c:'♣'};
const SRS_DAYS=[0,1,3,7,16,35];
const DAY=86400000;
const LS_KEY='pokerstab.v1';

/* ============================== utils ============================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>Math.round(x*100);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{try{const [y,m,d]=s.split('-');return d+'.'+m}catch(e){return s}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function card(c,sm){
  if(!c||c.length<2)return '';
  const r=c[0].toUpperCase().replace('1','T'),s=c[1].toLowerCase();
  if(!SUITS[s])return '';
  const cls=s==='s'?'s_':s;

/* ============================== stats / srs ============================== */
function logEvent(kind,cat,c,t,extra){S.log.push(Object.assign({d:today(),ts:Date.now(),kind,cat,c,t},extra||{}))}
function recordAnswer(q,ok){
  const st=S.stats[q.cat]||(S.stats[q.cat]={c:0,t:0});st.t++;if(ok)st.c++;
  const r=S.srs[q.id]||{box:0,due:0,seen:0,wrong:0};
  r.seen++;
  if(ok){r.box=Math.min(5,r.box+1);r.due=Date.now()+SRS_DAYS[r.box]*DAY}
  else{r.wrong++;r.box=0;r.due=Date.now()+8*60000}
  S.srs[q.id]=r;
}
function allQs(){return BANK.concat(S.aiQs||[])}
function poolQs(){return S.prefs&&S.prefs.adv?allQs():allQs().filter(q=>q.simple||q.ai)}
function qById(id){return allQs().find(q=>q.id===id)}
function dueQs(){const n=Date.now();return poolQs().filter(q=>{const r=S.srs[q.id];return r&&r.due<=n})}
function axisScore(id){
  // blend: latest diagnostic and drill accuracy (drills weigh more as volume grows)
  const d=S.diag&&S.diag.axes[id];const st=S.stats[id];
  const dv=d?d.score:null;const tv=st&&st.t?st.c/st.t:null;
  if(dv==null&&tv==null)return null;
  if(dv==null)return tv;if(tv==null)return dv;
  const w=Math.min(.7,st.t/40);
  return dv*(1-w)+tv*w;
}
function weakestAxes(){
  const arr=AXES.map(a=>({id:a.id,s:axisScore(a.id)})).filter(x=>x.s!=null).sort((a,b)=>a.s-b.s);
  return arr.length?arr:AXES.map(a=>({id:a.id,s:null}));
}
function doneToday(kind){return S.log.some(e=>e.d===today()&&e.kind===kind)}
function streak(){
  const days=new Set(S.log.map(e=>e.d));let n=0;const d=new Date();
  if(!days.has(today()))d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(days.has(k)){n++;d.setDate(d.getDate()-1)}else break}
  return n;
}

function radar(series,size){
  size=size||300;const cx=size/2,cy=size/2,R=size/2-58;const n=AXES.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
  let g='';
  [.25,.5,.75,1].forEach(l=>{g+=`<polygon points="${AXES.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="var(--line-2)" stroke-width="1"/>`});
  AXES.forEach((a,i)=>{const[x,y]=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const[lx,ly]=pt(i,1.2);const anchor=Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end';
    g+=`<text x="${lx}" y="${ly+4}" text-anchor="${anchor}" font-size="11.5" fill="var(--muted)" font-weight="600">${esc(a.short)}</text>`});
  series.forEach(s=>{
    const pts=AXES.map((a,i)=>pt(i,Math.max(.03,s.vals[a.id]??0)));
    g+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="2" ${s.dash?'stroke-dasharray="4 4"':''}/>`;
    if(!s.dash)pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.stroke}"/>`});
  });
  return `<svg viewBox="-40 0 ${size+80} ${size}" width="100%" style="max-width:${size+80}px;display:block;margin:0 auto" role="img" aria-label="Профиль навыков">${g}</svg>`;
}
function lineChart(points,opts){
  opts=opts||{};const W=600,H=170,pl=34,pr=12,pt=12,pb=26;
  if(points.length<2)return `<p class="muted">Нужно минимум два дня тренировок, чтобы появился график.</p>`;
  const xs=i=>pl+i*(W-pl-pr)/(points.length-1);const ys=v=>pt+(1-v)*(H-pt-pb);
  let g='';[0,.25,.5,.75,1].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${ys(v)+4}" text-anchor="end" font-size="10" fill="var(--faint)">${pct(v)}</text>`});
  const path=points.map((p,i)=>(i?'L':'M')+xs(i)+','+ys(p.v)).join(' ');
  g+=`<path d="${path} L${xs(points.length-1)},${ys(0)} L${xs(0)},${ys(0)} Z" fill="var(--brass)" opacity=".12"/>`;
  g+=`<path d="${path}" fill="none" stroke="var(--brass)" stroke-width="2.2"/>`;
  const step=Math.ceil(points.length/7);
  points.forEach((p,i)=>{if(i%step===0||i===points.length-1)g+=`<text x="${xs(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--faint)">${esc(p.l)}</text>`});
  const last=points[points.length-1];g+=`<circle cx="${xs(points.length-1)}" cy="${ys(last.v)}" r="4.5" fill="var(--brass)"/>`;
  return `<div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:340px;display:block" role="img" aria-label="${esc(opts.label||'График')}">${g}</svg></div>`;
}

const D={phase:'intro',qs:[],i:0,ans:[],sel:null,conf:null,t0:0,profile:{}};
function buildDiag(){
  const out=[];
  const adv=S.prefs&&S.prefs.adv;const per=adv?4:2;
  AXES.forEach(ax=>{
    const pool=BANK.filter(q=>q.cat===ax.id&&(adv?!q.simple:q.simple));
    const by=l=>shuffle(pool.filter(q=>q.level===l));
    let chosen=adv?[...by(1).slice(0,1),...by(2).slice(0,2),...by(3).slice(0,1)]:[...by(1).slice(0,1),...by(2).slice(0,1)];
    if(chosen.length<per)chosen=chosen.concat(shuffle(pool.filter(q=>!chosen.includes(q))).slice(0,per-chosen.length));
    out.push(chosen);
  });
  const res=[];for(let i=0;i<per;i++)shuffle(AXES.map((_,k)=>k)).forEach(k=>{if(out[k][i])res.push(out[k][i])});
  return res;
}

  const res={date:today(),axes,total:tw,acc,calib:conf-acc,answers:D.ans};
  S.diag=res;S.diagHistory.push(res);

const T={cat:'smart',session:null};
function buildSession(cat,n){
  n=n||10;const all=poolQs();const now=Date.now();
  let pool=cat==='smart'?all:cat==='review'?dueQs():all.filter(q=>q.cat===cat);
  const due=shuffle(pool.filter(q=>S.srs[q.id]&&S.srs[q.id].due<=now));
  const fresh=shuffle(pool.filter(q=>!S.srs[q.id]));
  const later=pool.filter(q=>S.srs[q.id]&&S.srs[q.id].due>now).sort((a,b)=>S.srs[a.id].due-S.srs[b.id].due);
  let out=due.slice(0,Math.ceil(n*.5));
  if(cat==='smart'){
    const w=weakestAxes();const weights={};w.forEach((x,i)=>weights[x.id]=Math.max(1,w.length-i));
    const f2=fresh.slice().sort((a,b)=>(weights[b.cat]||1)*Math.random()-(weights[a.cat]||1)*Math.random());
    out=out.concat(f2.slice(0,n-out.length));
  }else out=out.concat(fresh.slice(0,n-out.length));
  if(out.length<n)out=out.concat(due.filter(q=>!out.includes(q)).slice(0,n-out.length));
  if(out.length<n)out=out.concat(later.filter(q=>!out.includes(q)).slice(0,n-out.length));
  return{cat,qs:shuffle(out).slice(0,n),i:0,sel:null,done:false,c:0,res:[]};
}

function handAt(i,j){if(i===j)return RANKS[i]+RANKS[j];return i<j?RANKS[i]+RANKS[j]+'s':RANKS[j]+RANKS[i]+'o'}

function expand(tok){
  tok=tok.trim();if(!tok)return[];const R=RANKS,ix=c=>R.indexOf(c);const out=[];
  let m;
  if((m=tok.match(/^([2-9TJQKA])\1\+$/))){for(let k=ix(m[1]);k>=0;k--)out.push(R[k]+R[k]);return out}
  if((m=tok.match(/^([2-9TJQKA])\1-([2-9TJQKA])\2$/))){let a=ix(m[1]),b=ix(m[2]);if(a>b)[a,b]=[b,a];for(let k=a;k<=b;k++)out.push(R[k]+R[k]);return out}
  if((m=tok.match(/^([2-9TJQKA])\1$/)))return[tok];
  if((m=tok.match(/^([2-9TJQKA])([2-9TJQKA])([so])\+$/))){const hi=ix(m[1]);for(let k=ix(m[2]);k>hi;k--)out.push(m[1]+R[k]+m[3]);return out}
  if((m=tok.match(/^([2-9TJQKA])([2-9TJQKA])([so])-\1([2-9TJQKA])\3$/))){let a=ix(m[2]),b=ix(m[4]);if(a>b)[a,b]=[b,a];for(let k=a;k<=b;k++)out.push(m[1]+R[k]+m[3]);return out}
  if((m=tok.match(/^([2-9TJQKA])([2-9TJQKA])([so])$/)))return[tok];
  if((m=tok.match(/^([2-9TJQKA])([2-9TJQKA])$/)))return[tok+'s',tok+'o'];
  console.warn('bad range token',tok);return[];
}

}

  {id:'p4',t:'Дро и ривер',goal:'Не переплачивать за дро и правильно решать на ривере.',lessons:['l-draws','l-river'],cat:'math',table:'С дро против большой ставки на тёрне вспоминай табличку: 1 из 5 — это мало против ставки в банк.'},
  {id:'p5',t:'Что у соперника',goal:'Думать корзинами и читать ставки любителей.',lessons:['l-buckets','l-tells'],cat:'ranges',table:'В каждой крупной раздаче назови себе: какие корзины рук остались у соперника после его действий.'},
  {id:'p6',t:'Соперники, стадии турнира и проверка',goal:'Быстро определять тип соперника и подстраиваться под стадию турнира. В конце — повторная проверка уровня.',lessons:['l-types','l-stages'],cat:'exploit',table:'В начале каждого турнира за первые 30 раздач отметь для себя тип каждого соперника за столом.',final:true},
];
function currentWeek(){if(!S.plan.start)return 0;const d=Math.floor((Date.now()-new Date(S.plan.start+'T00:00:00').getTime())/(7*DAY));return clamp(d,0,PLAN.length-1)}
function renderPlan(){
  if(!S.plan.start){S.plan.start=today();save()}
  const cw=currentWeek();
  return `<div class="hero"><span class="eyebrow">План на 6 недель</span><h1>Одна тема в неделю</h1><p>Каждую неделю: 2–3 урока в Школе, раздачи по теме, немного спотов в тренажёре и одна привычка, которую ты отрабатываешь в реальной игре. Уроки и раздачи отмечаются сами, когда ты их проходишь.</p></div>
    <div class="stack">${PLAN.map((w,i)=>{
      const items=[...w.lessons.map(id=>{const L=LESSONS.find(l=>l.id===id);return{k:'les:'+id,t:'Урок: '+(L?L.t:id),done:!!lessonDone(id),act:`data-act="sc-open" data-id="${id}"`}}),
        {k:w.id+':hands',t:'Сыграть 3 раздачи в разделе «Раздачи»',manual:true,act:'data-go="hands"'},
        {k:w.id+':drill',t:'Тренажёр: 2 раза по 10 ситуаций — тема «'+AXIS[w.cat].name+'»',manual:true,act:`data-act="train-cat" data-cat="${w.cat}"`},
        {k:w.id+':table',t:'За столом: '+w.table,manual:true},
        ...(w.final?[{k:w.id+':diag',t:'Пройти проверку уровня ещё раз и сравнить',manual:true,act:'data-go="diag"'}]:[])];
      const done=items.filter(it=>it.manual?S.plan.done[it.k]:it.done).length;
      return `<details class="week" ${i===cw?'open':''}><summary><span class="stack-s" style="gap:4px;min-width:0"><span class="wk-n">${i===cw?'ЭТА НЕДЕЛЯ':'НЕДЕЛЯ '+(i+1)}</span><h3>${esc(w.t)}</h3></span><span class="pill ${done===items.length?'good':''}">${done}/${items.length}</span></summary><div class="wb stack-s"><p class="muted">${esc(w.goal)}</p>
        ${items.map(it=>{const d=it.manual?!!S.plan.done[it.k]:it.done;return `<div class="check ${d?'done':''}"><input type="checkbox" id="pl-${esc(it.k)}" ${it.manual?`data-act="plan" data-k="${esc(it.k)}"`:'disabled'} ${d?'checked':''}><label for="pl-${esc(it.k)}"><span>${esc(it.t)}</span></label>${it.act?`<button class="btn small" ${it.act}>Открыть</button>`:''}</div>`}).join('')}</div></details>`}).join('')}</div>
    <div class="panel stack-s"><span class="eyebrow">Как работать со мной дальше</span><p class="muted" style="font-size:14px">Раз в неделю возвращайся в чат с Claude и пиши «проверь мой прогресс». Я увижу твои уроки, раздачи и ошибки и подстрою план.</p></div>`;
}
ACTS.plan=(el)=>{const k=el.dataset.k;if(el.checked)S.plan.done[k]=true;else delete S.plan.done[k];save();render()};

/* ============================== GLOSSARY ============================== */
const GL_RX=GLOSS.map(([n,src,d])=>({n,d,rx:new RegExp('(?<![А-Яа-яЁёA-Za-z0-9\\-])('+src+')(?![А-Яа-яЁёA-Za-z0-9])','i')}));
function gl(html){
  const used=[];let out=html;
  GL_RX.forEach((g,i)=>{out=out.replace(g.rx,m=>{used.push([i,m]);return '\u0001'+(used.length-1)+'\u0002'})});
  return out.replace(/\u0001(\d+)\u0002/g,(_,k)=>{const [i,m]=used[+k];return `<span class="term" tabindex="0" role="button" data-gl="${i}">${m}</span>`});
}
const txg=s=>gl(tx(s));
function showGloss(el){
  const g=GL_RX[+el.dataset.gl];const pop=$('#pop');if(!g||!pop)return;
  pop.innerHTML=`<b>${esc(g.n)}</b><span>${esc(g.d)}</span>`;pop.hidden=false;
  const r=el.getBoundingClientRect();const w=Math.min(300,window.innerWidth-32);pop.style.width=w+'px';
  let x=clamp(r.left+r.width/2-w/2,16,window.innerWidth-w-16);let y=r.bottom+8;
  pop.style.left=x+'px';pop.style.top=y+'px';
  const ph=pop.offsetHeight;if(y+ph>window.innerHeight-12)pop.style.top=Math.max(12,r.top-ph-8)+'px';
}
function hideGloss(){const p=$('#pop');if(p)p.hidden=true}
window.addEventListener('scroll',hideGloss,{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideGloss();if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('term')){e.preventDefault();showGloss(e.target)}});

/* ============================== shared visual blocks ============================== */
const BK=[['strong','Сильные','var(--bk-strong)'],['medium','Средние','var(--bk-medium)'],['draw','Дро','var(--bk-draw)'],['air','Ничего','var(--bk-air)']];
function bucketsHTML(r,title){
  const sum=BK.reduce((a,[k])=>a+(+r[k]||0),0)||1;
  return `<div class="bk">${title?`<span class="bk-t">${esc(title)}</span>`:''}<div class="bk-bar" role="img" aria-label="${BK.map(([k,l])=>l+' '+Math.round((+r[k]||0)/sum*100)+'%').join(', ')}">${BK.map(([k,l,c])=>{const v=(+r[k]||0)/sum*100;return v>0?`<i style="width:${v}%;background:${c}"></i>`:''}).join('')}</div>
    <div class="bk-l">${BK.map(([k,l,c])=>`<span><i style="background:${c}"></i>${l} <b class="mono">${Math.round((+r[k]||0)/sum*100)}%</b></span>`).join('')}</div></div>`;
}
function gridHTML(core,border,title){
  const C=parseRange(core),B=parseRange(border||'');let g='',cc=0,bc=0;
  for(let i=0;i<13;i++)for(let j=0;j<13;j++){const h=handAt(i,j);const inC=C.has(h),inB=B.has(h);if(inC)cc+=combos(h);if(inB)bc+=combos(h);
    g+=`<div class="${i===j?'pair':''}${inC?' on':inB?' border-in':''}">${h.length===2?h:h.slice(0,2)+(h[2]==='s'?'s':'')}</div>`}
  return `<div class="stack-s">${title?`<h3>${esc(title)}</h3>`:''}<div class="rg-wrap"><div class="rg ro">${g}</div></div>
    <div class="legend"><span><i style="background:var(--brass)"></i>играй всегда (${(cc/1326*100).toFixed(0)}% рук)</span>${bc?`<span><i style="background:color-mix(in srgb,var(--warn) 70%,transparent)"></i>по ситуации: против слабых блайндов да, против агрессивных нет</span>`:''}</div></div>`;
}
function exampleHTML(e){
  const x=e.ex;const q={hero:x.hero||'',board:x.board||'',pos:x.pos||'',pot:null,stack:null,nohero:!x.hero};
  return `<div class="ex">${tableHTML(q)}<p>${txg(e.t)}</p><div class="why good"><b>Как правильно.</b> ${txg(e.v)}</div></div>`;
}
function blockHTML(b){
  if(b.p)return `<p class="lp">${txg(b.p)}</p>`;
  if(b.rule)return `<div class="rule"><span class="eyebrow">Правило</span><p>${txg(b.rule)}</p></div>`;
  if(b.list)return `<ul class="ll">${b.list.map(x=>`<li>${txg(x)}</li>`).join('')}</ul>`;
  if(b.tbl)return `<div class="scroll-x"><table class="mini lt"><thead><tr>${b.tbl.h.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.tbl.r.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="lt-first"':''}>${txg(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.ex)return exampleHTML(b);
  if(b.bk)return bucketsHTML(b.bk.r,b.bk.t);
  if(b.grid)return gridHTML(b.grid.core,b.grid.border,b.grid.t);
  return '';
}

/* ============================== SCHOOL ============================== */
const SC={open:null,ans:{}};
function lessonDone(id){return S.lessons&&S.lessons[id]}
function nextLesson(){return LESSONS.find(l=>!lessonDone(l.id))}
function renderSchool(){
  if(SC.open){const L=LESSONS.find(l=>l.id===SC.open);if(L)return renderLesson(L)}
  const done=LESSONS.filter(l=>lessonDone(l.id)).length;const nx=nextLesson();
  return `<div class="hero"><span class="eyebrow">Школа</span><h1>Короткие уроки без лишней теории</h1><p>Каждый урок — 5–7 минут: простое объяснение, живые примеры раздач и правило, которое можно унести за стол. В конце 1–2 вопроса на проверку. Незнакомое слово подчёркнуто пунктиром — нажми на него, и появится объяснение.</p>
    <div class="row" style="margin-top:6px">${nx?`<button class="btn primary" data-act="sc-open" data-id="${nx.id}">${done?'Продолжить':'Начать'}: ${esc(nx.t)}</button>`:'<span class="pill good">Все уроки пройдены</span>'}<span class="faint" style="font-size:13px">Пройдено ${done} из ${LESSONS.length}</span></div></div>
    ${MODULES.map(m=>{const ls=LESSONS.filter(l=>l.m===m.id);return `<div class="panel stack"><div class="stack-s"><h2>${esc(m.n)}</h2><p class="muted" style="font-size:14px">${esc(m.d)}</p></div>
      <div class="grid2">${ls.map(l=>{const d=lessonDone(l.id);return `<button class="lcard" data-act="sc-open" data-id="${l.id}"><span class="row" style="justify-content:space-between;width:100%"><span class="faint mono" style="font-size:12px">${l.min} мин</span>${d?`<span class="pill good">пройден · ${d.c}/${d.t}</span>`:''}</span><b>${esc(l.t)}</b></button>`}).join('')}</div></div>`}).join('')}`;
}
function renderLesson(L){
  const idx=LESSONS.indexOf(L);const nx=LESSONS[idx+1];const m=MODULES.find(x=>x.id===L.m);
  const ans=SC.ans[L.id]||{};const allA=L.q.every((_,i)=>ans[i]!=null);
  return `<div class="row"><button class="btn small" data-act="sc-back">← Все уроки</button><span class="faint" style="font-size:13px">${esc(m.n)} · урок ${LESSONS.filter(l=>l.m===L.m).indexOf(L)+1}</span></div>
    <article class="lesson stack"><h1>${esc(L.t)}</h1>${L.b.map(blockHTML).join('')}</article>
    <div class="panel stack"><span class="eyebrow">Проверь себя</span>
      ${L.q.map((q,i)=>{const a=ans[i];return `<div class="stack-s"><p class="q-text">${txg(q.q)}</p><div class="opts">${q.opts.map((o,k)=>{let c='';if(a!=null){if(k===q.ans)c='right';else if(k===a)c='wrong'}return `<button class="opt ${c}" data-act="sc-ans" data-l="${L.id}" data-i="${i}" data-k="${k}" ${a!=null?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${tx(o)}</span></button>`}).join('')}</div>${a!=null?`<div class="why ${a===q.ans?'good':'bad'}"><b>${a===q.ans?'Верно.':'Не совсем.'}</b> ${txg(q.why)}</div>`:''}</div>`}).join('<hr class="divider">')}
      ${allA?`<div class="row">${nx?`<button class="btn primary" data-act="sc-open" data-id="${nx.id}">Следующий урок: ${esc(nx.t)}</button>`:''}<button class="btn" data-go="hands">Закрепить на раздачах</button></div>`:''}
    </div>`;
}
ACTS['sc-open']=(el)=>{SC.open=el.dataset.id;go('school')};
ACTS['sc-back']=()=>{SC.open=null;render();window.scrollTo({top:0})};
ACTS['sc-ans']=(el)=>{const id=el.dataset.l,i=+el.dataset.i,k=+el.dataset.k;const L=LESSONS.find(l=>l.id===id);SC.ans[id]=SC.ans[id]||{};if(SC.ans[id][i]!=null)return;SC.ans[id][i]=k;
  const q=L.q[i];const st=S.stats[L.m==='pre'?'preflop':L.m==='post'?'postflop':L.m==='read'?'ranges':L.m==='opp'?'exploit':'mental'];
  if(L.q.every((_,j)=>SC.ans[id][j]!=null)){const c=L.q.filter((qq,j)=>SC.ans[id][j]===qq.ans).length;S.lessons=S.lessons||{};S.lessons[id]={c,t:L.q.length,d:today()};logEvent('lesson',null,c,L.q.length,{id});save()}
  const y=window.scrollY;render();window.scrollTo({top:y})};

/* ============================== HANDS (play the hand) ============================== */
const HP={open:null,step:0,picks:[]};
function renderHands(){
  if(HP.open){const H=HANDS.find(h=>h.id===HP.open);if(H)return renderHand(H)}
  const done=HANDS.filter(h=>S.hands&&S.hands[h.id]).length;
  const groups=[['MTT','Турниры'],['Живой','Живой кэш'],['Онлайн','Онлайн-кэш']];
  return `<div class="hero"><span class="eyebrow">Сыграй раздачу</span><h1>Раздачи от префлопа до ривера</h1><p>Ты принимаешь решение на каждой улице. После каждого шага тренер объясняет, почему так, и показывает, какие руки сейчас у соперника, разложенные по четырём корзинам. Так тренируется главное: видеть не одну свою руку, а всю ситуацию.</p><span class="faint" style="font-size:13px">Сыграно ${done} из ${HANDS.length}</span></div>
    ${groups.map(([k,n])=>{const hs=HANDS.filter(h=>(h.format||'').startsWith(k));if(!hs.length)return '';return `<div class="panel stack"><h2>${n}</h2><div class="grid2">${hs.map(h=>{const r=S.hands&&S.hands[h.id];return `<button class="lcard" data-act="hp-open" data-id="${h.id}"><span class="row" style="justify-content:space-between;width:100%"><span class="cards">${cardsOf(h.hero,true)}</span>${r?`<span class="pill ${r.c===r.t?'good':'brass'}">${r.c}/${r.t}</span>`:`<span class="faint" style="font-size:12px">${h.steps.length} ${h.steps.length===1?'решение':h.steps.length<5?'решения':'решений'}</span>`}</span><b>${esc(h.title)}</b><span class="faint" style="font-size:12.5px">${esc(h.format)} · ${esc(h.heroPos)} против ${esc(h.villainPos)}</span></button>`}).join('')}</div></div>`}).join('')}`;
}
function streetName(s){return{preflop:'Префлоп',flop:'Флоп',turn:'Тёрн',river:'Ривер'}[s]||s}
function renderHand(H){
  const cur=HP.step;const finished=cur>=H.steps.length;
  const past=H.steps.slice(0,Math.min(cur,H.steps.length)).map((st,i)=>{const p=HP.picks[i];const ok=p===st.best;return `<details class="week"><summary><span class="row" style="gap:8px;min-width:0"><span class="pill ${ok?'good':'bad'}">${streetName(st.street)}</span><span style="font-size:14px">${esc(st.opts[st.best])}</span></span>${st.board?`<span class="cards">${cardsOf(st.board,true)}</span>`:''}</summary><div class="wb stack-s"><p class="muted" style="font-size:14px">${txg(st.text)}</p><div class="why">${txg(st.why)}</div></div></details>`}).join('');
  let body='';
  if(!finished){
    const st=H.steps[cur];const ans=HP.picks[cur]!=null;const pk=HP.picks[cur];
    body=`<div class="panel stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">${streetName(st.street)} · решение ${cur+1} из ${H.steps.length}</span></div>
      ${tableHTML({hero:H.hero,board:st.board,pos:H.heroPos+' vs '+H.villainPos,pot:st.pot,stack:null})}
      <p class="q-text">${txg(st.text)}</p>
      <div class="opts">${st.opts.map((o,k)=>{let c='';if(ans){if(k===st.best)c='right';else if(k===pk)c='wrong'}return `<button class="opt ${c}" data-act="hp-pick" data-k="${k}" ${ans?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${tx(o)}</span></button>`}).join('')}</div>
      ${ans?`<div class="why ${pk===st.best?'good':'bad'}"><b>${pk===st.best?'Верно.':'Лучше: '+esc(st.opts[st.best])+'.'}</b> ${txg(st.why)}</div>
        <div class="panel tight stack-s" style="background:transparent"><span class="eyebrow">Что сейчас у соперника</span>${bucketsHTML(st.range)}<p style="font-size:14px">${txg(st.rangeNote)}</p></div>
        ${st.rule?`<div class="rule"><span class="eyebrow">Правило</span><p>${txg(st.rule)}</p></div>`:''}
        <div class="row"><button class="btn primary" data-act="hp-next">${cur===H.steps.length-1?'Итог раздачи':'Следующая улица'}</button></div>`:''}
    </div>`;
  }else{
    const c=H.steps.filter((st,i)=>HP.picks[i]===st.best).length;
    const idx=HANDS.indexOf(H);const nx=HANDS.slice(idx+1).find(h=>!(S.hands&&S.hands[h.id]))||HANDS[idx+1];
    body=`<div class="panel stack"><span class="eyebrow">Итог</span><div class="row" style="align-items:flex-end;gap:14px"><span class="big-num">${c}/${H.steps.length}</span><span class="muted" style="padding-bottom:8px">${c===H.steps.length?'Сыграно идеально.':'Перечитай разборы улиц выше: важен ход мысли.'}</span></div>
      <div class="rule"><span class="eyebrow">Главный урок</span><p>${txg(H.summary)}</p></div>
      <div class="row">${nx?`<button class="btn primary" data-act="hp-open" data-id="${nx.id}">Следующая раздача</button>`:''}<button class="btn" data-act="hp-again">Сыграть заново</button><button class="btn" data-act="hp-back">Все раздачи</button></div></div>`;
  }
  return `<div class="row"><button class="btn small" data-act="hp-back">← Все раздачи</button></div>
    <div class="panel stack-s"><span class="eyebrow">${esc(H.format)}</span><h2>${esc(H.title)}</h2>
      <div class="row" style="gap:14px"><span class="cards">${cardsOf(H.hero)}</span><div class="stack-s" style="gap:2px;min-width:0;flex:1"><span>Ты: <b>${esc(H.heroPos)}</b>, стек <b class="mono">${esc(H.stack)}бб</b></span><span class="muted" style="font-size:14px">Соперник (${esc(H.villainPos)}): ${txg(H.villain)}</span></div></div></div>
    ${past}${body}`;
}
ACTS['hp-open']=(el)=>{HP.open=el.dataset.id;HP.step=0;HP.picks=[];go('hands')};
ACTS['hp-back']=()=>{HP.open=null;render();window.scrollTo({top:0})};
ACTS['hp-again']=()=>{HP.step=0;HP.picks=[];render();window.scrollTo({top:0})};
ACTS['hp-pick']=(el)=>{if(HP.picks[HP.step]!=null)return;HP.picks[HP.step]=+el.dataset.k;const y=window.scrollY;render();window.scrollTo({top:y})};
ACTS['hp-next']=()=>{const H=HANDS.find(h=>h.id===HP.open);HP.step++;
  if(HP.step>=H.steps.length){const c=H.steps.filter((st,i)=>HP.picks[i]===st.best).length;S.hands=S.hands||{};const prev=S.hands[H.id];S.hands[H.id]={c,t:H.steps.length,d:today(),n:(prev&&prev.n||0)+1};
    H.steps.forEach((st,i)=>{const cat=st.street==='preflop'?'preflop':'postflop';const s=S.stats[cat]||(S.stats[cat]={c:0,t:0});s.t++;if(HP.picks[i]===st.best)s.c++});
    logEvent('hand',null,c,H.steps.length,{id:H.id});save()}
  render();const el=document.querySelector('.panel:last-of-type');if(el)el.scrollIntoView({block:'start'})};
