<title>Покерный штаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single felt "table" column; top nav of rails, each screen a stack of panels; scenarios render on a felt strip with real cards. */
:root{
  --felt:#0d3530; --felt-2:#12443d; --felt-3:#18554b;
  --rail:#2a1d14; --rail-2:#3a2a1d;
  --ink:#f1ead9; --muted:#a8bcb2; --faint:#6f8a80;
  --brass:#d9ad55; --brass-ink:#1c140a;
  --line:rgba(241,234,217,.13); --line-2:rgba(241,234,217,.22);
  --panel:rgba(5,24,21,.42);
  --paper:#f8f3e7; --paper-ink:#1b1a17;
  --s-spade:#1b1a17; --s-heart:#c8382e; --s-diam:#2463c9; --s-club:#1f7f45;
  --bk-strong:#ef7a63; --bk-medium:#e8bf55; --bk-draw:#73a9ff; --bk-air:#5e7a71;
  --good:#63d18f; --bad:#f0705f; --warn:#f0c04f; --info:#7fb7ff;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--felt);background-image:radial-gradient(ellipse 120% 70% at 50% 0%,var(--felt-3) 0%,var(--felt) 55%,#0a2b26 100%);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,5vw,36px);line-height:1.1}
h2{font-size:clamp(18px,3.4vw,22px);line-height:1.2}
h3{font-size:15px;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.grid2>*,.grid3>*{min-width:0}

/* header + nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--rail-2),var(--rail));border-bottom:1px solid #000;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{font:800 15px/1 var(--f-display);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.logo .chip{width:22px;height:22px;border-radius:50%;background:repeating-conic-gradient(var(--brass) 0 30deg,var(--paper) 30deg 60deg);box-shadow:inset 0 0 0 4px var(--rail),inset 0 0 0 5px var(--brass)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.on i{background:var(--good)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
nav.tabs button:hover{color:var(--ink)}

main{padding-top:22px}
section.screen{display:flex;flex-direction:column;gap:18px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.tight{padding:14px}
.panel h2+p,.panel h3+p{margin-top:6px}
.hero{padding-block:8px 4px;display:flex;flex-direction:column;gap:10px}
.hero p{max-width:62ch;color:var(--muted)}
.divider{height:1px;background:var(--line);border:0;margin:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 18px;font-weight:600;border:1px solid var(--line-2);background:rgba(241,234,217,.06);transition:background .15s,transform .05s}
.btn:hover{background:rgba(241,234,217,.12)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.primary:hover{background:#e6bd68}
.btn.small{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brass);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* chips/pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.brass{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 50%,transparent)}

/* playing cards */
.cards{display:inline-flex;gap:5px;flex-wrap:wrap}
.pc{width:40px;height:56px;border-radius:6px;background:var(--paper);color:var(--paper-ink);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font:700 19px/1 var(--f-mono);box-shadow:0 2px 0 rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.25);position:relative}
.pc .s{font-size:17px;margin-top:2px;font-family:system-ui,sans-serif}
.st{font-family:system-ui,sans-serif;font-weight:700}.st.h{color:#ff6b5e}.st.d{color:#7fb0ff}.st.c{color:#5fd28d}.st.s{color:var(--ink)}
.pc.h{color:var(--s-heart)} .pc.d{color:var(--s-diam)} .pc.c{color:var(--s-club)} .pc.s_{color:var(--s-spade)}
.pc.back{background:repeating-linear-gradient(45deg,#7a2a22 0 5px,#8e352c 5px 10px);box-shadow:inset 0 0 0 3px var(--paper),0 2px 0 rgba(0,0,0,.35)}
.pc.sm{width:30px;height:42px;font-size:14px}
.pc.sm .s{font-size:13px}

/* felt table strip for scenarios */
.table{border-radius:18px;padding:16px;background:radial-gradient(ellipse at 50% 30%,#1d6a5b,#114237 75%);box-shadow:inset 0 0 0 6px var(--rail-2),inset 0 0 0 7px #000,inset 0 0 40px rgba(0,0,0,.45);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.table.nohero{grid-template-columns:1fr auto}
.table .slot{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.table .slot.mid{align-items:center}
.table .lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(241,234,217,.65);font-weight:600}
.table .nums{display:flex;flex-direction:column;gap:4px;align-items:flex-end;text-align:right}
.table .num{font:700 15px/1.1 var(--f-mono)}
.table .pos{font:700 12px/1.2 var(--f-body);color:var(--brass);text-align:center}
@media (max-width:560px){.table{grid-template-columns:1fr 1fr}.table .slot.mid{grid-column:1/-1;order:-1}.table .nums{align-items:flex-start;text-align:left}}

/* question */
.q-text{font-size:16.5px;line-height:1.6;max-width:68ch;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line-2);background:rgba(241,234,217,.04);width:100%}
.opt:hover:not([disabled]){background:rgba(241,234,217,.09);border-color:var(--brass)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--f-mono);border:1px solid var(--line-2);color:var(--muted)}
.opt.sel{border-color:var(--brass);background:rgba(217,173,85,.12)}
.opt.sel .k{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.right .k{background:var(--good);color:#0b2a1c;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.opt.wrong .k{background:var(--bad);color:#2a0b07;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{border-left:3px solid var(--brass);padding:10px 14px;background:rgba(217,173,85,.07);border-radius:0 10px 10px 0;max-width:72ch}
.why.good{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 8%,transparent)}
.why.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.conf{display:flex;gap:6px;flex-wrap:wrap}
.conf button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.conf button[aria-pressed="true"]{background:var(--ink);color:var(--felt);border-color:var(--ink)}
.progress{height:6px;border-radius:999px;background:rgba(241,234,217,.1);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brass);border-radius:999px;transition:width .3s}
.progress.timer>i{background:var(--good);transition:width .1s linear}
.progress.timer.low>i{background:var(--bad)}

/* stat tiles */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font:700 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:8px;border-radius:999px;background:rgba(241,234,217,.1);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:999px}
.bar .n{font-family:var(--f-mono);text-align:right}

/* checklist */
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--brass);flex:none}
.check label{flex:1;min-width:0}
.check .sub{font-size:13px;color:var(--muted)}
.check.done label>span:first-child{text-decoration:line-through;color:var(--muted)}

/* range grid */
.rg-wrap{overflow-x:auto}
.rg{display:grid;grid-template-columns:repeat(13,minmax(24px,1fr));gap:2px;max-width:560px;user-select:none;-webkit-user-select:none;touch-action:none}
.rg div{aspect-ratio:1;display:grid;place-items:center;font:600 clamp(8px,1.7vw,11.5px)/1 var(--f-mono);border-radius:3px;background:rgba(241,234,217,.06);color:var(--muted);cursor:pointer;position:relative}
.rg div.pair{background:rgba(241,234,217,.11)}
.rg div.on{background:var(--brass);color:var(--brass-ink)}
.rg div.ok{background:var(--good);color:#0b2a1c}
.rg div.border-in{background:color-mix(in srgb,var(--warn) 70%,transparent);color:#2a2005}
.rg div.border-out{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn) 70%,transparent);color:var(--warn)}
.rg div.extra{background:var(--bad);color:#2a0b07}
.rg div.miss{background:transparent;box-shadow:inset 0 0 0 2px var(--info);color:var(--info)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:rgba(0,0,0,.25);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:120px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--brass)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:7px 11px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--brass);color:var(--ink);background:rgba(217,173,85,.14)}

/* AI output */
.ai-out{white-space:pre-wrap;line-height:1.65;max-width:76ch;font-size:15px}
.ai-out h4{font:700 14px/1.3 var(--f-display);margin:14px 0 4px;color:var(--brass)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:min(76ch,100%);white-space:pre-wrap;line-height:1.6}
.msg.me{align-self:flex-end;background:rgba(217,173,85,.16);border:1px solid color-mix(in srgb,var(--brass) 40%,transparent)}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}

/* week plan */
.week{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.week>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel)}
.week>summary::-webkit-details-marker{display:none}
.week[open]>summary{border-bottom:1px solid var(--line)}
.week .wb{padding:12px 16px}
.wk-n{font:800 12px/1 var(--f-display);color:var(--brass);letter-spacing:.06em}

.term{border-bottom:1.5px dotted color-mix(in srgb,var(--brass) 80%,transparent);cursor:help}
.term:hover,.term:focus{color:var(--brass);outline:none}
#pop{position:fixed;z-index:60;background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:10px 13px;font-size:14px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:3px}
#pop b{font-weight:700}
#pop[hidden],[hidden]{display:none!important}
.lesson{max-width:72ch}
.lesson h1{margin-bottom:4px}
.lp{font-size:16px;line-height:1.65}
.ll{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15.5px;line-height:1.55}
.rule{border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);background:rgba(217,173,85,.1);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.rule p{font-size:16px;font-weight:600;line-height:1.5}
table.lt td{font-size:14.5px;line-height:1.5}
table.lt td.lt-first{font-weight:600;white-space:nowrap}
.ex{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--panel)}
.ex>p{font-size:15.5px}
.lcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:10px;border:1px solid var(--line-2);background:rgba(241,234,217,.04);min-width:0}
.lcard:hover{border-color:var(--brass);background:rgba(241,234,217,.08)}
.lcard b{font-size:15.5px;line-height:1.35}
.bk{display:flex;flex-direction:column;gap:7px}
.bk-t{font-size:13px;font-weight:600;color:var(--muted)}
.bk-bar{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px;background:rgba(241,234,217,.06)}
.bk-bar i{display:block;height:100%}
.bk-l{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.bk-l i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}
.bk-l b{color:var(--ink)}
.rg.ro div{cursor:default}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--paper-ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:50}
.big-num{font:800 clamp(40px,9vw,64px)/1 var(--f-display);letter-spacing:-.02em}
.archetype{border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);background:linear-gradient(135deg,rgba(217,173,85,.12),rgba(217,173,85,.02));border-radius:var(--r);padding:18px}
svg text{font-family:var(--f-body)}
table.mini{border-collapse:collapse;width:100%;font-size:13.5px}
table.mini th,table.mini td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.mini th{color:var(--muted);font-weight:600;font-size:12px}
.scroll-x{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo"><span class="chip" aria-hidden="true"></span>ПОКЕРНЫЙ ШТАБ</div>
      <div class="sync" id="sync"><i></i><span>Прогресс хранится в этом браузере</span></div>
    </div>

  </div>
</header>
<div class="wrap"><main id="main"></main></div>

<div id="pop" hidden></div>

<script>
const BANK=[{"id":"math-01","cat":"math","level":1,"pos":"BTN vs BB","hero":"Jh Th","board":"Qd 9c 4s 2h","pot":10,"stack":80,"q":"Тёрн. Банк 10bb, оппонент ставит 5bb (полбанка). Какое минимальное эквити нужно, чтобы колл был безубыточным (без учёта будущих улиц)?","opts":["50%","33%","20%","25%"],"ans":3,"why":"Ты платишь 5, чтобы выиграть итоговый банк 10 + 5 + 5 = 20. Требуемое эквити = колл / итоговый банк = 5/20 = 25%. Частая ошибка — делить колл на банк до своего колла (5/15 = 33%). Держи в голове опорные точки: ставка 1/2 банка → 25%, 2/3 → 28.6%, банк → 33%, 2 банка → 40%. Кстати, у тебя здесь OESD (8 аутов ≈ 17%) — без имплайд-оддсов это фолд.","tag":"пот-оддсы"},{"id":"math-02","cat":"math","level":1,"pos":"BB vs BTN","hero":"","board":"","pot":null,"stack":null,"q":"Ривер. Оппонент ставит 3/4 банка. Какую минимальную долю своего диапазона ты должен продолжать (MDF), чтобы его блеф любыми двумя картами не был автоматически прибыльным?","opts":["57%","50%","75%","43%"],"ans":0,"why":"Блеф оппонента рискует 0.75 банка, чтобы выиграть 1 банк, поэтому ему нужно 0.75/1.75 ≈ 43% фолдов. MDF — дополнение до 100%: 1/(1 + 0.75) ≈ 57%. Формула MDF = банк / (банк + ставка). Помни, что MDF — ориентир против сбалансированного оппонента; против того, кто недоблефовывает, можно фолдить чаще.","tag":"MDF"},{"id":"math-03","cat":"math","level":2,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Ты ставишь на ривере 2/3 банка поляризованным диапазоном. В нём 20 вэлью-комбо. Сколько блеф-комбо нужно добавить, чтобы оппоненту было безразлично, коллировать блефкэтчером или нет?","opts":["10","8","20","13"],"ans":1,"why":"Сначала считаем, сколько эквити нужно коллеру: он платит 2/3, чтобы выиграть 1 + 2/3 + 2/3 = 7/3, то есть (2/3)/(7/3) = 2/7 ≈ 28.6%. Значит, блефы должны составлять 2/7 диапазона ставки, а вэлью — 5/7; соотношение блеф:вэлью = 2:5. При 20 вэлью-комбо это 20 × 2/5 = 8 блефов. Ответ 10 был бы верен для ставки в банк (1:2).","tag":"соотношение блефа и вэлью"},{"id":"math-04","cat":"math","level":1,"pos":"BTN vs BB","hero":"","board":"","pot":9,"stack":90,"q":"Банк 9bb. Ты хочешь поставить 6bb чистым блефом (с нулевым эквити). Как часто оппонент должен фолдить, чтобы блеф был безубыточным?","opts":["40%","60%","67%","33%"],"ans":0,"why":"Чистый блеф рискует ставку, чтобы выиграть банк: нужная доля фолдов = ставка / (банк + ставка) = 6 / (9 + 6) = 40%. Это зеркало пот-оддсов коллера: он получает 15 к 6, то есть ему нужно 40% эквити против твоего блефа. Если у твоей руки есть эквити (дро), нужная фолд-эквити ниже.","tag":"фолд-эквити"},{"id":"math-05","cat":"math","level":2,"pos":"BTN vs BB","hero":"Ah 8h","board":"Kh 9h 4c 2s","pot":30,"stack":15,"q":"Тёрн. У тебя натсовое флеш-дро (считаем 9 чистых аутов). Банк 30bb, оппонент идёт олл-ин на 15bb (больше фишек нет). Что верно?","opts":["Эквити ≈ 36% (правило 4) — колл","Эквити ≈ 19.6%, нужно 25% — фолд","Эквити ≈ 19.6%, нужно 20% — колл","Эквити ≈ 25% — колл безубыточен"],"ans":1,"why":"До ривера одна карта, поэтому эквити = 9/46 ≈ 19.6% (правило 2 даёт ≈ 18%). Колл 15bb в итоговый банк 30 + 15 + 15 = 60bb требует 15/60 = 25%. Оппонент уже олл-ин, имплайд-оддсов нет, так что колл в минус. Правило 4 применяется только на флопе, когда впереди две карты и оппонент олл-ин.","tag":"ауты и пот-оддсы"},{"id":"math-06","cat":"math","level":2,"pos":"BTN vs BB","hero":"Kh Qh","board":"As 7d 2c","pot":null,"stack":null,"q":"Считаем, что вэлью-диапазон оппонента на этом флопе — AA, 77, 22 и AK (все масти). У тебя K♥Q♥. Сколько у него вэлью-комбинаций?","opts":["18","15","21","24"],"ans":0,"why":"Считаем с учётом карт на столе и твоих блокеров. AA: на борде лежит A♠, осталось 3 туза → C(3,2) = 3 комбо. 77 и 22: аналогично по 3. AK: 3 туза × 3 короля (K♥ у тебя) = 9 вместо 16. Итого 3 + 3 + 3 + 9 = 18. Твой K♥ убрал 3 комбо AK — блокеры заметно меняют пропорции диапазона.","tag":"подсчёт комбо"},{"id":"math-07","cat":"math","level":3,"pos":"BB vs BTN","hero":"Jh Th","board":"Qd 9c 4s 2h","pot":10,"stack":80,"q":"Тёрн. У тебя OESD (8 аутов, эквити ≈ 8/46 ≈ 17%). Банк 10bb, оппонент ставит 5bb. Какую сумму в среднем нужно дополнительно выигрывать на ривере, когда доезжаешь, чтобы колл стал безубыточным?","opts":["~9bb","~25bb","~15bb","~4bb"],"ans":0,"why":"Составим уравнение EV: при попадании (8/46) выигрываешь 10 + 5 = 15bb плюс X на ривере, при промахе (38/46) теряешь 5bb. 8 × (15 + X) = 38 × 5 = 190 → 15 + X = 23.75 → X ≈ 8.75bb. Нужно добирать около 9bb (чуть больше половины текущего банка) — реалистично против стики-оппонента, сомнительно против того, кто хорошо читает доехавшие дро.","tag":"имплайд-оддсы"},{"id":"math-08","cat":"math","level":2,"pos":"BTN vs BB","hero":"9h 8h","board":"7h 6c 2h","pot":null,"stack":null,"q":"Флоп. У тебя 9♥8♥ на 7♥6♣2♥. Сколько у тебя аутов на флеш или стрит (без двойного счёта)?","opts":["15","17","12","13"],"ans":0,"why":"Флеш: 13 червей − 2 у тебя − 2 на борде = 9 аутов. Стрит: десятки и пятёрки = 8 карт, но T♥ и 5♥ уже посчитаны во флеше, поэтому добавляем 6. Итого 15 аутов. До ривера это ≈ 54% (точный расчёт: 1 − 32/47 × 31/46). Правило 4 даёт 60% и при большом числе аутов переоценивает эквити.","tag":"подсчёт аутов"},{"id":"math-09","cat":"math","level":3,"pos":"BTN vs BB","hero":"","board":"","pot":10,"stack":45,"q":"Банк на флопе 10bb, эффективный стек 45bb. Какой примерно одинаковый сайзинг (в % от банка) на флопе, тёрне и ривере доводит до олл-ина ровно к ривере (геометрический сайзинг)?","opts":["~58%","~75%","~33%","~100%"],"ans":0,"why":"Итоговый банк при олл-ине: 10 + 2 × 45 = 100bb, то есть банк должен вырасти в 10 раз за три улицы. Каждая ставка f (доля банка) с коллом умножает банк на (1 + 2f), значит (1 + 2f)³ = 10 → 1 + 2f ≈ 2.154 → f ≈ 0.58. Проверка: 10 → 21.5 → 46.4 → 100. Геометрический сайзинг максимизирует давление при поляризованном диапазоне.","tag":"геометрический сайзинг"},{"id":"math-10","cat":"math","level":2,"pos":"BB vs BTN","hero":"","board":"","pot":30,"stack":30,"q":"Ривер. Банк 30bb, оппонент идёт олл-ин на 30bb. Ты оцениваешь, что он блефует в 40% случаев, а твой блефкэтчер бьёт только блефы. Каково EV колла?","opts":["0","+12bb","+6bb","−6bb"],"ans":2,"why":"EV(колл) = P(блеф) × (банк + его ставка) − P(вэлью) × колл = 0.4 × 60 − 0.6 × 30 = 24 − 18 = +6bb. Проверка через пот-оддсы: нужно 30/90 ≈ 33%, а у тебя 40% — колл в плюс. Считать EV в бб полезно: сразу видно, насколько решение важное, а не только его знак.","tag":"EV"},{"id":"ranges-01","cat":"ranges","level":2,"pos":"BTN vs BB","hero":"","board":"Kd 7c 2s","pot":null,"stack":null,"q":"100bb. Ты открылся с BTN, BB заколлировал. Флоп K♦7♣2♠, ты ставишь 33%, BB делает чек-рейз. Какая категория рук МЕНЕЕ всего вероятна в его диапазоне чек-рейза?","opts":["Слабые руки с бэкдор-дро (6♠5♠, 5♦4♦) как блефы","77 / 22 (сеты)","K7s / K2s (две пары)","AK"],"ans":3,"why":"Начинай чтение диапазона с префлопа. Против открытия BTN игрок с BB 3-бетит AK практически всегда, поэтому в его колл-диапазоне AK почти нет. Сеты 77/22 и одномастные K7/K2 у него есть, а блефы с бэкдорами — стандартная часть сбалансированного чек-рейза. Вывод: на K72r чек-рейз BB поляризован — сеты, две пары и полублефы, без топ-пары с топ-кикером.","tag":"чтение диапазона"},{"id":"ranges-02","cat":"ranges","level":2,"pos":"","hero":"Th Tc","board":"Qs Jh 4d 9c 2s","pot":null,"stack":null,"q":"У тебя T♥T♣. Ривер Q♠J♥4♦9♣2♠. Если KT целиком входит в диапазон оппонента, сколько у него комбинаций стрита KT?","opts":["4","16","12","8"],"ans":3,"why":"Без блокеров KT — это 16 комбо (4 × 4). Но две десятки у тебя на руках, значит у оппонента может быть только T♠ или T♦: 4 короля × 2 десятки = 8 комбо. Твоя рука вдвое сократила его самый сильный стрит — это важный аргумент в пользу колла блефкэтчером или тонкого вэлью-бета.","tag":"блокеры"},{"id":"ranges-03","cat":"ranges","level":1,"pos":"BTN vs BB","hero":"","board":"9s 8s 2d 4h","pot":null,"stack":null,"q":"Оппонент-рег на тёрне 9♠8♠2♦4♥ ставит овербет 150% банка. Как лучше всего описать его диапазон?","opts":["Мерджед: от слабых пар до натсов в равных долях","Только дро: сильные руки он чекал бы в ловушку","Сжатый: в основном средние пары вроде 9x со слабым кикером","Поляризованный: сильные руки (сеты, две пары, сильные оверпары) + дро и блефы"],"ans":3,"why":"Большой сайзинг почти всегда означает поляризацию: овербетить выгодно рукам, которые хотят максимального банка, и блефам, которым нужна максимальная фолд-эквити. Средние руки вроде слабой 9x не хотят раздувать банк: против овербета их обыгрывает всё, что заколлирует. Поэтому середина диапазона у овербетящего рега почти отсутствует.","tag":"поляризация"},{"id":"ranges-04","cat":"ranges","level":2,"pos":"BTN vs BB","hero":"","board":"Ts 9s 3h 2c As","pot":null,"stack":null,"q":"Ты BTN. Флоп T♠9♠3♥: BB чек, ты ставишь 33%, BB коллирует. Тёрн 2♣: чек, ты ставишь 75%, колл. Ривер A♠, BB лидирует 75% банка. Какая категория рук составляет основную часть его вэлью?","opts":["T9 — две пары с флопа","Флеши — пиковые дро, которые доехали","Ax — топ-пара, пришедшая на ривере","Сеты 33/22"],"ans":1,"why":"Восстанавливаем линию: коллы флопа и тёрна на T♠9♠ двухмастке дают диапазон с большим количеством пиковых дро. A♠ замыкает флеш, и у BB появилось много флешей, а лид в незащищённую позицию типичен для того, у кого ривер улучшил диапазон. T9 и сеты часто чек-рейзили бы раньше, а Ax без пик редко доживает до ривера после двух коллов. Значит, его вэлью — в основном флеши.","tag":"чтение линии"},{"id":"ranges-05","cat":"ranges","level":2,"pos":"BB vs BTN","hero":"","board":"Kc 7d 2h 5s","pot":null,"stack":null,"q":"Ты BB. Флоп K♣7♦2♥: ты чек, BTN чекает в ответ (на этой текстуре BTN обычно ставит маленьким сайзингом почти весь диапазон). Тёрн 5♠. Как лучше описать диапазон BTN?","opts":["Ограниченный (capped): в основном средние и слабые пары, A-хай и воздух, сильных Kx мало","Поляризованный: натсы и воздух без середины","Только воздух","Сильный: много Kx и сетов, которые он слоуплеит"],"ans":0,"why":"Задай себе вопрос: что делает этот игрок с сильными руками на этой улице? На K72r BTN выгодно ставить почти всё, особенно Kx, которым нужна защита и вэлью. Чек-бэк убирает большую часть сильных рук, и диапазон становится ограниченным (capped), хотя редкие ловушки остаются. Это повод для BB активно ставить на тёрне (probe) с вэлью и блефами.","tag":"capped-диапазон"},{"id":"ranges-06","cat":"ranges","level":2,"pos":"BB vs UTG","hero":"","board":"7h 6h 5c","pot":null,"stack":null,"q":"UTG открывается (диапазон около 15%), ты коллируешь с BB. Флоп 7♥6♥5♣. У кого преимущество в натсах (стриты, сеты, две пары)?","opts":["У BB: в его защите больше стритов (98, 84s, 43s) и двух пар (76, 75, 65)","У UTG: у него больше оверпар","Примерно поровну: у обоих много сетов","У UTG: его префлоп-диапазон сильнее"],"ans":0,"why":"Разделяй преимущество по эквити и по натсам. Узкий диапазон UTG состоит из бродвеев и пар: оверпары дают ему эквити, но стритов и двух пар у него мало. Широкая защита BB включает стриты 98, 84s, 43s и заметно больше комбинаций двух пар 76/75/65 — на этой текстуре у него больше натсов. Поэтому префлоп-рейзер здесь ставит реже, а BB может чаще чек-рейзить.","tag":"преимущество в натсах"},{"id":"ranges-07","cat":"ranges","level":1,"pos":"CO vs UTG (лимпер)","hero":"","board":"","pot":null,"stack":null,"q":"Микролимиты. Пассивный любитель (VPIP 30 / PFR 4) лимпит с UTG. Ты рейзишь с CO до 4bb, он делает лимп-рейз до 14bb. Из чего в основном состоит его диапазон?","opts":["Широкий диапазон блефов: лимп-рейз — это трюк","AA/KK (иногда QQ/AK)","Средние пары, которые не хотят играть постфлоп","Одномастные коннекторы"],"ans":1,"why":"Соотнеси действие с профилем: игрок с PFR 4% почти никогда не проявляет агрессию префлоп, и лимп-рейз для него — самая редкая и самая сильная линия. Среди пассивных любителей лимп-рейз — это классическая ловушка с AA/KK. QQ/JJ и AK здесь в лучшем случае маргинальны, а блефы встречаются крайне редко.","tag":"диапазон по профилю"},{"id":"ranges-08","cat":"ranges","level":1,"pos":"SB vs BTN","hero":"","board":"","pot":null,"stack":null,"q":"100bb. BTN открывается, SB делает 3-бет, BTN коллирует (не 4-бетит). Как лучше всего описать колл-диапазон BTN?","opts":["Случайные руки","Поляризованный: AA/KK + слабые блефы","Только премиум: он слоуплеит в позиции","Сжатый (condensed): средние пары, одномастные бродвеи, одномастные Ax; верх в основном уходит в 4-бет, мусор — в фолд"],"ans":3,"why":"Разложи диапазон по трём действиям: 4-бет забирает большую часть верха (KK+, часть AK) и блефы с блокерами, фолд — слабые руки. Коллируют руки средней силы с хорошей играбельностью в позиции: 99–TT, AQs, KQs, JTs и т.п. Такой сжатый диапазон редко имеет натсы на флопе, но и редко полный воздух — это определяет сайзинги 3-беттора.","tag":"сжатый диапазон"},{"id":"ranges-09","cat":"ranges","level":3,"pos":"","hero":"","board":"Kc 9d 5h","pot":null,"stack":null,"q":"Допустим, вэлью-часть чек-рейза оппонента на флопе K♣9♦5♥ — это сеты (KK, 99, 55) и только одномастные K9s и 95s (разномастные он сбросил префлоп). Сколько это комбинаций?","opts":["17","11","15","13"],"ans":3,"why":"Сеты: по одной карте каждого достоинства на борде, осталось по 3 → C(3,2) = 3 комбо на каждый сет, итого 9. K9s: трефовый король и бубновая девятка на борде, поэтому возможны только пики и черви → 2 комбо. 95s: девятка бубен и пятёрка червей на борде, остаются трефы и пики → 2 комбо. Итого 9 + 2 + 2 = 13. Одномастные руки особенно сильно страдают от карт на борде.","tag":"подсчёт комбо"},{"id":"ranges-10","cat":"ranges","level":1,"pos":"UTG vs BTN, BB (мультивей)","hero":"","board":"Ah Kd 4s","pot":null,"stack":null,"q":"100bb. UTG открывается, BTN коллирует, BB коллирует. Флоп A♥K♦4♠. В чьём диапазоне больше всего AA/KK/AK?","opts":["Примерно поровну","У BTN — он в позиции","У BB — у него самый широкий диапазон","У UTG"],"ans":3,"why":"Вспомни, какие руки каждый игрок 3-бетит префлоп. BTN и BB против открытия почти всегда 3-бетят AA, KK и AK, поэтому в их колл-диапазонах этих рук почти нет — они ограничены сверху. У UTG все эти комбинации остаются в диапазоне открытия. Значит, на A-K-x мультивей преимущество в натсах у префлоп-рейзера.","tag":"capped-диапазон"},{"id":"postflop-01","cat":"postflop","level":1,"pos":"BTN vs BB","hero":"","board":"Ks 7d 2c","pot":5.5,"stack":97.5,"q":"SRP, 100bb. Ты открылся с BTN, BB заколлировал и чекает. Флоп K♠7♦2♣. Какая стратегия c-bet оптимальна для твоего диапазона?","opts":["Ставить 75% только с сильными руками и дро, остальное чекать","Овербет 150% поляризованным диапазоном","Чекать весь диапазон: BB много защищает","Маленький сайзинг (25–33%) с очень высокой частотой"],"ans":3,"why":"Оцени текстуру: сухой борд с высокой картой, без дро. У BTN преимущество и по эквити (больше Kx и оверпар), и по натсам (KK/AK BB обычно 3-бетит). Когда защищать нечего, а преимущество у тебя, маленькая ставка выгодна почти со всем диапазоном: оппоненту приходится фолдить много слабых рук или коллировать с плохими оддсами.","tag":"размер ставки"},{"id":"postflop-02","cat":"postflop","level":2,"pos":"BTN vs BB","hero":"","board":"6h 5h 4c","pot":5.5,"stack":97.5,"q":"SRP, 100bb, BTN vs BB. Флоп 6♥5♥4♣, BB чекает. Как должна выглядеть стратегия BTN по сравнению с бордом K72r?","opts":["Снизить частоту c-bet: чекать значительную часть диапазона, ставить более поляризованно","Ставить 33% почти весь диапазон, как на K72r","Ставить только с сетами и стритами","Всегда ставить банк, чтобы защитить оверпары"],"ans":0,"why":"Низкий связанный борд попадает в диапазон защиты BB: стриты (87, 73s, 32s), две пары (65, 64, 54) и сеты. Преимущество по натсам переходит к BB, а оверпары BTN уязвимы и не любят чек-рейз. Поэтому IP-рейзер чекает гораздо чаще и не ставит весь диапазон маленьким сайзингом. Принцип: частота c-bet зависит от того, у кого преимущество по диапазону и натсам на конкретной текстуре.","tag":"текстура борда"},{"id":"postflop-03","cat":"postflop","level":2,"pos":"BTN vs BB","hero":"","board":"Ks 7d 2c","pot":null,"stack":null,"q":"SRP. Флоп K♠7♦2♣: ты (BTN) ставишь 33%, BB коллирует. Какая карта тёрна лучше всего подходит для второго барреля широким диапазоном?","opts":["7♥","6♦","5♣","A♥"],"ans":3,"why":"Думай о том, чей диапазон улучшает карта. Туз попадает в диапазон BTN: AK, AA (BB обычно 3-бетит их префлоп) и много Ax-бродвеев, а у BB, который просто коллирует, сильных Ax мало. Шестёрка и пятёрка соединяются с коллирующим диапазоном BB (65, 64, 54, 86s, сеты), а спаривание семёркой довольно нейтрально. Лучшие карты для баррелей — те, что усиливают твой диапазон относительно диапазона оппонента.","tag":"баррели на тёрне"},{"id":"postflop-04","cat":"postflop","level":3,"pos":"BTN vs BB","hero":"","board":"Qc 9h 5h 2s 3h","pot":null,"stack":null,"q":"SRP. Флоп Q♣9♥5♥: ты c-bet 33%, BB колл. Тёрн 2♠: чек-чек. Ривер 3♥ (замкнулся флеш), BB чекает. Какую руку из своего диапазона лучше всего выбрать для блефа?","opts":["A♥K♠","Q♠J♠","8♦7♦","J♣T♣"],"ans":0,"why":"Хорошему блефу нужны слабая шоудаун-велью и полезные блокеры. Q♠J♠ — топ-пара, она выигрывает на вскрытии, её не нужно превращать в блеф. A♥K♠ блокирует натсовый флеш, поэтому оппонент не может иметь A♥x♥ и реже имеет самые сильные руки для колла или чек-рейза, а твоя ставка правдоподобно выглядит как флеш. J♣T♣ и 8♦7♦ ничего полезного не блокируют, поэтому как блефы они слабее.","tag":"блокеры"},{"id":"postflop-05","cat":"postflop","level":2,"pos":"BTN vs BB","hero":"Kd Td","board":"Ks 8d 4c 2h 6s","pot":10,"stack":95.5,"q":"SRP. Флоп K♠8♦4♣: ты c-bet 33%, BB колл. Тёрн 2♥: чек-чек. Ривер 6♠, BB снова чекает. У тебя K♦T♦. Что лучше?","opts":["Овербет 150%","Чек: показать руку на вскрытии бесплатно","Бет 33–50% для тонкого вэлью","Олл-ин"],"ans":2,"why":"Спроси себя, какие худшие руки заплатят. Диапазон BB после двух чеков ограничен: много 8x, 4x, 6x, пар 55–77 и слабых Kx (K5, K3, K9 и т.п.), а твоя K♦T♦ бьёт большую их часть. Небольшая ставка получает коллы от этих рук, а сильные руки (сеты, две пары) BB обычно разыграл бы иначе раньше. Овербет оставит в колле только то, что тебя бьёт.","tag":"тонкое вэлью"},{"id":"postflop-06","cat":"postflop","level":3,"pos":"BB vs BTN","hero":"Ts 8s","board":"9s 7d 3c 2h 6d","pot":10,"stack":95.5,"q":"SRP. Ты BB. Флоп 9♠7♦3♣: чек, BTN ставит 33%, ты коллируешь с T♠8♠. Тёрн 2♥: чек-чек. Ривер 6♦ — у тебя натсовый стрит. Твоё действие?","opts":["Лид овербетом ~125% банка","Лид 25–33%","Чек-колл","Чек с планом чек-рейза"],"ans":0,"why":"Сравни диапазоны на ривере. Чек-бэк BTN на тёрне убирает из его диапазона большую часть сетов, двух пар и сильных оверпар, которые ставили бы для вэлью и защиты, поэтому его диапазон ограничен. Твой диапазон содержит натсы и сильные стриты (T8, 85, 54), и это делает уместным поляризованный большой лид. Если чекнуть, ограниченный диапазон BTN часто тоже чекнет, и вэлью будет упущено.","tag":"овербет"},{"id":"postflop-07","cat":"postflop","level":1,"pos":"BB vs BTN","hero":"Ad 9c","board":"Kh 9d 5s 3c 2h","pot":20,"stack":70,"q":"Ривер. Банк 20bb, оппонент ставит 5bb (25% банка). У тебя вторая пара с тузом-кикером. Что делать?","opts":["Фолд: на ривере он ставит только вэлью","Рейз для вэлью","Колл"],"ans":2,"why":"Сначала считай цену: колл 5bb в итоговый банк 30bb требует всего 16.7% эквити, а MDF против 1/4 банка — 80%. Даже если блефов в диапазоне оппонента немного, с такими оддсами вторая пара — обязательный колл. Рейз превращает руку в блеф: заколлирует то, что тебя бьёт, а сфолдят блефы.","tag":"блефкэтчинг"},{"id":"postflop-08","cat":"postflop","level":2,"pos":"BTN vs CO (3-бет пот)","hero":"Qh Qd","board":"Jd 7c 2s","pot":17.5,"stack":32,"q":"3-бет пот, эффективный стек 40bb: CO открылся на 2.5bb, ты 3-бетнул с BTN до 8bb, CO заколлировал. Банк 17.5bb, за спиной 32bb (SPR ≈ 1.8). Флоп J♦7♣2♠, CO чекает. У тебя QQ. План?","opts":["Бет ~1/3 банка и готовность поставить весь стек при любом ответе","Чек назад для контроля банка","Бет и фолд на чек-рейз","Чек и фолд на ставку тёрна"],"ans":0,"why":"Первым делом посмотри на SPR. При SPR около 1.8 оверпара — рука для стека: оппонент заколлирует или пойдёт олл-ин с Jx, 77, дро и худшими парами, а фолд на чек-рейз при таком банке почти всегда ошибка (нужно лишь около 25% эквити). Чем ниже SPR, тем меньше нужна сила руки для олл-ина. Небольшая ставка всё равно позволяет вложить стек за две улицы.","tag":"SPR"},{"id":"postflop-09","cat":"postflop","level":2,"pos":"BTN vs BB","hero":"","board":"Ks Th 6h 2c 4h","pot":28,"stack":70,"q":"Ты BTN, ставил флоп и тёрн, BB коллировал. Ривер 4♥ замкнул флеш, BB лидирует 75% банка. У тебя топ-пара, и ты решил коллировать. С какой рукой колл лучше всего?","opts":["A♥K♣","K♦J♦","K♣Q♣"],"ans":0,"why":"Хороший блефкэтчер блокирует вэлью оппонента и не блокирует его блефы. Его вэлью здесь — в основном флеши, и A♥ убирает все комбинации натсового флеша, а A♥K♣ к тому же — сильнейшая топ-пара. K♣Q♣ и K♦J♦ блокируют недоехавшие стрит-дро (QJ, Q9, J9), то есть именно блефы оппонента; A♥K♣ тоже блокирует часть блефов (AQ, AJ), но эффект от A♥ гораздо важнее. Это делает их хуже как коллы.","tag":"блокеры"},{"id":"postflop-10","cat":"postflop","level":1,"pos":"UTG vs BTN, BB (мультивей)","hero":"Ac Qd","board":"Jh 8h 4s","pot":8,"stack":97.5,"q":"100bb. Ты открылся с UTG, BTN и BB заколлировали. Флоп J♥8♥4♠, BB чекает. У тебя A♣Q♦ (ни пары, ни дро). Что лучше?","opts":["Чек с планом чек-рейза","C-bet 33%: у меня инициатива","Бет 75%, чтобы выбить дро","Чек, и в основном сдаться против ставки"],"ans":3,"why":"В мультивее нужно учитывать сразу два диапазона. Шанс, что хотя бы один из двух оппонентов попал в этот связанный борд, высокий, а блеф должен пройти через обоих. У A♣Q♦ нет бэкдор-флеша, нет стрит-дро, а оверкарты часто не чистые. Мультивей c-bet должен быть тяжелее по вэлью, а чистый воздух без эквити — чек.","tag":"мультивей"},{"id":"exploit-01","cat":"exploit","level":1,"pos":"BTN vs BB","hero":"Qh Jh","board":"Kh 9h 4c 7s 2d","pot":20,"stack":80,"q":"Оппонент — колл-станция: VPIP 55 / PFR 8, WTSD 42%, на ставку на ривере фолдит около 20%. Ты ставил флоп и тёрн, он коллировал. Ривер 2♦ — твоё флеш-дро и гатшот не доехали. Он чекает. Действие?","opts":["Маленький блеф 33% — это дёшево","Блеф овербетом — уж это он сфолдит","Чек, сдаться","Блеф 75% банка"],"ans":2,"why":"Блеф выгоден, только если оппонент фолдит чаще, чем требует сайзинг: 33% банка требует 25% фолдов, 75% — 43%. Этот игрок фолдит около 20% и коллирует по силе руки, а не по сайзингу, поэтому любой блеф теряет деньги. Против колл-станции эксплойт простой: максимальное вэлью и минимум блефов.","tag":"против колл-станции"},{"id":"exploit-02","cat":"exploit","level":2,"pos":"BTN vs CO","hero":"Kh 9h","board":"","pot":4,"stack":100,"q":"100bb. Рег на CO открывается около 30% рук и фолдит на 3-бет 78% (выборка большая). Ты на BTN с K♥9♥. Лучший эксплойт?","opts":["Фолд: K9s слабая рука","Олл-ин 100bb","Колл в позиции","3-бет до ~7.5–8bb"],"ans":3,"why":"Посчитай, сколько стоит блеф: 3-бет до 8bb рискует 8, чтобы выиграть ~4bb мёртвых денег, то есть нужно около 67% фолдов. Здесь их 78%, и 3-бет прибылен ещё до учёта эквити K9s и игры в позиции после колла. Против опенера, который перефолдивает на 3-бет, расширяй 3-бет-блефы руками с блокерами и играбельностью.","tag":"перефолд на 3-бет"},{"id":"exploit-03","cat":"exploit","level":2,"pos":"BTN vs BB","hero":"Kd Qd","board":"Ks Qc 7d 4h 9s","pot":30,"stack":70,"q":"Пассивный любитель: AF 1.1, за 4000 рук ни разу не показал рейз на ривере без натсов. Ривер K♠Q♣7♦4♥9♠. Ты ставишь 20bb в банк 30bb с топ-двумя парами, он рейзит до 60bb. Действие?","opts":["Колл: у меня топ-две пары","Фолд","Олл-ин: так он может играть и две пары"],"ans":1,"why":"Пот-оддсы хорошие: колл 40bb в итоговый банк 150bb требует около 27%. Но важно, есть ли у этого игрока в такой линии хоть какие-то блефы и худшие руки. При его профиле рейз на ривере — это JT (стрит), сеты 99/77/44, а рук, которые проигрывают K♦Q♦, там почти нет. Если блефов около 0%, никакие оддсы не спасают колл. Это классический эксплойт: пассивная популяция сильно недоблефовывает рейзами на ривере.","tag":"недоблеф на ривере"},{"id":"exploit-04","cat":"exploit","level":2,"pos":"BB vs BTN","hero":"Kh Jd","board":"Kc 8s 3d 2h","pot":9,"stack":96,"q":"Оппонент на BTN — маньяк: AF 5, ставит в чек около 85% на любой улице и часто баррелит воздухом. Ты защитил BB, флоп K♣8♠3♦ — чек-колл. Тёрн 2♥, у тебя топ-пара K♥J♦. Что лучше?","opts":["Чек-фолд: раз он ставит, значит силён","Чек-рейз олл-ин","Донк 75% для защиты","Чек, с планом коллировать"],"ans":3,"why":"Подумай, как сделать так, чтобы ошибки совершал оппонент. Если ты ставишь сам, маньяк выкинет воздух и продолжит только с тем, что тебя бьёт. Если чекаешь, его воздух сам ставит в тебя. Чек-рейз превращает топ-пару в блеф. Против гиперагрессора с блефкэтчером лучше отдать ему инициативу и коллировать.","tag":"против маньяка"},{"id":"exploit-05","cat":"exploit","level":2,"pos":"BTN vs CO","hero":"8s 7s","board":"Qd 6c 2h","pot":6.5,"stack":97.5,"q":"CO открылся, ты заколлировал на BTN. Статистика CO: c-bet флоп 85%, c-bet тёрн 28%, фолд на ставку на тёрне после своего чека 70%. Флоп Q♦6♣2♥, он ставит 1/3 банка. У тебя 8♠7♠ (бэкдор-стрит). Лучший эксплойт?","opts":["Колл, а на тёрне чек-бэк, если он чекнет","Фолд: ни пары, ни дро","Рейз флопа","Колл (флот) с планом ставить, когда он чекнет тёрн"],"ans":3,"why":"Ищи несоответствие в статистике: на флопе он ставит почти всё, а на тёрне продолжает лишь с 28% — значит, флоп-ставка содержит много воздуха, который потом сдаётся. Дешёвый колл в позиции и ставка после его чека на тёрне используют его фолд 70%. Рейз флопа хуже: его диапазон ещё целый, а заставить его фолдить можно дешевле на тёрне.","tag":"флот"},{"id":"exploit-06","cat":"exploit","level":2,"pos":"BB vs BTN","hero":"Jc 9c","board":"Jh 8h 3c 5s 2d","pot":24,"stack":70,"q":"Любитель. За 300 рук ты несколько раз видел на вскрытии: с сильными готовыми руками он ставит 1/3–1/2 банка, а большие ставки (банк и больше) делает с дро и блефами. Ривер J♥8♥3♣5♠2♦ (флеш-дро не доехало), он ставит банк. У тебя топ-пара со слабым кикером. Действие?","opts":["Колл","Фолд: ставка в банк означает силу","Рейз олл-ин, чтобы выбить его"],"ans":0,"why":"Сайзинг-телл переворачивает обычную логику: у этого игрока большая ставка означает слабость. На ривере, где флеш-дро не доехало, ставка в банк особенно похожа на попытку сыграть промазавшим дро. Колл J9 требует 33% эквити, и здесь он прибыльный. Рейз хуже: блефы просто сфолдят, а заплатят только руки, которые тебя бьют.","tag":"сайзинг-телл"},{"id":"exploit-07","cat":"exploit","level":1,"pos":"BTN vs UTG (лимпер)","hero":"Kc Td","board":"","pot":2.5,"stack":100,"q":"Любитель: VPIP 45 / PFR 5, лимпит около 35% рук, на изо-рейз коллирует почти всегда, постфлоп играет fit-or-fold (фолд на c-bet 65%). Он лимпит с UTG, все фолдят до тебя на BTN. У тебя K♣T♦. Лучший эксплойт?","opts":["Фолд: KTo — слабая рука","Изо-рейз до ~5bb, с широким диапазоном (KTo, Ax, бродвеи, одномастные коннекторы)","Мин-рейз до 2bb","Лимпнуть следом и посмотреть флоп"],"ans":1,"why":"Выгода исходит из двух ошибок оппонента: он лимпит слабым диапазоном и потом слишком часто фолдит на c-bet. Изо-рейз в позиции с рукой лучше его диапазона даёт хеды против слабого игрока с инициативой. Крупный сайзинг уместен, потому что он всё равно коллирует. Лимп отдаёт инициативу и приглашает блайнды, а мин-рейз даёт ему отличные оддсы.","tag":"изоляция"},{"id":"exploit-08","cat":"exploit","level":2,"pos":"BTN vs UTG","hero":"Ac Kd","board":"","pot":31.5,"stack":100,"q":"Нит-рег: 4-бет 1.5%, за 5000 рук 4-бетил только AA и KK. Он открылся с UTG на 2.5bb, ты 3-бетнул с BTN до 8bb, он 4-бетнул до 22bb. У тебя A♣K♦. Лучший эксплойт?","opts":["5-бет олл-ин: AK слишком силён для фолда","Колл и олл-ин на любом флопе","Фолд","Колл и играть постфлоп"],"ans":2,"why":"Сначала сузь его диапазон и посчитай комбо: с твоими блокерами у него 3 комбо AA и 3 комбо KK. Эквити AKo примерно 12% против AA и 30% против KK, в среднем около 21%, а олл-ину нужно примерно 45% (92bb, чтобы выиграть ~201bb). Колл с SPR около 1.7 тоже минусовый: против AA ты почти никогда не выигрываешь, а KK на тузовом флопе не заплатит. Против сбалансированного рега AK — 5-бет или колл, против этого нита — фолд.","tag":"против нита"},{"id":"exploit-09","cat":"exploit","level":2,"pos":"BTN vs BB","hero":"Ah 4h","board":"Kh 9h 5c 2s 7h","pot":30,"stack":75,"q":"Оппонент — колл-станция: на ривере коллирует с любой парой почти независимо от сайзинга. Ривер K♥9♥5♣2♠7♥, ты собрал натсовый флеш A♥4♥, он чекает. Банк 30bb, стек 75bb. Сайзинг?","opts":["Бет 66%","Олл-ин ~75bb (2.5 банка)","Бет 33%: чтобы точно заколлировал","Чек: пусть ставит сам"],"ans":1,"why":"Задай себе вопрос: от чего зависит, заколлирует ли этот игрок? Если ответ — от силы руки, а не от размера ставки (неэластичный колл), каждый его колл должен стоить максимально. Против сбалансированного игрока огромная ставка сократила бы его колл-диапазон, но эта станция с Kx и даже 9x всё равно заплатит. Чек — риск, что пассивный игрок тоже чекнет.","tag":"сайзинг для вэлью"},{"id":"exploit-10","cat":"exploit","level":2,"pos":"CO vs SB","hero":"Th Tc","board":"","pot":33.5,"stack":30,"q":"Обычно тайтовый игрок в SB только что проиграл крупный банк и явно тильтует: за последний круг 3-бет-шовнул три раза. Стек у него 30bb, у тебя больше. Ты открылся с CO до 2.5bb, он шовит 30bb, BB фолдит. У тебя TT. Действие?","opts":["Фолд: шов из SB от тайтового игрока обычно сильный","Фолд: не хочу играть флип","Колл"],"ans":2,"why":"Читай текущий диапазон, а не исторический: тильтующий игрок шовит гораздо шире, примерно 25% рук. Колл 27.5bb в итоговый банк 61bb требует около 45% эквити, а TT против такого диапазона имеет порядка 60%+. Даже против многих оверкарт это флип, а против пар ниже и слабых Ax ты фаворит.","tag":"против тильта"},{"id":"preflop-01","cat":"preflop","level":1,"pos":"SB vs BTN","hero":"7c 6d","board":"","pot":4,"stack":100,"q":"Кэш, 100bb. BTN открывается до 2.5bb. Ты в SB с 7♣6♦. Действие?","opts":["Колл","3-бет до ~11bb","Фолд"],"ans":2,"why":"Из SB ты будешь без позиции весь постфлоп, а BB может сквизить за тобой. Поэтому из SB против BTN стратегия близка к «3-бет или фолд»: колл-диапазон узкий. Разномастному 76o не хватает ни сырого эквити, ни играбельности, ни блокеров для 3-бет-блефа. Фолд.","tag":"игра из SB"},{"id":"preflop-02","cat":"preflop","level":2,"pos":"SB vs CO + BTN","hero":"Ad Qc","board":"","pot":6.5,"stack":100,"q":"100bb. CO открывается до 2.5bb, BTN коллирует. Ты в SB с A♦Q♣. Лучшее действие?","opts":["Сквиз до ~7.5bb","Колл","Фолд","Сквиз до ~12–13bb"],"ans":3,"why":"AQo из SB против открытия и колла — явный сквиз для вэлью: эта рука хорошо доминирует колл-диапазон BTN, а без позиции её неудобно играть в мультивее. Сайзинг сквиза должен быть больше обычного 3-бета: в банке больше мёртвых денег, а в маленький сквиз дешёво войдут оба оппонента. Ориентир для 3-бета из SB — около 4–5x открытия плюс ~1 открытие за каждого коллера.","tag":"сквиз"},{"id":"preflop-03","cat":"preflop","level":2,"pos":"CO vs BTN","hero":"Ac Kd","board":"","pot":12,"stack":100,"q":"100bb. Ты открылся с CO до 2.5bb, BTN 3-бетнул до 8bb, блайнды сфолдили. У тебя A♣K♦. Лучшее действие?","opts":["Фолд","4-бет олл-ин 100bb","Колл","4-бет до ~22bb"],"ans":3,"why":"Против широкого 3-бета BTN рука AKo — стандартный 4-бет для вэлью: она доминирует его AQ/AJ/KQ, блокирует AA/KK и играет хорошо при олл-ине. Сайзинг около 2.5–2.75x от 3-бета без позиции позволяет получать колл хуже и олл-ин от QQ/JJ/AQs. Олл-ин на 100bb слишком большой: он выбивает весь худший диапазон и оставляет только AA/KK.","tag":"4-бет"},{"id":"preflop-04","cat":"preflop","level":2,"pos":"CO vs BTN (3-бет пот)","hero":"","board":"","pot":16.5,"stack":92.5,"q":"100bb. Ты открылся с CO до 2.5bb, BTN 3-бетнул до 7.5bb, ты коллируешь. Блайнды сфолдили. Какой будет SPR на флопе?","opts":["~12","~5.6","~3","~8"],"ans":1,"why":"Банк: 7.5 + 7.5 + 0.5 + 1 = 16.5bb, за спиной у каждого 100 − 7.5 = 92.5bb. SPR = 92.5/16.5 ≈ 5.6. При таком SPR топ-пара с хорошим кикером часто готова к стеку, а сеты и стриты легко получают полный стек. Поэтому без позиции в 3-бет поте выгоднее держать руки, которые часто делают сильную топ-пару, а не мелкие пары с надеждой на сет.","tag":"SPR"},{"id":"preflop-05","cat":"preflop","level":2,"pos":"CO vs UTG","hero":"3s 3d","board":"","pot":4.5,"stack":40,"q":"Кэш, эффективный стек 40bb. UTG открывается до 3bb, ты на CO с 33. Действие?","opts":["Колл ради сета","3-бет","Фолд"],"ans":2,"why":"Сетмайнинг держится на имплайд-оддсах. Сет на флопе приходит примерно в 11.8% случаев (~7.5:1 против), а с учётом того, что сет не всегда оплачивается и иногда проигрывает, нужен стек примерно в 15–20 раз больше колла. 3 × 15 = 45bb, а у нас лишь 40bb, к тому же позади могут сквизить. 3-бет мелкой парой против сильного диапазона UTG бессмыслен — она не выдерживает 4-бета и плохо реализует эквити.","tag":"имплайд-оддсы"},{"id":"preflop-06","cat":"preflop","level":3,"pos":"Сателлит, CO vs UTG","hero":"As Ad","board":"","pot":null,"stack":40,"q":"Сателлит: 10 одинаковых билетов, осталось 11 игроков. У тебя 3-й стек (40bb). Самый короткий стек имеет 1bb и следующей раздачей попадает на большой блайнд. Чип-лидер (80bb) пушит с UTG, до тебя все фолдят. Ты на CO с AA. Действие?","opts":["Пуш поверх","Колл: AA выигрывает ~80%+","Колл, если у него широкий диапазон","Фолд"],"ans":3,"why":"В сателлите приз за 1-е и 10-е место одинаковый, поэтому важно только выжить. Если ты фолдишь, то почти наверняка получаешь билет: короткий стек вот-вот вылетит. Если коллируешь, в ~15–20% случаев теряешь всё, а победа почти ничего не добавляет. Это крайний пример ICM: ценность фишек нелинейна, и ставка выживания важнее чипового EV.","tag":"ICM"},{"id":"preflop-07","cat":"preflop","level":1,"pos":"BB vs BTN","hero":"Qd 7c","board":"","pot":3.5,"stack":100,"q":"100bb. BTN мин-рейзит до 2bb, SB фолдит. Ты на BB с Q♦7♣. Действие?","opts":["3-бет до 9bb","Фолд","Колл"],"ans":2,"why":"Цена отличная: ты доплачиваешь 1bb, чтобы разыграть банк 4.5bb, то есть нужно всего ~22% эквити. Против широкого диапазона BTN у Q7o его больше, а реализация достаточна, чтобы защищать. Против мин-рейза BB защищает очень широко — до 60–70% рук. Для 3-бета Q7o не подходит: слабые блокеры и много доминации.","tag":"защита BB"},{"id":"preflop-08","cat":"preflop","level":2,"pos":"BTN vs UTG + HJ","hero":"As Qd","board":"","pot":13,"stack":100,"q":"100bb, 6-max. UTG открывается до 2.5bb, HJ делает 3-бет до 9bb. Ты на BTN с A♠Q♦. Действие?","opts":["4-бет","Колл","Фолд"],"ans":2,"why":"Посмотри на силу диапазонов: 3-бет против открытия UTG очень сильный (QQ+, AK, AQs, немного блефов), и AQo против него часто доминирован. При колле ты можешь попасть в сквиз-сэндвич (UTG ещё может 4-бетнуть), а 4-бет-блефу эта рука подходит хуже, чем Ax-одномастные с лучшей играбельностью. Сильная на вид рука — это не то же самое, что сильная рука против конкретного диапазона.","tag":"колд-колл"},{"id":"preflop-09","cat":"preflop","level":2,"pos":"SB vs BTN","hero":"Ah Jh","board":"","pot":4,"stack":100,"q":"100bb. BTN открывается до 2.5bb, ты решил 3-бетить из SB с A♥J♥. Какой сайзинг 3-бета стандартный?","opts":["3-бет до ~11bb","3-бет до 6bb","3-бет до 20bb","Колл"],"ans":0,"why":"Без позиции 3-бет больше, чем в позиции: около 4–4.5x открытия, то есть 10–11bb против 2.5bb. Так ты хуже даёшь оддсы BTN для колла в позиции, и он реже реализует эквити. В позиции (например, BTN против CO) хватает ~3x. Маленький 3-бет без позиции даёт ему отличный колл, а 20bb уже перебор: рискуешь много против немногих фолдов.","tag":"размер 3-бета"},{"id":"preflop-10","cat":"preflop","level":2,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Ты играешь на микролимитах с высоким рейком (около 5–6% с высоким капом). Как это должно влиять на префлоп-стратегию по сравнению с безрейковыми решениями солвера?","opts":["BB нужно защищать шире: в маленьких банках рейк дешевле","Рейк никак не влияет на префлоп","Открывать шире из ранних позиций, чтобы было больше банков","Меньше флетов (особенно мультивей и без позиции), больше стратегии «3-бет или фолд», BB защищать немного уже"],"ans":3,"why":"Рейк — налог на банки, которые доходят до флопа, а особенно на маленькие и мультивей-банки, где маргинальные руки выигрывают немного. Поэтому маргинальные коллы (колд-коллы, защита BB с худшими руками) теряют больше всего EV. Решения, которые выигрывают банк префлоп (3-беты, стилы), рейком не облагаются. В раковых играх стратегия становится тайтовее и агрессивнее.","tag":"рейк"},{"id":"mental-01","cat":"mental","level":1,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Ты заколлировал ставку в банк на ривере блефкэтчером, оценив, что у оппонента около 40% блефов в этой линии. Он показал натсы. Как правильно оценить решение?","opts":["Нужно было рейзить","Оценивать против диапазона: если блефов в этой линии ≥33%, колл верный независимо от этой раздачи. Проверить, был ли верен сам ридинг диапазона","Колл был ошибкой: он показал натсы","Невозможно оценить, пока не видно ещё несколько его рук"],"ans":1,"why":"Одна раздача — это одна точка из распределения; против ставки в банк ты должен проигрывать до 67% коллов и всё равно быть в плюсе. Решение оценивается по входным данным: верно ли восстановлен диапазон, верна ли оценка доли блефов, правильно ли посчитаны оддсы. Если ридинг основан на данных, а не на надежде, — это хорошее решение с плохим результатом.","tag":"результатизм"},{"id":"mental-02","cat":"mental","level":2,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"После трёх бэдбитов подряд ты замечаешь, что коллируешь 3-беты руками, которые обычно фолдишь, и хочешь «отыграться». Лучшее действие?","opts":["Поднять лимит, чтобы быстрее отыграться","Продолжить, но играть агрессивнее, чтобы вернуть инициативу","Взять паузу или закончить сессию по заранее заданному поведенческому стоп-критерию","Открыть больше столов, чтобы отвлечься"],"ans":2,"why":"Ключевой сигнал — не проигрыш, а изменение поведения: ты отклоняешься от своих стандартных решений. Это объективный признак тильта, и дальнейшая игра почти наверняка будет хуже твоего A-game. Лучше заранее прописать триггеры (например, «два решения подряд вне стратегии — пауза 10 минут»), а не решать в моменте. «Отыграться» — эмоциональная цель, а цель сессии — качество решений.","tag":"тильт"},{"id":"mental-03","cat":"mental","level":1,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Твой банкролл — $1500, и это профессиональные деньги (ты не можешь легко его пополнить). На каком лимите кэша разумно играть регулярно?","opts":["NL50 (30 бай-инов)","NL200 (7.5 бай-ина)","NL100 (15 бай-инов)","NL500 — шот одним бай-ином"],"ans":0,"why":"Для кэша общепринятый ориентир — 30–50+ бай-инов на свой лимит, а для профи, которые живут с игры, — ближе к верхней границе. Даунсвинги в 10–20 бай-инов случаются даже у выигрывающих игроков, и банкролл в 15 бай-инов их не выдержит. NL50 при 30 бай-инах — нижняя граница разумного; падение банкролла — повод опуститься на лимит ниже без эго.","tag":"банкролл-менеджмент"},{"id":"mental-04","cat":"mental","level":2,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Ты разбираешь сложную раздачу после сессии. Какой подход самый полезный?","opts":["Спросить мнение в чате и выбрать самое популярное","Сразу загрузить в солвер и запомнить частоты","Пройти улицы по порядку: восстановить диапазоны обоих игроков и свой план на каждой улице, не глядя на результат; сформулировать конкретный вопрос и проверить его солвером или расчётом","Посмотреть, что показал оппонент, и понять, где ошибся"],"ans":2,"why":"Разбор начинается с процесса, а не с результата: если сразу смотреть карты оппонента, анализ подстраивается под исход (hindsight bias). Восстановление диапазонов по улицам тренирует навык, который нужен за столом. Конкретный вопрос («колл или фолд против этого диапазона?») превращает солвер в инструмент проверки гипотезы, а не в источник частот для зубрёжки.","tag":"разбор раздач"},{"id":"mental-05","cat":"mental","level":2,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"За 10 000 рук в 6-max у тебя −3bb/100. Стандартное отклонение — около 100bb/100. Что можно сказать о твоём реальном винрейте?","opts":["Твой реальный винрейт ровно −3bb/100","Почти ничего: стандартная ошибка около ±10bb/100, а 95%-интервал — примерно от −23 до +17bb/100","Ты точно выигрывающий, просто не везёт","Ты проигрывающий игрок, надо опускаться"],"ans":1,"why":"Стандартная ошибка винрейта = σ/√(число сотен рук) = 100/√100 = 10bb/100, и 95%-интервал — это ±2 SE, то есть около ±20bb/100. В такой интервал помещаются и сильный минус, и сильный плюс. Оценивай игру по качеству решений и разборам (а также по EV-графикам), а не по результату на коротких выборках.","tag":"дисперсия"},{"id":"mental-06","cat":"mental","level":2,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Какой критерий завершения сессии самый правильный?","opts":["Когда в минусе на 2 бай-ина: стоп-лосс","Когда в плюсе на 3 бай-ина: зафиксировать прибыль","Когда падает качество решений (усталость, тильт, автопилот) или пропадает выгодный состав за столами","Ровно через 4 часа, что бы ни было"],"ans":2,"why":"Покер — одна бесконечная сессия: выигрыш или проигрыш в течение дня не меняют EV следующей раздачи. Значение имеют только два фактора: насколько хорошо ты сейчас играешь и насколько выгодны оппоненты. Денежный стоп-лосс полезен как предохранитель от тильта, но это заменитель самооценки качества игры, а не главный критерий.","tag":"дисциплина"},{"id":"mental-07","cat":"mental","level":3,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Тебе предстоит сложное решение на ривере против рега. Какой порядок мышления самый правильный?","opts":["Посчитать пот-оддсы и коллировать, если рука «достаточно хорошая»","Вспомнить, блефовал ли он в прошлый раз","Довериться чутью насчёт этого игрока","Восстановить его диапазон по улицам → оценить соотношение вэлью и блефов для этой линии и сайзинга → сравнить с требуемым эквити → учесть блокеры своей руки"],"ans":3,"why":"Сильное решение строится от диапазона к руке: сначала что у него может быть, затем какая доля из этого блефы, затем сколько эквити тебе нужно, и в конце как твои карты меняют эту картину. Чутьё и одна прошлая раздача — шум, а «достаточно хорошая рука» без контекста диапазона ничего не значит. Если тренировать эту последовательность на разборах, за столом она станет быстрой.","tag":"процесс принятия решений"},{"id":"mental-08","cat":"mental","level":2,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Ты уже вложил в банк 40bb, а на ривере оппонент делает большую ставку. Ловишь себя на мысли: «Я слишком много вложил, чтобы теперь фолдить». Как к этому относиться?","opts":["Правильно всегда фолдить на большие ставки на ривере","Это ошибка невозвратных затрат: вложенные фишки уже не твои. Большой банк учитывается только через пот-оддсы, а решение принимается по текущим оддсам и диапазону оппонента","Лучше рейзить, раз уж столько вложено","Это верно: вложенные фишки обязывают коллировать"],"ans":1,"why":"Фишки в банке — не «твои вложения», а общий банк. Их размер влияет только на оддсы, которые тебе предлагают, и это уже учтено в расчёте требуемого эквити. Если против его диапазона у тебя меньше нужного эквити, колл теряет деньги независимо от того, сколько ты положил раньше. Мысль «я слишком вложился» — сигнал остановиться и пересчитать, а не причина коллировать.","tag":"невозвратные затраты"},{"id":"mental-09","cat":"mental","level":2,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"После хорошего апсвинга ты хочешь попробовать лимит выше. Самый разумный подход?","opts":["Играть оба лимита по настроению","Никогда не подниматься, пока нет 100 бай-инов","Заранее выделить фиксированную сумму на шот (например, 3–5 бай-инов выше) и вернуться, если она проиграна, — без эмоций","Перейти на лимит выше со всем банкроллом"],"ans":2,"why":"Шот-тейкинг — нормальная часть роста, но правила задаются до шота, а не после первого проигрыша. Фиксированный бюджет ограничивает риск и убирает эмоциональное решение «ещё один бай-ин и отыграюсь». Возврат на свой лимит — запланированная часть процесса, а не поражение. Апсвинг тоже влияет на оценку своей силы, поэтому сверяйся со своими объективными критериями.","tag":"шот-тейкинг"},{"id":"mental-10","cat":"mental","level":2,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Рег 3-бетит тебя чуть ли не каждую вторую раздачу. Ты злишься и хочешь «наказать» его 4-бет-блефом любыми двумя. Лучший подход?","opts":["Проверить статистику (его 3-бет % против твоей позиции, выборка) и хладнокровно скорректироваться: расширить 4-беты (вэлью + блефы с блокерами вроде A5s), чуть сузить открытия под ним","Игнорировать и продолжать играть как обычно","Перестать открываться вообще","4-бетить блефом каждый раз, чтобы он понял"],"ans":0,"why":"Эмоция «он меня таргетит» — сигнал перейти к данным: насколько велик его 3-бет на реальной выборке и с каких позиций. Правильная корректировка пропорциональна: больше 4-бетов, включая блефы с блокерами, и, возможно, немного уже открытия там, где он сидит в позиции. Месть «любыми двумя» — переэксплойт, который опытный рег легко накажет 5-бет-коллами.","tag":"эмоции и эксплойт"},{"id":"rd-01","cat":"exploit","level":1,"pos":"BTN vs BB","hero":"Ah Jc","board":"Jd 8s 4d","pot":5.5,"stack":97.5,"q":"Фиш 52/6, WTSD 41%, Fold to c-bet 28%. Ты открылся с BTN, он заколлировал с BB. Флоп, он чекает. Какой план лучше?","opts":["c-bet 33% всем диапазоном, как против рега","c-bet 33%, на тёрне чек для контроля банка","чек-бэк, чтобы он начал блефовать","c-bet 75% и план на три улицы вэлью на большинстве ранаутов"],"ans":3,"why":"Против станции деньги зарабатываются размером вэлью-ставок, а не частотой блефов. Он коллирует любой парой и любым дро, поэтому маленький сайзинг недобирает. Мокрая доска плюс станция — это крупный сайзинг и три улицы вэлью с топ-парой. Чек-бэк в расчёте на блеф пассивного фиша — потерянная улица.","tag":"вэлью против станции"},{"id":"rd-02","cat":"exploit","level":2,"pos":"BTN vs BB","hero":"Kd Qd","board":"Kc 9h 5s 7d","pot":22,"stack":80,"q":"Пассивный фиш 45/8, AF 0.9. Ты поставил флоп и тёрн. На тёрне он делает чек-рейз втрое. Что делаешь?","opts":["Колл: у фиша много дро","Ре-рейз олл-ин: топ-пара с хорошим кикером","Колл и чек-фолд на ривере, если придёт карта дро","Фолд"],"ans":3,"why":"У пассивного игрока агрессия почти всегда означает силу. С дро он чек-коллирует, а рейзит тёрн с двумя парами, сетами и стритами (86). Топ-пару со вторым кикером он не рейзит. Значит, против его диапазона рейза KQ почти всегда позади. Фолд — главный эксплойт против пассивных игроков: их рейз на поздних улицах = вэлью.","tag":"рейз пассивного игрока"},{"id":"rd-03","cat":"exploit","level":1,"pos":"BTN vs BB","hero":"Ah 5h","board":"Kh 8h 3c 2s Td","pot":30,"stack":70,"q":"Станция 48/10, WTSD 44%. Ты ставил флоп и тёрн с натс-флеш-дро и не собрал. Ривер, он чекает. Как действуешь?","opts":["Ставка 75% банка","Ставка 33% банка","Олл-ин: только так он сфолдит пару","Чек: сдаться"],"ans":3,"why":"Станция дошла до ривера через две ставки: у неё любая пара, а с WTSD 44% она не фолдит её на ривере. Фолд-эквити почти ноль при любом сайзинге. У A-high может быть немного шоудаун-вэлью против пропущенных дро. Блеф против станции — самый дорогой лик в игре против рекреационалов.","tag":"не блефуй станцию"},{"id":"rd-04","cat":"exploit","level":2,"pos":"BTN vs BB","hero":"As Ac","board":"Th 9h 3c","pot":5.5,"stack":97.5,"q":"Фиш 40/10 донкает 1/4 банка в тебя после твоего опена с BTN. Что лучше?","opts":["Колл: пусть продолжает ставить","Олл-ин","Рейз примерно в 3.5 раза","Колл, на тёрне рейз"],"ans":2,"why":"Маленький донк рекреационала — это «где я?»: слабая Tx, 9x, средняя пара или дро. На связанной двухмастной доске эти руки охотно платят рейз, а давать дешёвую карту дро плохо. Рейз берёт вэлью сейчас и строит банк под ставки на тёрне и ривере.","tag":"сайзинг-телл: мини-донк"},{"id":"rd-05","cat":"exploit","level":2,"pos":"BB vs BTN","hero":"Jh Js","board":"Qs 7c 4d 2h","pot":28,"stack":70,"q":"Маньяк 60/42, AF 6, c-bet 90%. Ты на BB, флоп чек-колл, тёрн он снова ставит 2/3. Лучший план?","opts":["Чек-колл и чек-колл ривера, включая крупную ставку","Чек-рейз: защитить руку от оверкарт","Фолд: дама на флопе","Донк на ривере, чтобы не дать ему блефовать"],"ans":0,"why":"У маньяка огромная доля воздуха во всех ставках. Если ты рейзишь или ставишь сам, его блефы фолдят и в игре остаются только руки сильнее твоей. Если чек-коллишь, он сам дожигает свои блефы. JJ здесь хороший блефкэтчер. Против гиперагрессии отдавай ему инициативу.","tag":"блефкэтч против маньяка"},{"id":"rd-06","cat":"exploit","level":2,"pos":"CO vs BB","hero":"Ad Qc","board":"","pot":13.5,"stack":100,"q":"Маньяк на BB 3-бетит 22% рук. Ты открылся с CO с AQo 2.5bb, он делает 3-бет до 11bb. Что делаешь?","opts":["4-бет примерно до 24bb и колл пуша","4-бет и фолд на пуш","Фолд: AQo плохо играет без инициативы","Колл в позиции"],"ans":0,"why":"Против 3-бета 22% диапазон оппонента состоит в основном из рук хуже AQo: Ax, Kx, одномастные коннекторы. AQo там сильно впереди, поэтому 4-бет делается на вэлью, и пуш надо коллировать. 4-бет с фолдом на пуш превращает вэлью-руку в блеф.","tag":"вэлью-4бет против маньяка"},{"id":"rd-07","cat":"exploit","level":1,"pos":"BTN","hero":"Kc 4d","board":"","pot":1.5,"stack":100,"q":"На SB и BB два нита: Fold to Steal 87%, 3-бет 3%. Все сфолдили до тебя на BTN. Твои действия с K4o?","opts":["Опен 2bb, на 3-бет колл","Фолд: рука вне чарта","Опен 2bb, на 3-бет фолд","Лимп"],"ans":2,"why":"Если блайнды фолдят 87%, стил приносит немедленную прибыль почти с любыми двумя картами: рискуешь 2bb, чтобы выиграть 1.5bb, а безубыток наступает при фолдах примерно в 57% случаев. 3-бет нита — это QQ+ и AK, против него K4o — чистый фолд. Чарты пишутся против средних оппонентов. Против нитов они расширяются.","tag":"стил против нитов"},{"id":"rd-08","cat":"exploit","level":2,"pos":"CO vs BB","hero":"Ac Qh","board":"","pot":13.5,"stack":100,"q":"Нит 12/10, 3-бет 2.5% за 2000 рук. Ты открылся с CO с AQo, он делает 3-бет с BB до 11bb. Твоё действие?","opts":["Фолд","Колл в позиции","Олл-ин","4-бет: AQo в топе диапазона"],"ans":0,"why":"3-бет 2.5% — это примерно QQ+ и AK. Против такого диапазона у AQo около 30% эквити, рука доминирована. Без позиции против агрессора колл доиграть сложно, а флоп с дамой или тузом часто приведёт к проигрышу крупного банка. Уважай частоты: 3-бет нита не баланс, а констатация силы.","tag":"уважать 3-бет нита"},{"id":"rd-09","cat":"exploit","level":2,"pos":"BTN vs CO","hero":"6h 5h","board":"Kd 7c 2s 3c","pot":10.5,"stack":93,"q":"Нит открылся с CO, ты заколлировал на BTN. Флоп: он c-бетит 1/3, ты коллируешь. Тёрн 3c, нит чекает. Его статы: c-bet флопа 70%, c-bet тёрна 25%. Что делаешь?","opts":["Ставка 20%","Чек-бэк: у тебя гатшот, бери бесплатную карту","Овербет 150%","Ставка 60–66% банка"],"ans":3,"why":"Если нит ставит c-bet на тёрне только в 25% случаев, его чек — это отказ от банка. Сюда попадают воздух, слабые Kx и средние пары, которым неуютно. Ставка 60–66% выбивает большую часть его диапазона. Гатшот на 4 даёт запасное эквити, если он заколлирует. Эксплойт строится на разрыве между флоп- и тёрн-c-bet.","tag":"флоат против нита"},{"id":"rd-10","cat":"exploit","level":1,"pos":"BTN vs CO","hero":"Ks 9s","board":"","pot":4,"stack":100,"q":"Слабо-тайтовый рег 18/15, Fold to 3-bet 72%. Он открылся с CO, ты на BTN с K9s. Лучшее действие?","opts":["Колл","Фолд","3-бет и колл 4-бета","3-бет до 8–8.5bb, на 4-бет фолд"],"ans":3,"why":"Если он фолдит на 3-бет 72% рук, блеф-3-бет приносит прибыль сразу. Когда он коллирует, ты играешь в позиции с одномастной рукой, у которой хорошая играбельность. Его 4-бет при таком профиле — только сильные руки, поэтому на него фолд. Колл упускает фолд-эквити, которую он тебе дарит.","tag":"3-бет против оверфолда"},{"id":"rd-11","cat":"exploit","level":2,"pos":"BB vs BTN","hero":"6h 5h","board":"Kc 8d 3s","pot":5.5,"stack":97.5,"q":"Слабо-тайтовый рег: c-bet 80% маленьким сайзингом, Fold to flop raise 65%. Он ставит 1/3 банка. У тебя 6h5h с бэкдорами. Что делаешь?","opts":["Фолд: нет пары и нет дро","Колл, чтобы посмотреть тёрн","Колл, на тёрне донк","Чек-рейз примерно в 3.5 раза"],"ans":3,"why":"Маленький c-bet с частотой 80% означает, что в его ставке очень много воздуха. Чек-рейз примерно до 6.4bb в банк 7.3bb окупается, если он фолдит хотя бы в ~47% случаев, а он фолдит 65%. Если он заколлирует, бэкдоры к стриту и флешу дают эквити. Лучшие кандидаты для блефового чек-рейза — руки без шоудаун-вэлью, но с потенциалом.","tag":"чек-рейз против авто-c-bet"},{"id":"rd-12","cat":"exploit","level":2,"pos":"BTN vs CO, 3-бет пот","hero":"Ah Kc","board":"Kd 8c 5h 2s Js","pot":95,"stack":null,"q":"TAG-рег NL50 23/19. Ты сделал 3-бет на BTN, он заколлировал. Ты поставил три улицы, на ривере он рейзит олл-ин. Что делаешь?","opts":["Колл: топ-пара топ-кикер","Фолд","Колл: он не может всегда иметь сет","Зависит только от шансов банка"],"ans":1,"why":"Рейзы ривера на низких лимитах почти не содержат блефов, особенно в 3-бет потах. AK обыгрывает только блефы, а вэлью-диапазон здесь — KJs, JJ, 88, 55, иногда 85s. Шансы банка требуют около 25–30% блефов, а у популяции их почти нет. Фолд топ-пары на рейз ривера — не трусость, а эксплойт популяционного андерблефа.","tag":"популяция: рейз ривера"},{"id":"rd-13","cat":"exploit","level":3,"pos":"BTN vs SB","hero":"As 5s","board":"","pot":13.5,"stack":100,"q":"LAG-рег на SB: 3-бет 13%, Fold to 4-bet 62%. Ты открылся с BTN, он сделал 3-бет до 10bb. Твой ход с A5s?","opts":["4-бет примерно до 22bb, на 5-бет фолд","Фолд","4-бет и колл пуша","Колл в позиции"],"ans":0,"why":"4-бет до 22bb стоит тебе ещё 19.5bb, а в банке 13.5bb. Безубыток наступает, если он фолдит в 19.5/33 ≈ 59% случаев. Он фолдит 62%, так что 4-бет приносит прибыль уже на фолдах. У A5s есть и другие плюсы: туз блокирует AA и AK, а если он заколлирует, у руки остаётся эквити. Колл тоже допустим, но 4-бет лучше использует его лик. На 5-бет фолд: в этом случае его диапазон — AA, KK, AK.","tag":"4-бет блеф с блокером"},{"id":"rd-14","cat":"exploit","level":1,"pos":"UTG vs BB","hero":"Qs Jd","board":"As 8d 4c","pot":5.5,"stack":97.5,"q":"Фит-о-фолд: Fold to c-bet 76%, WTSD 19%. Ты открылся с UTG, он защитил BB. Флоп, он чекает. Как ставить?","opts":["c-bet 25–33% банка","Чек-бэк: у тебя ничего нет","Овербет","c-bet 75% банка"],"ans":0,"why":"Против игрока, который без пары фолдит 76%, нужна дешёвая ставка, которая не обходится дорого, когда он попал. Маленький c-bet окупается при фолдах в 20–25% случаев, а он фолдит втрое чаще. Крупный сайзинг лишний: фолды ты получишь и так, а потеряешь больше, когда он заколлирует с тузом.","tag":"c-bet против фит-о-фолд"},{"id":"rd-15","cat":"exploit","level":2,"pos":"CO vs BB","hero":"Ad Kc","board":"9h 7c 3s 2d","pot":12,"stack":91,"q":"Тот же фит-о-фолд (Fold to c-bet 76%, WTSD 19%). Он заколлировал твой c-bet на флопе 9-7-3. Тёрн — 2d, он чекает. Что делаешь?","opts":["Овербет: он слабый игрок","Ставка 25%","Ставка 66%: продолжаем давить","Чек-бэк: бесплатная карта и шоудаун"],"ans":3,"why":"Если фит-о-фолд коллирует флоп, у него почти всегда пара. Бланк на тёрне ничего не меняет, и пару он не сфолдит, поэтому фолд-эквити почти нулевая. Чек-бэк даёт 6 аутов на оверкарты бесплатно. Стрелять имеет смысл только на картах, которые пугают его диапазон, например на тузе или короле для средних пар.","tag":"когда не баррелить"},{"id":"rd-16","cat":"exploit","level":3,"pos":"Лайв 2/5, BTN vs BB","hero":"As Kc","board":"7s 6s 2h Jc 4s","pot":120,"stack":110,"q":"Лайв. Оппонент сел на минимальный бай-ин, вздыхает, пересчитывает фишки. Он чек-коллировал флоп и тёрн. На ривере пришла третья пика, он чекает. У тебя AsKc без пары. Что делаешь?","opts":["Олл-ин примерно на размер банка","Ставка 1/2 банка","Чек-бэк: AK-high может выиграть","Ставка 1/4 банка"],"ans":0,"why":"Это профиль «испуганных денег». Флеш доехал, а As блокирует натс-флеш, поэтому твой блеф выглядит правдоподобно. Под угрозой весь его стек, и с одной или двумя парами он скорее сдастся, чем вылетит. С флешем он, скорее всего, поставил бы сам или ответил бы быстро. Против scared money размер ставки — главный рычаг.","tag":"давление на scared money"},{"id":"rd-17","cat":"exploit","level":2,"pos":"BTN vs BB","hero":"Kd Jh","board":"Kh 8c 4d 6s 2c","pot":12,"stack":88,"q":"Левелер: показывает блефы, хиро-коллирует, любит рассуждать «я знал, что ты слабый». Ты поставил c-bet на флопе и чекнул тёрн. На ривере он чекает. Что делаешь?","opts":["Ставка 60–70% на вэлью","Чек: топ-пара слабый кикер, хватит","Олл-ин","Ставка 25%, чтобы получить колл от A-high"],"ans":0,"why":"Левелер интерпретирует чек на тёрне как слабость и будет коллировать с 8x, 4x и даже с A-high, «потому что ты сдался». Тонкий вэлью против него — основной источник прибыли. Средне-крупный сайзинг выглядит как блеф и оплачивается. Не пытайся играть против него на более высоком уровне: выигрывай на уровень ниже.","tag":"тонкий вэлью против левелера"},{"id":"rd-18","cat":"exploit","level":2,"pos":"Лайв 1/3","hero":"Kh Ts","board":"Qc Td 5h 3s 8c","pot":80,"stack":150,"q":"Лайв. Рекреационал ставит банк на ривере, после ставки расслабленно болтает с соседом, пьёт, откидывается на стуле. У тебя вторая пара. Что делаешь?","opts":["Колл только по шансам банка","Рейз блефом","Фолд","Колл: он ведёт себя слишком спокойно, это актёрство"],"ans":2,"why":"Из эмпирических лайв-теллов (Зак Элвуд) один из самых надёжных — расслабленность и разговорчивость после ставки, и он чаще означает силу. Блефующий обычно замирает. К этому добавляется популяционный андерблеф на ривере в живой игре. Классическое правило «сильный значит слабый» — частный случай, а не закон.","tag":"лайв-телл: после ставки"},{"id":"rd-19","cat":"exploit","level":3,"pos":"Лайв 1/3","hero":"Kh Ts","board":"Qc Td 5h 3s 8c","pot":80,"stack":150,"q":"Та же раздача, но оппонент весь вечер был болтлив, а после ставки банк на ривере полностью замер: не двигается, смотрит в одну точку, дыхание поверхностное. У тебя вторая пара. Что делаешь?","opts":["Фолд: рекреационалы не блефуют","Колл как блефкэтчер","Фолд: ставка банк — это сила","Рейз олл-ин"],"ans":1,"why":"Резкое отклонение от базового поведения в поляризованной ситуации — ключевой сигнал. Замирание после крупной ставки часто означает блеф: человек «прячется», чтобы не выдать себя. Вторая пара обыгрывает все его блефы. Рейз не нужен: худшие руки не заколлируют, а блефы уже вложились.","tag":"лайв-телл: замирание"},{"id":"rd-20","cat":"exploit","level":2,"pos":"Лайв 2/5, BTN vs UTG","hero":"6d 6c","board":"","pot":42,"stack":200,"q":"Лайв, эффективные стеки 200bb. На шоудаунах ты видел: с коннекторами этот рекреационал открывает $10, с QQ+ — $25. Сейчас он открывает $25 с UTG. У тебя 66 на BTN. Твоё действие?","opts":["3-бет: изолировать рекреационала","Колл ради сета","Фолд: он показал силу","Олл-ин"],"ans":1,"why":"Сайзинг-телл сузил его диапазон до больших пар, которые не умеют фолдить оверпару. На глубине 200bb имплайд-оддсы для сета огромные: ты заплатишь $25, а выиграть можешь весь стек. При этом AQo или AJs здесь — чистый фолд: они доминированы и не выигрывают крупных банков.","tag":"лайв-сайзинг префлоп"},{"id":"rd-21","cat":"exploit","level":2,"pos":"BTN vs CO","hero":"Ah 9h","board":"Qd 8c 4s 7h","pot":11,"stack":94,"q":"Популяция NL25–50. Префлоп-агрессор на CO чекнул флоп, ты чекнул в позиции. Тёрн, он снова чекает. Как часто стоит ставить с воздухом и средними руками?","opts":["Широко, ставкой около 60%: после пропущенного c-bet пул фолдит около 60%","Только овербетом","Почти никогда: он может чекать сильные руки","Только с натсами"],"ans":0,"why":"Если префлоп-агрессор пропустил c-bet, а потом чекнул и тёрн, его диапазон сильно ограничен. По популяционной статистике на ставку в такой линии фолдят около 60% рук. Ставка 60% окупается при фолдах в ~38% случаев. A9 к тому же добавляет оверкарту и гатшот. Пул низких лимитов редко чекает сильные руки дважды.","tag":"популяция: проба тёрна"},{"id":"rd-22","cat":"exploit","level":3,"pos":"BB vs BTN","hero":"Ac 3d","board":"Kh 9c 4s 6d","pot":10,"stack":90,"q":"Популяция NL25. Флоп ты чекнул, BTN чекнул в ответ. На тёрне ты снова чекаешь, BTN ставит 75% банка. У тебя A-high. Что делаешь?","opts":["Чек-рейз олл-ин","Колл: эта линия у пула перенасыщена блефами","Фолд: ставка большая","Фолд: нет пары"],"ans":1,"why":"Отложенный c-bet после чек-бэка флопа у пула низких лимитов перенасыщен блефами: в позиции они чекали воздух и теперь «забирают» банк. Против таких линий нужно защищаться легче, чем в стандартных спотах, даже A-high и слабыми парами. Обрати внимание на асимметрию: ставки ривера пул недоблефовывает, а пробы и отложенные ставки, наоборот, переблефовывает.","tag":"популяция: перенасыщенные линии"},{"id":"rd-23","cat":"exploit","level":2,"pos":"BTN vs BB","hero":"Ks Qs","board":"Jc 7d 3h 5s 2c","pot":38,"stack":75,"q":"Рег NL50, против колл-колл-колл фолдит на третий барель около 56%. Ты ставил флоп и тёрн с оверкартами, ривер бланк. Его профиль — стандартный TAG, WTSD 25%. Что делаешь?","opts":["Чек: K-high может выиграть","Ставка 75% банка блефом","Ставка 25% банка","Зависит от его тайминга, но по умолчанию чек"],"ans":1,"why":"Ставка 75% банка окупается при фолдах в ~43% случаев, а пул фолдит около 56%. Это прибыльный блеф. KQ без шоудаун-вэлью — хороший кандидат: не блокирует его фолды (средние пары, A-high) и пропущенные дро. Против станции с WTSD 40%+ этот блеф стал бы ошибкой, поэтому профиль решает.","tag":"третий барель"},{"id":"rd-24","cat":"exploit","level":1,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Сколько рук нужно, чтобы с разумной уверенностью доверять VPIP/PFR
