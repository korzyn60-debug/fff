 оппонента, и сколько — чтобы доверять его Fold to 3-bet?","opts":["VPIP/PFR — 1000 рук, Fold to 3-bet — 100 рук","VPIP/PFR — ~100+ рук; Fold to 3-bet — сотни ситуаций с 3-бетом, это тысячи рук","Статы надёжны с первых 20 рук","Обоим статам хватит 50 рук"],"ans":1,"why":"VPIP и PFR набирают выборку с каждой раздачи, поэтому грубая картина видна через 15–20 рук, а через 100–500 ей уже можно доверять. Ситуационные статы (Fold to 3-bet, Fold to c-bet, чек-рейз) копятся только из конкретных ситуаций, и надо смотреть на число возможностей, а не на число рук. «Fold to 3-bet 80%» на 5 возможностях — шум.","tag":"выборка статов"},{"id":"rd-25","cat":"exploit","level":2,"pos":"BB vs BTN","hero":"Td 9d","board":"Qh 6d 3h","pot":5.5,"stack":97.5,"q":"LAG-рег ставит c-bet 85% маленьким сайзингом. Он ставит 1/3 банка. У тебя T9 с бэкдор-флешем и бэкдор-стритом. Что лучше всего эксплуатирует его стратегию?","opts":["Колл","Фолд","Чек-рейз в 3–3.5 раза","Колл и донк на тёрне"],"ans":2,"why":"При c-bet 85% в ставке много рук без пары и без дро, которые фолдят на рейз. T9 не имеет шоудаун-вэлью, но получает много хороших карт на тёрне: бубны, J, 8, 7. Такие руки и становятся блеф-чек-рейзами. Сильные руки и комбо-дро тоже чек-рейзят, так что диапазон остаётся сбалансированным. Против авто-c-bet увеличивай частоту чек-рейза.","tag":"чек-рейз против LAG"},{"id":"s-pre-01","cat":"preflop","level":1,"simple":true,"pos":"UTG","hero":"Kd 9c","board":"","pot":2.5,"stack":40,"q":"Турнир, за столом 9 игроков. Ты говоришь первым (UTG), стек 40бб. У тебя K9 разномастные. Что делаешь?","opts":["Рейз 2.2бб","Фолд","Лимп (просто уравнять бб)"],"ans":1,"why":"За тобой ещё много игроков, и у кого-то часто окажется рука лучше. K9 разномастные плохо играют против KJ, KQ и AK: даже попав в короля, ты часто проигрываешь по кикеру. Лимп ещё хуже — тебя изолируют, и ты играешь слабую руку без инициативы.","rule":"С ранней позиции играй только сильные руки, разномастные средние — в пас.","tag":"Открытие с ранних позиций"},{"id":"s-pre-02","cat":"preflop","level":1,"simple":true,"pos":"BTN","hero":"Qs 8s","board":"","pot":2.5,"stack":30,"q":"Все сбросили до тебя на баттоне. Стек 30бб, у тебя Q8 одномастные. Что делаешь?","opts":["Фолд","Рейз (открыться) на 2–2.2бб","Лимп"],"ans":1,"why":"На баттоне против тебя остались только блайнды, и после флопа ты всегда будешь ходить последним. Отсюда можно открывать очень много рук, и Q8 одномастные — нормальная рука для этого. Часто блайнды просто сбросят, и ты заберёшь блайнды с анте без борьбы.","rule":"Чем ближе к баттону, тем шире открывайся.","tag":"Открытие с баттона"},{"id":"s-pre-03","cat":"preflop","level":2,"simple":true,"pos":"BTN vs BB","hero":"Jd 7d","board":"","pot":4.5,"stack":40,"q":"Турнир с анте. Баттон открывается мин-рейзом до 2бб, SB сбросил. Ты на BB с J7 одномастными, стек 40бб. Что делаешь?","opts":["Колл","Фолд","Олл-ин"],"ans":0,"why":"Тебе нужно доплатить всего 1бб, а в банке уже много фишек за счёт анте. При такой хорошей цене на BB защищают очень много рук, и J7 одномастные точно среди них. Олл-ин с глубоким стеком — слишком большой риск ради маленького банка.","rule":"На BB против мин-рейза с анте защищайся широко — цена отличная.","tag":"Защита BB"},{"id":"s-pre-04","cat":"preflop","level":1,"simple":true,"pos":"BTN","hero":"As 7c","board":"","pot":2.5,"stack":10,"q":"Все сбросили до тебя на баттоне. Стек 10бб, у тебя A7 разномастные. Что делаешь?","opts":["Лимп","Фолд","Мин-рейз, а дальше посмотреть","Олл-ин (пуш)"],"ans":3,"why":"С таким стеком нормально играть после флопа уже не получится, поэтому решение простое: олл-ин или фолд. Туз на баттоне — хорошая рука для пуша: блайнды часто сбросят, и ты заберёшь банк. Лимп и мин-рейз съедают часть стека и оставляют тебя в неудобной игре.","rule":"Около 10бб играй по схеме «пуш или фолд», без лимпов.","tag":"Пуш с короткого стека"},{"id":"s-pre-05","cat":"preflop","level":2,"simple":true,"pos":"CO vs BTN","hero":"Ah Qc","board":"","pot":4.7,"stack":20,"q":"Середина турнира. CO открывается на 2.2бб. Ты на баттоне, стек 20бб, у тебя AQ разномастные. Что делаешь?","opts":["Олл-ин поверх его рейза","Колл","Фолд","Маленький 3-бет до 5бб"],"ans":0,"why":"С 20бб олл-ин поверх открытия — очень сильный ход: когда соперник сбрасывает, ты забираешь всё, что уже в банке. Когда он коллирует, у тебя всё равно хорошие шансы. Колл и маленький 3-бет оставляют тебя с неудобным стеком и сложными решениями после флопа.","rule":"С 20–25бб сильные руки против открытия ставь олл-ин, а не коллируй.","tag":"Рестил 20–25бб"},{"id":"s-pre-06","cat":"preflop","level":1,"simple":true,"pos":"BTN, 3 лимпера","hero":"Ac Kd","board":"","pot":4.5,"stack":100,"q":"Живой кэш. Трое игроков просто уравняли блайнд (лимп). Ты на баттоне с AK. Что делаешь?","opts":["Фолд","Рейз примерно до 7бб","Тоже лимп","Рейз до 3бб"],"ans":1,"why":"Лимперы в лайве любят коллировать, и маленький рейз никого не отпугнёт — ты сыграешь большой банк против кучи соперников. Крупный рейз выбивает слабые руки и часто оставляет тебя один на один, с позицией и сильной рукой. Удобная привычка: обычный рейз плюс 1бб за каждого лимпера.","rule":"Против лимперов рейзи крупно: обычный рейз плюс по 1бб за каждого.","tag":"Игра против лимперов"},{"id":"s-pre-07","cat":"preflop","level":2,"simple":true,"pos":"UTG vs HJ","hero":"Ad Tc","board":"","pot":4,"stack":40,"q":"Тайтовый игрок с UTG открывается на 2.5бб. Ты на HJ с AT разномастными, стек 40бб. Что делаешь?","opts":["Фолд","3-бет","Колл"],"ans":0,"why":"Рейз с первой позиции от тайтового игрока — это обычно сильные руки: AK, AQ, AJ, большие пары. Против них AT часто в беде: ты попадаешь в туза и проигрываешь по кикеру. К тому же за тобой ещё несколько игроков, которые могут вступить в игру.","rule":"Против раннего рейза тайтового игрока слабые тузы — в пас.","tag":"Игра против рейза"},{"id":"s-post-01","cat":"postflop","level":1,"simple":true,"pos":"BTN vs BB","hero":"As Td","board":"Kh 7c 2d","pot":5.5,"stack":37,"q":"Ты открылся с баттона, BB заколлировал. Флоп Kh 7c 2d, BB чекает. У тебя AT без пары. Что делаешь?","opts":["Олл-ин","Чек","Маленькая продолжающая ставка (около трети банка)"],"ans":2,"why":"Сухая доска с королём лучше подходит тебе как рейзеру: у BB чаще слабые руки, которые сюда не попали. Маленькая ставка дёшево заставит сбросить много рук, а при колле у тебя ещё остаются шансы поймать туза. Олл-ин рискует всем стеком ради маленького банка.","rule":"На сухой доске один на один часто ставь маленькую продолжающую ставку.","tag":"Продолжающая ставка: сухая доска"},{"id":"s-post-02","cat":"postflop","level":1,"simple":true,"pos":"UTG vs 3 игрока","hero":"Ac Qd","board":"8h 7h 6d","pot":11,"stack":37,"q":"Ты открылся с UTG, трое заколлировали. Флоп 8h 7h 6d, BB чекает, за тобой ещё два игрока. У тебя AQ без пары и без дро. Что делаешь?","opts":["Продолжающая ставка в полбанка","Чек, а на ставку — фолд","Олл-ин"],"ans":1,"why":"Против троих соперников кто-то почти всегда попал в такую связанную доску: пары, стрит-дро, флеш-дро. Блеф здесь редко проходит, а у тебя нет ни пары, ни дро. Сдаться дёшево — нормальное решение.","rule":"В мультипоте на мокрой доске без руки продолжающую ставку не делай.","tag":"Продолжающая ставка: мультипот"},{"id":"s-post-03","cat":"postflop","level":1,"simple":true,"pos":"CO vs BB","hero":"Ac Kh","board":"Kd 8s 3c 2h","pot":12,"stack":35,"q":"Флоп Kd 8s 3c: ты поставил, BB заколлировал. Тёрн 2h, BB снова чекает. У тебя AK — топ-пара с лучшим кикером. Что делаешь?","opts":["Ставка около двух третей банка","Олл-ин","Чек, а на ставку — фолд"],"ans":0,"why":"Двойка на тёрне ничего не поменяла, а соперник уже показал, что у него что-то есть. Твою ставку заколлируют короли похуже, восьмёрки и пары поменьше — это и есть вэлью. Если чекать, ты не доберёшь денег и дашь ему бесплатную карту.","rule":"С сильной топ-парой на спокойной доске ставь на вэлью улицу за улицей.","tag":"Топ-пара: вэлью"},{"id":"s-post-04","cat":"postflop","level":1,"simple":true,"pos":"BTN vs CO","hero":"Ah 5h","board":"Kh 8h 3c","pot":10,"stack":37,"q":"Ты заколлировал рейз CO на баттоне. Флоп Kh 8h 3c, CO ставит полбанка. У тебя Ah 5h — дро к натсовому флешу. Что делаешь?","opts":["Олл-ин","Колл","Фолд — у меня пока ничего нет"],"ans":1,"why":"Флеш-дро к риверу собирается примерно в трети случаев, и если соберётся — у тебя будет самый сильный флеш. Цена колла хорошая, а в позиции ты сможешь дёшево добрать карты и забрать большой банк. Олл-ин в маленький банк — слишком дорогой ход: сильные руки соперника его просто заколлируют.","rule":"С хорошим дро против нормальной ставки — колл.","tag":"Флеш-дро"},{"id":"s-post-05","cat":"postflop","level":2,"simple":true,"pos":"BB vs BTN","hero":"9s 9d","board":"Jh 9c 4h","pot":10.5,"stack":37,"q":"Ты защитил BB против баттона. Флоп Jh 9c 4h: ты чекаешь, баттон ставит. У тебя сет девяток. Что делаешь?","opts":["Рейз","Колл — замедлить игру","Фолд — вдруг соберут флеш"],"ans":0,"why":"На доске есть флеш-дро и стрит-дро, и многие следующие карты могут испортить тебе руку. Сейчас ты почти всегда впереди, поэтому рейзи: пусть соперник платит за дро сейчас, а не смотрит карты дёшево. Его валеты и дро часто заплатят.","rule":"Сильная рука на мокрой доске — рейзи сразу, не медли.","tag":"Сет на мокрой доске"},{"id":"s-post-06","cat":"postflop","level":2,"simple":true,"pos":"CO vs BB","hero":"Ac 3c","board":"Js Td 8s 7d","pot":13,"stack":30,"q":"Ты открылся с CO с A3 одномастными, BB заколлировал. Флоп Js Td 8s: ты поставил, BB заколлировал. Тёрн 7d, BB чекает. У тебя ничего. Что делаешь?","opts":["Чек, а если соперник поставит — сдаться","Крупная ставка-блеф","Олл-ин"],"ans":0,"why":"На такой связанной доске BB коллировал флоп с парами, дро и стритами, а семёрка многим из них ещё и помогла. Такие руки редко сбросят на тёрне. У тебя нет ни пары, ни дро, поэтому дешевле просто сдаться.","rule":"Доска опасная, соперник коллирует, а у тебя пусто — остановись.","tag":"Когда сдаваться"},{"id":"s-post-07","cat":"postflop","level":2,"simple":true,"pos":"BB vs BTN","hero":"9h 8h","board":"Kd 9c 4s","pot":8.5,"stack":37,"q":"Ты защитил BB против баттона. Флоп Kd 9c 4s: ты чекаешь, баттон ставит маленькую ставку (треть банка). У тебя 98 — вторая пара. Что делаешь?","opts":["Фолд","Рейз","Колл"],"ans":2,"why":"Вторая пара — неплохая рука против маленькой ставки баттона: он часто ставит так с пустыми руками. Но раздувать банк рейзом не стоит: руки хуже сбросят, а продолжат в основном короли и сильнее. Колл держит банк небольшим и оставляет тебя в игре.","rule":"Средняя пара — рука для колла и контроля банка, а не для рейза.","tag":"Контроль банка"},{"id":"s-rng-01","cat":"ranges","level":1,"simple":true,"pos":"","hero":"","board":"Qd 8c 4h 2s","pot":14,"stack":null,"q":"Пассивный соперник весь вечер только коллирует. Флоп Qd 8c 4h он заколлировал, а на тёрне 2s на твою ставку вдруг сделал рейз. Что у него чаще всего?","opts":["Дро","Сильные руки: сет или две пары","Одна пара — дама с плохим кикером","Блеф"],"ans":1,"why":"Пассивные игроки рейзят очень редко и почти только с очень сильными руками. Если такой игрок вдруг проснулся на тёрне — это сигнал тревоги. Одна пара против него обычно проигрывает.","rule":"Рейз от пассивного игрока — почти всегда очень сильная рука.","tag":"Рейз пассивного игрока"},{"id":"s-rng-02","cat":"ranges","level":1,"simple":true,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Живой кэш, обычно здесь открываются на 3–4бб. Любитель, который до этого только лимповал, вдруг рейзит до 12бб. Что у него чаще всего?","opts":["Сильная рука: большая пара или AK","Маленькая пара или одномастные коннекторы","Мусор — он просто балуется"],"ans":0,"why":"Любители редко блефуют огромными рейзами префлоп. Резкий крупный рейз после лимпов обычно значит: «у меня хорошая рука, и я хочу забрать банк сразу». Чаще всего это большие пары или AK.","rule":"Крупный нестандартный рейз любителя префлоп — почти всегда сильная рука.","tag":"Крупный рейз в лайве"},{"id":"s-rng-03","cat":"ranges","level":1,"simple":true,"pos":"","hero":"","board":"Kh 9d 4c 2s","pot":20,"stack":null,"q":"Ты поставил на флопе Kh 9d 4c и на тёрне 2s, соперник оба раза заколлировал. Флеш-дро на доске нет. Что у него чаще всего?","opts":["Флеш-дро","Пустая рука, которую он сбросит на ривере","Одна пара или лучше: король, девятка или сильнее"],"ans":2,"why":"Флеш-дро здесь нет, а коллировать две ставки с пустыми руками соперники почти не будут. Значит, у него чаще всего король, девятка или что-то сильнее. Блефовать его на ривере — плохая идея, а с сильной рукой можно смело ставить на вэлью.","rule":"Кто заколлировал две улицы на сухой доске, почти всегда держит пару или лучше.","tag":"Колл двух улиц"},{"id":"s-rng-04","cat":"ranges","level":2,"simple":true,"pos":"","hero":"","board":"Th 7h 3c 2d 5s","pot":24,"stack":null,"q":"Соперник ставил на флопе Th 7h 3c и на тёрне 2d. На ривере пришла 5s, флеш не собрался, и соперник чекает. Что у него чаще всего?","opts":["Сильные руки: сет или две пары — он ловит на чек","Одна пара средней силы или несобравшееся дро","Только стрит"],"ans":1,"why":"Большинство игроков с сильной рукой продолжают ставить на ривере — им нужно добрать денег. Чек после двух ставок чаще показывает слабость: средняя пара, которая хочет дойти до вскрытия, или дро, которое не доехало. Ловушки бывают, но редко.","rule":"Чек после агрессии обычно значит, что рука соперника ослабла.","tag":"Что значит чек"},{"id":"s-rng-05","cat":"ranges","level":1,"simple":true,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Очень тайтовый игрок за два часа ни разу не делал 3-бет. Сейчас он делает 3-бет на твоё открытие. Что у него чаще всего?","opts":["Очень сильная рука: большая пара или AK","Любые две карты","Средний туз или одномастный коннектор"],"ans":0,"why":"Если игрок долго не делал 3-бет, значит, он делает его только с лучшими руками. Обычно это тузы, короли, дамы или AK. С руками вроде AJ или маленьких пар против него лучше сбросить.","rule":"Редкий 3-бет от тайтового игрока — это топовая рука.","tag":"3-бет тайтового игрока"},{"id":"s-rng-06","cat":"ranges","level":1,"simple":true,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Живой кэш. Игрок лимпует, ты рейзишь, он просто коллирует. Что у него чаще всего?","opts":["Средние руки: маленькие пары, одномастные карты, слабые тузы","Только AK","Только AA или KK"],"ans":0,"why":"С очень сильными руками любители обычно рейзят сами или делают ре-рейз после твоего рейза. Лимп-колл — типичная игра со средними руками, которые «хотят посмотреть флоп». Поэтому на флопе твоя продолжающая ставка против него часто работает.","rule":"Лимп-колл — чаще всего средняя рука.","tag":"Лимпер в лайве"},{"id":"s-rng-07","cat":"ranges","level":2,"simple":true,"pos":"SB vs BB","hero":"","board":"","pot":null,"stack":8,"q":"Короткий стек 8бб. Все сбросили до него, и он с SB идёт олл-ин в тебя на BB. Какие руки у него могут быть?","opts":["Только мусор","Очень много рук: любые тузы, пары, многие короли и бродвеи","Только AA–QQ и AK"],"ans":1,"why":"С таким коротким стеком на SB игроку нужно ставить олл-ин очень часто, иначе блайнды его съедят. Против одного BB он пушит больше половины всех рук. Поэтому коллировать против него можно заметно шире, чем хочется.","rule":"Короткий стек с поздней позиции пушит широко — не жди от него только монстров.","tag":"Пуш короткого стека"},{"id":"s-exp-01","cat":"exploit","level":1,"simple":true,"pos":"","hero":"Qh Jd","board":"Qs 8c 4d 2h 3s","pot":20,"stack":null,"q":"Соперник — Станция: коллирует почти всё. Ривер, доска Qs 8c 4d 2h 3s, он чекает тебе. У тебя QJ — топ-пара. Что делаешь?","opts":["Ставка на вэлью","Чек — пусть сам покажет","Огромный олл-ин в несколько банков"],"ans":0,"why":"Станция заплатит тебе с дамами похуже, восьмёрками и даже мелкими парами. Против такого игрока главное — добирать деньги с готовыми руками. Чек на ривере здесь просто теряет деньги, а огромная ставка отпугнёт даже его.","rule":"Против станции ставь на вэлью шире и не блефуй.","tag":"Против станции: вэлью"},{"id":"s-exp-02","cat":"exploit","level":1,"simple":true,"pos":"","hero":"Ah 5h","board":"Kh 9h 4c 2s 7d","pot":22,"stack":null,"q":"Против Станции ты коллировал с флеш-дро, а на ривере оно не собралось. Доска Kh 9h 4c 2s 7d, соперник чекает. У тебя Ah 5h. Что делаешь?","opts":["Чек","Крупный блеф","Маленькая ставка-блеф"],"ans":0,"why":"Станция почти никогда не сбрасывает пару, поэтому блеф против неё — подарок. Твой туз иногда даже выиграет на вскрытии. Просто чекни и сбереги фишки.","rule":"Станцию не блефуют.","tag":"Против станции: без блефа"},{"id":"s-exp-03","cat":"exploit","level":1,"simple":true,"pos":"","hero":"Kc Qd","board":"Kd 9s 6h 3c Js","pot":30,"stack":null,"q":"Нит весь вечер играл только сильные руки и ни разу не блефовал. На ривере он ставит в банк. Доска Kd 9s 6h 3c Js, у тебя KQ — топ-пара. Что делаешь?","opts":["Колл — топ-пара хорошая рука","Рейз","Фолд"],"ans":2,"why":"Нит ставит крупно на ривере почти только с руками сильнее одной пары. Твоя топ-пара против него обычно проигрывает. Выгоднее сэкономить фишки и дождаться лучшего момента.","rule":"Крупная ставка нита на ривере — сбрасывай одну пару.","tag":"Против нита: фолд"},{"id":"s-exp-04","cat":"exploit","level":1,"simple":true,"pos":"BTN","hero":"Qc 5d","board":"","pot":2.5,"stack":30,"q":"На обоих блайндах сидят Ниты. Все сбросили до тебя на баттоне, стек 30бб. У тебя Q5 разномастные. Что делаешь?","opts":["Фолд — рука слабая","Лимп","Рейз — ниты часто отдадут блайнды"],"ans":2,"why":"Ниты защищают блайнды только с сильными руками и сбрасывают почти всё остальное. Значит, твой рейз часто сразу забирает банк, какие бы карты у тебя ни были. Если нит всё же отвечает 3-бетом — спокойно сбрасывай.","rule":"Против нитов на блайндах воруй чаще.","tag":"Против нита: кража блайндов"},{"id":"s-exp-05","cat":"exploit","level":2,"simple":true,"pos":"","hero":"Ac Jd","board":"Jh 7s 3d 5c","pot":18,"stack":40,"q":"Маньяк ставит почти в каждой раздаче. Флоп Jh 7s 3d, тёрн 5c — он ставит на обеих улицах. У тебя AJ, топ-пара. Что делаешь?","opts":["Фолд — с ним лучше не связываться","Мин-рейз","Колл — пусть дальше ставит"],"ans":2,"why":"Маньяк ставит с огромным количеством слабых рук и блефов, так что топ-пара против него — сильная рука. Если рейзить, он сбросит мусор и продолжит в основном с тем, что тебя бьёт. Колл позволяет ему и дальше блефовать в тебя.","rule":"С хорошей рукой против маньяка чаще коллируй — пусть блефует сам.","tag":"Против маньяка: ловля"},{"id":"s-exp-06","cat":"exploit","level":2,"simple":true,"pos":"CO vs BTN","hero":"Ad Jd","board":"","pot":10.7,"stack":25,"q":"Ты открылся с CO на 2.2бб. Маньяк на баттоне делает 3-бет почти каждый раз — и сейчас поднимает до 6бб. Стек 25бб, у тебя AJ одномастные. Что делаешь?","opts":["Фолд","Колл","Олл-ин"],"ans":2,"why":"Маньяк делает 3-бет с кучей слабых рук, и AJ против них — сильная рука. С 25бб олл-ин забирает уже немаленький банк, когда он сбрасывает, а когда коллирует — ты часто впереди. Колл оставляет тебя играть сложный банк без позиции.","rule":"Против частых 3-бетов маньяка отвечай олл-ином с хорошими руками.","tag":"Против маньяка: пуш"},{"id":"s-exp-07","cat":"exploit","level":1,"simple":true,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"За столом Обычный регуляр: играет разумно, без явных ошибок. Как лучше играть против него?","opts":["Блефовать его чаще всех — он умный и сбросит","Играть стандартно, уважать его крупные ставки и искать деньги у слабых игроков","Коллировать до ривера, чтобы он не блефовал"],"ans":1,"why":"У регуляра нет большой дыры, которую легко использовать. Основные деньги за столом ты заработаешь на слабых игроках, а с регуляром лучше не устраивать лишних войн. Если он неожиданно сильно атакует, чаще всего у него есть рука.","rule":"Против регуляра играй надёжно, а деньги ищи у слабых.","tag":"Против регуляра"},{"id":"s-math-01","cat":"math","level":1,"simple":true,"pos":"","hero":"","board":"","pot":20,"stack":null,"q":"Ривер. В банке 20бб, соперник ставит 10бб — полбанка. Как часто твой колл должен выигрывать, чтобы быть в плюс на дистанции?","opts":["Хотя бы 1 раз из 4","Хотя бы 1 раз из 2","Хотя бы 1 раз из 10"],"ans":0,"why":"Ты доплачиваешь небольшую часть того, что можешь забрать: за полбанка получаешь весь банк вместе с его ставкой. Поэтому колл окупается, если ты выигрываешь примерно 1 раз из 4. Если соперник блефует хотя бы так часто — коллируй.","rule":"Ставка в полбанка — колл должен выигрывать 1 раз из 4.","tag":"Цена колла: полбанка"},{"id":"s-math-02","cat":"math","level":1,"simple":true,"pos":"","hero":"","board":"","pot":20,"stack":null,"q":"Ривер. В банке 20бб, соперник ставит 20бб — размер банка. Как часто твой колл должен выигрывать, чтобы быть в плюс на дистанции?","opts":["Почти всегда","Примерно 1 раз из 3","Примерно 1 раз из 2","Примерно 1 раз из 5"],"ans":1,"why":"Чем крупнее ставка, тем чаще тебе нужно выигрывать. При ставке в банк колл окупается, если ты выигрываешь примерно 1 раз из 3. Против игрока, который почти не блефует крупно, этого часто не хватает.","rule":"Ставка в банк — колл должен выигрывать 1 раз из 3.","tag":"Цена колла: ставка в банк"},{"id":"s-math-03","cat":"math","level":1,"simple":true,"pos":"","hero":"Ah 6h","board":"Kh 9h 3c","pot":null,"stack":null,"q":"Флоп Kh 9h 3c, у тебя Ah 6h. Сколько у тебя аутов на флеш?","opts":["9","4","13"],"ans":0,"why":"Флеш-дро почти всегда даёт девять аутов: это все оставшиеся в колоде карты твоей масти. Запомни это число — оно встречается постоянно.","rule":"Флеш-дро — 9 аутов.","tag":"Считать ауты"},{"id":"s-math-04","cat":"math","level":1,"simple":true,"pos":"","hero":"Ah 6h","board":"Kh 9h 3c 2d","pot":null,"stack":null,"q":"Тёрн 2d. У тебя флеш-дро — 9 аутов, впереди только ривер. Какой примерно шанс собрать флеш?","opts":["Около половины","Почти наверняка","Около 1 раза из 5"],"ans":2,"why":"С одной картой впереди шансы собрать флеш скромные — примерно 1 раз из 5. Это меньше, чем кажется, поэтому за дро нельзя платить любую цену.","rule":"На тёрне ауты × 2 — это твой шанс в процентах.","tag":"Правило 2 и 4: тёрн"},{"id":"s-math-05","cat":"math","level":2,"simple":true,"pos":"","hero":"7h 6h","board":"Kh Qs 2h 9c","pot":20,"stack":20,"q":"Тёрн. В банке 20бб, соперник идёт олл-ин на 20бб. У тебя 7h 6h — только флеш-дро, больше ничего. Колл или фолд?","opts":["Фолд","Колл, потому что банк большой","Колл — флеш-дро сильное"],"ans":0,"why":"Против ставки в банк колл должен выигрывать примерно 1 раз из 3, а флеш на ривере собирается заметно реже. Соперник уже олл-ин, поэтому даже собрав флеш, больше ты с него не получишь. Шансов не хватает — сбрасывай.","rule":"Против олл-ина в банк одного флеш-дро на тёрне мало.","tag":"Дро против олл-ина"},{"id":"s-math-06","cat":"math","level":2,"simple":true,"pos":"","hero":"Jc Tc","board":"Ac 7c 3d","pot":12,"stack":40,"q":"Флоп Ac 7c 3d, у тебя Jc Tc — флеш-дро. Соперник ставит маленькую ставку, треть банка. Хватает ли шансов для колла?","opts":["Нет, только фолд","Да, колл","Хватает только на олл-ин"],"ans":1,"why":"Против маленькой ставки выигрывать нужно совсем нечасто, а флеш-дро собирается уже на следующей карте примерно 1 раз из 5 — и ещё есть ривер. А если соберёшь, часто доберёшь фишек сверху. Колл здесь в плюс на дистанции.","rule":"Против маленькой ставки с флеш-дро почти всегда колл.","tag":"Колл с дро"},{"id":"s-math-07","cat":"math","level":2,"simple":true,"pos":"","hero":"9h 8d","board":"7c 6s 2d","pot":null,"stack":null,"q":"Флоп 7c 6s 2d, у тебя 98 — двустороннее стрит-дро, 8 аутов. Все фишки ушли в олл-ин на флопе, впереди тёрн и ривер. Какие примерно шансы собрать стрит?","opts":["Около трети","Около 8%","Около 80%"],"ans":0,"why":"Когда впереди тёрн и ривер, двустороннее стрит-дро собирается примерно в трети случаев. Это неплохо, но чаще ты всё же не соберёшь — помни об этом, когда идёшь олл-ин с дро.","rule":"На флопе ауты × 4, на тёрне ауты × 2 — это шанс в процентах.","tag":"Правило 2 и 4: флоп"},{"id":"s-win-01","cat":"mental","level":1,"simple":true,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Ты хочешь регулярно играть онлайн-турниры с бай-ином 10$. Какой банкролл для этого обычно советуют?","opts":["Около 10 бай-инов — 100$","100 бай-инов и больше — от 1000$","Около 30 бай-инов — 300$"],"ans":1,"why":"В турнирах результаты сильно скачут: можно долго не попадать в призы, даже играя хорошо. Большой запас бай-инов позволяет пережить такие полосы и не разориться. Если банкролл сильно просел — спустись на лимит ниже.","rule":"Для онлайн-турниров держи 100+ бай-инов.","tag":"Банкролл онлайн"},{"id":"s-win-02","cat":"mental","level":2,"simple":true,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Ты любитель и играешь живые турниры по выходным. Сколько бай-инов разумно держать отдельно отложенными на покер?","opts":["Достаточно 3–5","Можно играть на последние деньги","Хотя бы 30–50"],"ans":2,"why":"Живых турниров ты играешь мало, и полоса без призов может растянуться на месяцы. Отдельный покерный бюджет на несколько десятков бай-инов защищает и от разорения, и от игры «на нервах». Деньги на жизнь в покер не идут никогда.","rule":"Покерные деньги — отдельно, минимум 30–50 бай-инов.","tag":"Банкролл в лайве"},{"id":"s-win-03","cat":"mental","level":1,"simple":true,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Час ночи, ты устал после рабочего дня и уже сыграл несколько турниров. Стартует ещё один длинный турнир. Что разумнее?","opts":["Пропустить и сыграть, когда будешь свежим","Зарегистрироваться и играть быстрее, чтобы закончить пораньше","Зарегистрироваться — вдруг повезёт"],"ans":0,"why":"Уставший игрок делает больше ошибок и хуже замечает, что происходит за столом. Длинный турнир требует внимания много часов подряд. Лучше играть в те часы, когда ты свежий и сосредоточенный.","rule":"Играй в свои лучшие часы, а не на последних силах.","tag":"Усталость"},{"id":"s-win-04","cat":"mental","level":1,"simple":true,"pos":"","hero":"As Ad","board":"","pot":null,"stack":null,"q":"Ты пошёл олл-ин префлоп с AA против KK соперника и проиграл — на доске пришёл король. Что это значит?","opts":["Ты сыграл правильно, просто не повезло","Ты сыграл неправильно","В следующий раз надо сбросить тузы"],"ans":0,"why":"С тузами против королей ты сильно впереди, и такие олл-ины приносят деньги на дистанции. Но иногда ты всё равно проигрываешь — это нормально. Оценивай решение, а не то, какая карта пришла.","rule":"Хорошее решение может проиграть — оценивай решения, а не результаты.","tag":"Решения, а не результаты"},{"id":"s-win-05","cat":"mental","level":1,"simple":true,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Живой кэш, свободны места за двумя столами. За первым — шумные любители, много лимпов и коллов. За вторым — тихие сосредоточенные регуляры. Куда садиться?","opts":["Неважно, карты везде одинаковые","За второй — там серьёзная игра","За первый — там больше ошибок, на которых можно заработать"],"ans":2,"why":"Деньги в покере приходят от ошибок соперников. За столом со слабыми игроками ошибок намного больше. Выбор стола — один из самых простых способов выигрывать больше.","rule":"Садись туда, где соперники слабее тебя.","tag":"Выбор стола"},{"id":"s-win-06","cat":"mental","level":2,"simple":true,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Турнир с ребаями. Ты планировал максимум один ребай, но уже сделал два и злишься после обидного проигрыша. Хочется закупиться ещё раз. Что разумнее?","opts":["Закупиться и играть агрессивнее, чтобы быстрее набрать фишек","Закупиться — надо отыграться","Остановиться: держаться плана и сделать перерыв"],"ans":2,"why":"Желание отыграться — первый признак тильта. В злом состоянии ты играешь хуже, а ребаи быстро превращают дешёвый турнир в дорогой. План на ребаи придумывают заранее как раз для таких моментов.","rule":"Лимит ребаев решай до турнира и не меняй его на эмоциях.","tag":"Ребаи и тильт"},{"id":"s-win-07","cat":"mental","level":1,"simple":true,"pos":"","hero":"","board":"","pot":null,"stack":null,"q":"Ты играешь пару раз в неделю. Как быстрее всего расти как игрок?","opts":["Запоминать, кому везёт, и избегать их","После игры разбирать несколько сложных раздач, где сомневался","Просто больше играть — опыт придёт сам"],"ans":1,"why":"Без разбора одни и те же ошибки повторяются годами. Достаточно после сессии записать пару раздач, где ты сомневался, и спокойно подумать, как было лучше. Их можно обсудить с другом или тренером.","rule":"Разбирай свои сложные раздачи после каждой сессии.","tag":"Разбор раздач"}];

 ],
 q:[

{id:'l-pos',m:'pre',t:'Позиция: почему поздние места выгоднее',min:6,
 b:[
  {p:'Позиция — это то, когда ты действуешь после флопа. На баттоне (BTN) ты всегда ходишь последним: видишь, что сделали все остальные, и только потом решаешь. Это огромное преимущество. Поэтому с поздних мест можно играть больше рук, а с ранних — меньше.'},
  {p:'С первых мест (UTG) за тобой ещё много игроков, и у кого-то из них может оказаться сильная рука. Поэтому отсюда играй только хорошие руки.'},
  {grid:{core:'77+,ATs+,KJs+,QJs,AJo+,KQo',border:'55,66,A5s,A9s,KTs,QTs,JTs,ATo',t:'Открытие с ранних мест (UTG, MP), турнир ~40бб'}},
  {grid:{core:'22+,A2s+,K8s+,Q9s+,J9s+,T9s,98s,87s,A8o+,KTo+,QTo+,JTo',border:'K5s-K7s,Q8s,J8s,T8s,76s,65s,A2o-A7o,K9o,Q9o,J9o',t:'Открытие с баттона (BTN), турнир ~40бб'}},
  {rule:'Чем ближе к баттону, тем больше рук можно открывать. С ранних мест — только сильные.'},
  {ex:{hero:'Kc Td',pos:'UTG, турнир 40бб'},t:'Тебе пришли KTo на первом месте за столом из 8 игроков.',v:'Фолд. Рука выглядит неплохо, но её часто бьют AK, KQ, KJ, AT. Если ты попадёшь в короля, то часто проиграешь крупный банк. С баттона та же рука — уверенное открытие.'},
  {p:'Размер открытия в турнире: 2–2.2бб. В живом кэше обычно больше: 3–4бб, плюс 1бб за каждого лимпера.'},
 ],
 q:[
  {q:'С какой позиции можно открыть Q9s?',opts:['UTG','С баттона','Никогда'],ans:1,why:'Одномастная Q9 хорошо играет в позиции. С баттона это нормальное открытие, а с первого места — фолд.'},
  {q:'Почему с баттона можно играть больше рук?',opts:['Потому что там меньше блайндов','Потому что ты весь розыгрыш после флопа ходишь последним','Потому что соперники на баттоне всегда сбрасывают'],ans:1,why:'Тот, кто ходит последним, видит действия всех и принимает решения с большей информацией. Это превращается в деньги.'},
 ]},
{id:'l-vsraise',m:'pre',t:'Что делать, если до тебя уже рейз',min:6,
 b:[
  {p:'Когда кто-то уже открылся, правила меняются. Его рука в среднем сильнее случайной, поэтому тебе нужна рука получше. У тебя три варианта:'},
  {tbl:{h:['Действие','С чем','Зачем'],r:[['3-бет (перерейз)','QQ+, AK. Против баттона и CO ещё JJ, TT, AQ и немного одномастных тузов вроде A5s','Сильные руки хотят большой банк. Иногда это давление, если он часто сбрасывает'],['Колл','Средние пары 22–TT, одномастные бродвеи (KQs, QJs, JTs), AQ, AJs — лучше в позиции','Посмотреть флоп с рукой, которая может стать очень сильной'],['Фолд','Всё остальное: слабые тузы, разномастный мусор, KJo против раннего рейза','Не платить за слабую руку против сильной']]}},
  {rule:'Против рейза с ранней позиции играй очень плотно. Против рейза с баттона можно отвечать шире.'},
  {ex:{hero:'Ah Jd',pos:'CO против рейза UTG, турнир 40бб'},t:'Игрок с первого места открылся, ты на CO с AJo.',v:'Фолд. Против раннего рейза AJo часто попадает в ловушку: AK и AQ её бьют, а хуже она выигрывает немного. Это одна из самых дорогих ошибок любителей.'},
  {ex:{hero:'7s 7h',pos:'BTN против рейза CO, турнир 45бб'},t:'Игрок на CO открылся до 2.2бб. У тебя 77 на баттоне.',v:'Колл в позиции, хороший вариант. Иногда сделаешь сет и заберёшь его стек, иногда выиграешь банк, просто потому что ходишь последним.'},
  {p:'Большой блайнд (BB) — особое место. Ты уже вложил 1бб, а в турнире ещё и анте, поэтому против открытия с поздних позиций защищай BB широко: многие одномастные руки, связанные карты, любые тузы и короли с нормальным кикером.'},
 ],
 q:[
  {q:'Нит открылся с UTG. У тебя KQo на BTN. Что делаешь?',opts:['3-бет','Фолд','Колл и олл-ин на любом флопе'],ans:1,why:'Нит с первого места играет AA–TT, AK, AQ. KQo против этого почти всегда позади. Фолд.'},
  {q:'Тебе пришли QQ, соперник открылся с CO. Действие?',opts:['3-бет','Колл','Фолд'],ans:0,why:'QQ — одна из сильнейших рук. Она хочет большой банк, поэтому делай 3-бет.'},
 ]},
{id:'l-short',m:'pre',t:'Короткий стек в турнире: пуш или фолд',min:7,
 b:[
  {p:'В турнире размер стека в больших блайндах (бб) меняет всё. Чем короче стек, тем меньше места для игры после флопа и тем важнее просто выбрать: пушить (олл-ин) или сбрасывать.'},
  {tbl:{h:['Стек','Как играть'],r:[['40бб и больше','Обычный покер: открывай, коллируй в позиции, играй после флопа'],['20–40бб','Открывай чуть меньше (2бб). Реже коллируй 3-беты. Против открытия с поздних позиций делай олл-ин хорошими руками вместо колла'],['12–20бб','Рейз-фолд со слабыми руками, рейз-олл-ин с сильными. Против чужого рейза — олл-ин или фолд, почти без коллов'],['Меньше 12бб','Только олл-ин или фолд. Сам рейз уже съедает слишком много стека']]}},
  {rule:'Первым идти олл-ин гораздо выгоднее, чем коллировать чужой олл-ин. Твой пуш может забрать банк сразу, а колл выигрывает только на вскрытии.'},
  {grid:{core:'22+,A2s+,A2o+,K5s+,K9o+,Q8s+,QTo+,J8s+,JTo,T8s+,98s,87s,76s',border:'K2s-K4s,K5o-K8o,Q5s-Q7s,Q9o,J7s,J9o,T7s,T9o,97s,86s,65s,54s',t:'Пуш с баттона при 10бб, когда все сбросили до тебя (осторожная версия)'}},
  {p:'Это примерно треть всех рук, и это осторожная версия. Сильные игроки с баттона при 10бб пушат ещё шире. С ранних позиций диапазон пуша заметно уже: пары 55+, тузы от A9, KQ.'},
  {ex:{hero:'Kh 8h',pos:'BTN, 10бб, турнир с анте'},t:'Все сбросили до тебя. Стек 10бб, у тебя K8s.',v:'Олл-ин. Блайнды часто сбросят, и ты заберёшь 2.5бб без борьбы. А если заплатят, у K8s неплохие шансы даже против туза.'},
  {ex:{hero:'Ad 9c',pos:'BB против олл-ина нита с UTG, 12бб'},t:'Очень тайтовый игрок пушит 12бб с первого места. У тебя A9o на BB.',v:'Фолд. Пуш нита с первого места — это большие пары и сильные тузы. A9 против них почти всегда сильно позади.'},
 ],
 q:[
  {q:'Стек 8бб, ты на CO, до тебя все сбросили, у тебя A7o. Действие?',opts:['Рейз 2бб','Олл-ин','Фолд'],ans:1,why:'При 8бб только олл-ин или фолд. A7o с CO на таком стеке — нормальный пуш.'},
  {q:'Почему пушить самому лучше, чем коллировать чужой пуш?',opts:['Потому что так можно выиграть банк без вскрытия','Потому что пушить безопаснее','Разницы нет'],ans:0,why:'У того, кто ставит первым, два способа выиграть: соперник сбросит или ты выиграешь на вскрытии. У коллирующего — только второй.'},
 ]},
{id:'l-limp',m:'pre',t:'Живая игра: что делать с лимперами',min:4,
 b:[
  {p:'В живых играх многие просто уравнивают блайнд (лимпуют). Обычно это слабые руки: с сильными любитель чаще рейзит. Лимп отдаёт тебе инициативу.'},
  {rule:'Против лимпера рейзь крупнее: 4бб + 1бб за каждого лимпера. Играй руками получше его диапазона и предпочтительно в позиции.'},
  {ex:{hero:'Ac Td',pos:'BTN, живой кэш 1/2, один лимпер'},t:'Любитель залимповал с MP. У тебя ATo на баттоне.',v:'Рейз до $10–12 (5–6бб). Ты изолируешь слабого игрока и будешь играть против него в позиции с инициативой.'},
  {p:'Не надо лимповать следом с мусором «посмотреть флоп дёшево». В мультипоте со слабой рукой ты чаще проиграешь, чем выиграешь. Исключение — мелкие пары и одномастные коннекторы при глубоких стеках: они играют на сет или стрит.'},
  {p:'Лимп-рейз от пассивного любителя (сначала залимповал, потом поднял после твоего рейза) почти всегда означает AA или KK. Сбрасывай всё, кроме очень сильных рук.'},
 ],
 q:[
  {q:'Залимповали два игрока, ты на CO с KQo, живой кэш 1/2. Сколько рейзить?',opts:['$6','$12–14','$40'],ans:1,why:'4бб + 1бб за каждого лимпера = 6бб, то есть около $12–14. Меньше — тебя заколлируют все, и банк будет мультипотом.'},
 ]},

{id:'l-cbet',m:'post',t:'Продолжающая ставка: когда ставить',min:7,
 b:[
  {p:'Продолжающая ставка (c-bet) — это ставка на флопе после того, как ты рейзил префлоп. Главный вопрос: кому эта доска помогла больше — тебе или ему?'},
  {ex:{hero:'Ah Qc',board:'Kd 7c 2s',pos:'BTN против BB'},t:'Ты открылся с баттона, BB заколлировал. Флоп сухой: K-7-2 разных мастей.',v:'Ставь часто и мало, примерно треть банка. У тебя на такой доске больше сильных рук: KK, AK, KQ. А BB часто вообще ни во что не попал. Даже без пары ставка часто забирает банк.'},
  {ex:{hero:'Ah Qc',board:'8h 7h 6d',pos:'BTN против BB'},t:'Та же раздача, но флоп 8-7-6 с двумя червями.',v:'Чаще чекай. Эта доска попадает в руки, которыми BB защищается: 98, 76, 65, мелкие пары, червовые дро. Ставка с AQ без пары здесь часто нарвётся на рейз. Ставь только с хорошими руками и сильными дро.'},
  {tbl:{h:['Доска','Что делать'],r:[['Высокая и сухая (K72, A83, Q42 разных мастей)','Ставь часто и маленько, около трети банка'],['Средняя связанная (987, T86, 865)','Ставь реже, в основном с сильными руками и дро, ставка побольше'],['Спаренная (774, QQ5)','Ставь часто и маленько: соперник редко попадает'],['Три карты одной масти','Осторожно. Ставь с флешем, сильным дро или тузом этой масти'],['Против двух и больше соперников','Ставь только с хорошей рукой или сильным дро. Блеф должен пройти сразу через всех']]}},
  {rule:'Сухая высокая доска — ставь маленько и часто. Мокрая низкая доска — ставь редко и с силой.'},
 ],
 q:[
  {q:'Ты открылся с CO, BB коллирует. Флоп A-8-3 разных мастей, у тебя KJ без пары. Что делаешь?',opts:['Чек и сдаюсь','Ставка около трети банка','Олл-ин'],ans:1,why:'Туз на доске лучше подходит твоему диапазону: у тебя больше AK, AQ, AJ. Маленькая ставка часто забирает банк.'},
  {q:'Мультипот на троих, флоп J-T-9 с двумя пиками, у тебя AK без пик. Ставить?',opts:['Да, у меня инициатива','Нет, лучше чек','Да, олл-ин'],ans:1,why:'Связанная доска плюс два соперника. Почти наверняка кто-то попал в пару, стрит или дро. Блеф должен пройти через обоих, поэтому чек.'},
 ]},
{id:'l-toppair',m:'post',t:'Топ-пара: сколько улиц ставить',min:6,
 b:[
  {p:'Топ-пара — самая частая сильная рука. Это хорошая рука, но не монстр. Главный вопрос: какие худшие руки тебе заплатят?'},
  {list:['Топ-пара с хорошим кикером (AK на K72) против обычного соперника: обычно две улицы ставок. На ривере ставь, если доска не стала страшной.','Против станции (коллирует всё) — три улицы ставок, и покрупнее. Он платит второй парой и даже меньше.','Топ-пара со слабым кикером (K4 на K72): одна-две ставки, дальше аккуратно. Если он сам начинает давить, часто ты позади.']},
  {ex:{hero:'Ad Kh',board:'Ks 8c 4d 2h 5c',pos:'CO против BB, станция'},t:'Флоп и тёрн ты поставил, станция заплатила. Ривер 5♣. Он чекает.',v:'Ставь примерно 2/3 банка. Станция заплатит K-x похуже, 8-x и даже 4-x. Если пропустишь ставку, отдашь деньги, которые он был готов заплатить.'},
  {ex:{hero:'Ad Kh',board:'Ks 8c 4d 2h 5c',pos:'CO против BB, пассивный любитель'},t:'Та же раздача, но на ривере пассивный любитель (почти не ставит сам) делает чек-рейз всего стека.',v:'Фолд. Пассивный игрок рейзит на ривере почти только с очень сильными руками: две пары, сет, стрит. Топ-пару он так не играет. Это одна из самых важных привычек плюсового игрока.'},
  {rule:'Ставь, пока худшие руки готовы платить. Когда пассивный соперник вдруг начинает рейзить, топ-пара почти всегда позади.'},
 ],
 q:[
  {q:'У тебя QJ на Q-7-3-2-8, доска без флеша. Соперник — нит, чекает тебе на ривере. Ставить?',opts:['Да, крупно','Да, небольшую ставку или чек','Олл-ин'],ans:1,why:'Нит платит только сильными руками, которые тебя бьют. Маленькая ставка или чек. Крупно ставь против станций.'},
 ]},
{id:'l-draws',m:'post',t:'Дро: когда давить, а когда коллировать',min:7,
 b:[
  {p:'Дро — это рука, которой не хватает одной карты до стрита или флеша. Важно понимать, как часто ты её соберёшь:'},
  {tbl:{h:['Дро','Карт-аутов','Соберёшь к риверу (с флопа)','Соберёшь на следующей карте'],r:[['Флеш-дро','9','около 1 из 3 (35%)','около 1 из 5 (20%)'],['Двусторонний стрит-дро','8','около 1 из 3 (31%)','около 1 из 6 (17%)'],['Флеш-дро + стрит-дро','15','больше половины (54%)','около 1 из 3 (33%)'],['Гатшот (стрит-дро в середину)','4','около 1 из 6 (16%)','около 1 из 12 (9%)']]}},
  {p:'Быстрое правило: умножь число аутов на 4 на флопе (до ривера) или на 2 на тёрне (одна карта). Флеш-дро на тёрне: 9 × 2 = 18%, примерно 1 раз из 5.'},
  {tbl:{h:['Ставка соперника','Как часто нужно выигрывать, чтобы колл был в плюс'],r:[['Треть банка','1 раз из 5 (20%)'],['Полбанка','1 раз из 4 (25%)'],['2/3 банка','чуть реже, чем 1 раз из 3 (29%)'],['Банк','1 раз из 3 (33%)']]}},
  {rule:'Сильное дро (флеш-дро, особенно с оверкартами) играй агрессивно: ставь и рейзь. Слабое дро (гатшот) не оплачивай против больших ставок.'},
  {ex:{hero:'Ah 5h',board:'Kh 9h 3c',pos:'BTN против BB'},t:'У тебя натсовое флеш-дро. BB делает чек.',v:'Ставь. Ты выигрываешь, если он сбросит сразу, а если заплатит, у тебя ещё около трети шансов собрать флеш. Плюс туз может стать лучшей парой.'},
  {ex:{hero:'Jc Td',board:'Kh 9c 2d 3s',pos:'Тёрн, соперник ставит банк'},t:'У тебя гатшот: стрит соберёт только дама. Соперник ставит банк.',v:'Фолд. Ты соберёшь стрит примерно 1 раз из 12, а для колла нужен 1 раз из 3. Даже если соберёшь, большой выплаты не жди.'},
 ],
 q:[
  {q:'Тёрн, у тебя флеш-дро, соперник ставит полбанка. Он олл-ин, больше ставок не будет. Колл в плюс?',opts:['Да, флеш-дро всегда колл','Нет, нужно 1 из 4, а у тебя примерно 1 из 5','Да, если у меня хорошее предчувствие'],ans:1,why:'На тёрне флеш-дро собирается примерно 1 раз из 5, а ставка в полбанка требует 1 из 4. Без будущих выплат колл чуть в минус. Если стеки глубокие и он заплатит на ривере, колл становится нормальным.'},
 ]},
{id:'l-river',m:'post',t:'Ривер: ставить, чекать или сдаваться',min:6,
 b:[
  {p:'На ривере больше не придёт ни одной карты. Значит, ставка нужна только по двум причинам:'},
  {list:['Вэлью: тебе заплатят худшие руки.','Блеф: сбросят лучшие руки.']},

е нужен колл именно от худших рук. Против хорошего игрока это было бы рискованно, но станция платит слишком широко.","range":{"strong":25,"medium":55,"draw":0,"air":20},"rangeNote":"После колла на тёрне у него чаще всего пара похуже твоей: девятка, четвёрка, семёрка, мелкие пары.","rule":"Тонкая вэлью-ставка против станции: маленькая ставка на ривере с рукой, которая бьёт его типичную пару."}],"summary":"Против станции зарабатывают не блефом, а ставками со средними руками. Если твоя рука бьёт его типичную пару — ставь понемногу, он заплатит."},{"id":"h14","title":"Изоляция лимпера","format":"Живой кэш 1/2","level":1,"hero":"Kc Qd","heroPos":"BTN","villainPos":"MP","villain":"Станция: лимпует много рук, а потом коллирует, пока есть хоть что-то.","stack":100,"steps":[{"street":"preflop","board":"","pot":2.5,"text":"Стеки по 100бб. MP (станция) просто уравнял блайнд — лимп. Все сбросили до тебя. Ты на BTN с K♣Q♦.","opts":["Рейз до 5бб","Лимп следом — посмотреть флоп дёшево","Фолд"],"best":0,"why":"Лимпер — слабый игрок с непонятной рукой. Рейз изолирует его: блайнды чаще сбросят, и ты сыграешь против него один на один, в позиции и с рукой сильнее. Лимп следом пускает в банк всех и отдаёт инициативу.","range":{"strong":5,"medium":35,"draw":35,"air":25},"rangeNote":"Лимпуют обычно средние и спекулятивные руки: мелкие пары, одномастные, слабые тузы. Сильные руки он лимпует редко.","rule":"Против лимпера с хорошей рукой — рейз побольше обычного и игра один на один."},{"street":"flop","board":"Kh 8s 5d","pot":11.5,"text":"Блайнды сбросили, станция уравнял. Флоп K♥ 8♠ 5♦, он чек. У тебя топ-пара с хорошим кикером.","opts":["Чек — пусть сам ставит","Продолжающая ставка (c-bet) 7бб","Олл-ин 95бб"],"best":1,"why":"Станция заплатит с восьмёркой, пятёркой, королём похуже, мелкой парой и дро. Сам он почти не ставит, так что чек просто теряет деньги. Это вэлью-ставка — ставка, чтобы заплатили худшие руки.","range":{"strong":8,"medium":40,"draw":20,"air":32},"rangeNote":"Чек станции ничего не говорит. Чаще всего у него слабая пара, дро или ничего.","rule":"Против станции с топ-парой ставь, а не чекай."},{"street":"turn","board":"Kh 8s 5d 2c","pot":25.5,"text":"Колл. Тёрн 2♣ — пустая карта. Он снова чек.","opts":["Ставка 3бб","Чек","Ставка 17бб (2/3 банка)"],"best":2,"why":"Карта пустая, ты по-прежнему впереди. Станция, которая уравняла флоп, уравняет и тёрн. Маленькая ставка — недобор, а чек — бесплатная карта для его дро.","range":{"strong":10,"medium":55,"draw":25,"air":10},"rangeNote":"После колла флопа у него пары похуже и дро вроде 76 или 64.","rule":"Против станции ставь крупно каждую улицу, пока ты впереди."}],"summary":"Лимпер — подарок. Рейзи его с хорошей рукой, играй один на один в позиции и забирай свои ставки на каждой улице."},{"id":"h15","title":"Средняя пара: держи банк маленьким","format":"Онлайн кэш NL25","level":2,"hero":"As 7s","heroPos":"BTN","villainPos":"BB","villain":"Обычный регуляр: защищает BB широко, умеет делать чек-рейз и ставить, когда у него есть рука.","stack":100,"steps":[{"street":"flop","board":"Kh 7d 2c","pot":5.5,"text":"Стеки по 100бб. Ты открылся с BTN на 2.5бб с A♠7♠, BB уравнял. Флоп K♥ 7♦ 2♣, он чек. У тебя вторая пара с лучшим кикером.","opts":["Ставка 5.5бб — весь банк","Продолжающая ставка (c-bet) 2бб — треть банка","Олл-ин 97.5бб"],"best":1,"why":"На сухой доске маленькая ставка — дешёвый и удобный вариант. Слабые руки (мелкие пары, картинки без пары) часто сбросят или заплатят по мелочи. Ставить весь банк со второй парой — раздувать банк, где заплатят в основном короли.","range":{"strong":15,"medium":35,"draw":10,"air":40},"rangeNote":"BB защищался широко — на этой доске у него много промахов, немного королей и семёрок.","rule":"Средняя рука — ставь маленько или не ставь вовсе, но не раздувай банк."},{"street":"turn","board":"Kh 7d 2c Ts","pot":9.5,"text":"BB уравнял. Тёрн T♠, он снова чек.","opts":["Ставка 7бб","Олл-ин 95.5бб","Чек"],"best":2,"why":"Если поставишь, заплатят короли и десятки — руки, которые тебя бьют. А руки похуже (мелкие пары, семёрки с плохим кикером) сбросят. Ставка ничего не выигрывает. Чек держит банк маленьким и спасает от неприятного чек-рейза.","range":{"strong":30,"medium":40,"draw":15,"air":15},"rangeNote":"После колла флопа у него чаще короли, семёрки, мелкие пары и немного дро вроде QJ.","rule":"Средняя пара в позиции — чекни тёрн и доберись до вскрытия подешевле."},{"street":"river","board":"Kh 7d 2c Ts 4d","pot":12.5,"text":"Ты чекнул. Ривер 4♦. BB ставит 3бб — четверть банка.","opts":["Колл","Фолд","Рейз до 12бб"],"best":0,"why":"После твоего чека он может ставить маленько и с парами похуже, и с промахнувшимися дро. Тебе нужно выигрывать примерно 1 раз из 5, а твоя пара бьёт все его блефы и многие слабые руки. Рейз не нужен: худшие руки сбросят, а лучшие заплатят.","range":{"strong":25,"medium":35,"draw":0,"air":40},"rangeNote":"Маленькая ставка — это много чего: короли, пары похуже, промахнувшиеся дро.","rule":"Держал банк маленьким — плати маленькие ставки на ривере, в этом и смысл."}],"summary":"Средняя пара — не повод раздувать банк. Ставь маленько, чекай тёрн и спокойно плати небольшую ставку на ривере."},{"id":"h16","title":"Позиция: колл сейчас, ставка потом","format":"Онлайн кэш NL50","level":2,"hero":"Jd Td","heroPos":"BTN","villainPos":"CO","villain":"Обычный регуляр: ставит продолжающую ставку почти на любом флопе, но на тёрне без руки часто сдаётся.","stack":100,"steps":[{"street":"preflop","board":"","pot":4,"text":"Стеки по 100бб. CO открылся на 2.5бб. Ты на BTN с J♦T♦.","opts":["Колл","Фолд","Олл-ин 100бб"],"best":0,"why":"J♦T♦ — отличная рука для игры в позиции: собирает стриты, флеши, пары. Ты будешь действовать последним на каждой улице и видеть его решения. Олл-ин с такой рукой — безумие, а фолд — упущенная выгода.","range":{"strong":12,"medium":38,"draw":25,"air":25},"rangeNote":"CO открывается довольно широко: тузы, бродвеи, пары, одномастные.","rule":"Одномастные коннекторы и бродвеи лучше всего играются в позиции."},{"street":"flop","board":"9c 7s 2h","pot":8.5,"text":"Блайнды сбросили. Флоп 9♣ 7♠ 2♥. CO делает продолжающую ставку (c-bet) 2бб — треть банка.","opts":["Фолд — пары нет","Колл","Олл-ин 97.5бб"],"best":1,"why":"У тебя две карты старше доски и дыра в стрите: восьмёрка даёт стрит. Ставка маленькая, а ты в позиции — можно уравнять и посмотреть, что он сделает на тёрне. Регуляр ставит здесь почти всегда, так что часто у него тоже ничего.","range":{"strong":15,"medium":25,"draw":15,"air":45},"rangeNote":"Такую ставку он делает почти с любой рукой — у него много картинок без пары.","rule":"В позиции против маленькой ставки можно уравнять со старшими картами и дро."},{"street":"turn","board":"9c 7s 2h 3d","pot":10.5,"text":"Ты уравнял. Тёрн 3♦, CO чек.","opts":["Ставка 7бб (2/3 банка)","Чек — у меня по-прежнему ничего","Олл-ин 95.5бб"],"best":0,"why":"Он поставил флоп и сдался на тёрне — обычно это слабость: AK, AQ, KQ, мелкие пары. Такие руки на ставку часто сбросят. Даже если уравняет, у тебя ещё есть восьмёрка на стрит и старшие карты.","range":{"strong":15,"medium":30,"draw":10,"air":45},"rangeNote":"Чек после c-bet у регуляра — чаще всего картинки без пары, которые он отпустит.","rule":"Соперник сдался на тёрне — забирай банк ставкой, когда ты в позиции."}],"summary":"Позиция — твоё главное преимущество. Уравняй маленькую ставку в позиции и забери банк, когда соперник покажет слабость."}];

<script>
"use strict";
/* ============================== constants ============================== */
const AXES=[
  {id:'math',short:'Счёт',name:'Простой счёт',desc:'хватает ли шансов для колла, сколько аутов'},
  {id:'ranges',short:'Что у него',name:'Что у соперника',desc:'какие руки остались у соперника после его действий'},
  {id:'postflop',short:'После флопа',name:'Игра после флопа',desc:'когда ставить, сколько улиц, дро, ривер'},
  {id:'exploit',short:'Соперники',name:'Типы соперников',desc:'станция, нит, маньяк, регуляр — как играть против каждого'},
  {id:'preflop',short:'Префлоп',name:'Префлоп',desc:'какие руки играть, против рейза, короткий стек'},
  {id:'mental',short:'Дистанция',name:'Голова и дистанция',desc:'тилт, банкролл, как быть в плюсе на длинной дистанции'},
];
const AXIS=Object.fromEntries(AXES.map(a=>[a.id,a]));
const RANKS='AKQJT98765432';
const SUITS={s:'♠',h:'♥',d:'♦',c:'♣'};
const SRS_DAYS=[0,1,3,7,16,35];
const DAY=86400000;
const LS_KEY='pokerstab.v1';

/* ============================== utils ============================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>Math.round(x*100);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{try{const [y,m,d]=s.split('-');return d+'.'+m}catch(e){return s}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function card(c,sm){
  if(!c||c.length<2)return '';
  const r=c[0].toUpperCase().replace('1','T'),s=c[1].toLowerCase();
  if(!SUITS[s])return '';
  const cls=s==='s'?'s_':s;
  return `<span class="pc ${cls}${sm?' sm':''}" aria-label="${esc(r+s)}">${r==='T'?'10':esc(r)}<span class="s">${SUITS[s]}</span></span>`;
}
const tx=s=>esc(s).replace(/[♠♥♦♣]/g,m=>`<span class="st ${{'♠':'s','♥':'h','♦':'d','♣':'c'}[m]}">${m}&#xFE0E;</span>`);
const cardsOf=(str,sm)=>String(str||'').trim().split(/\s+/).filter(x=>/^[2-9TJQKA1][shdc]$/i.test(x)).map(c=>card(c,sm)).join('');

/* ============================== state ============================== */
function defaultState(){return{v:1,updatedAt:0,profile:null,diag:null,diagHistory:[],stats:{},srs:{},log:[],journal:[],tilt:null,plan:{done:{},start:null},aiQs:[],mathBest:null,rangeBest:{},routine:{},lessons:{},hands:{},prefs:{adv:false}}}
let S=defaultState();
function normalize(o){const d=defaultState();if(!o||typeof o!=='object')return d;for(const k in d){if(o[k]!==undefined)d[k]=o[k]}return d}
try{const raw=localStorage.getItem(LS_KEY);if(raw)S=normalize(JSON.parse(raw))}catch(e){}
let dbRef=null,saveTimer=null,saving=false,dirty=false,sampleFn=null;
function trimState(){
  if(S.log.length>400)S.log=S.log.slice(-400);
  if(S.journal.length>120)S.journal=S.journal.slice(-120);
  if(S.aiQs.length>60)S.aiQs=S.aiQs.slice(-60);
  if(S.diagHistory.length>8)S.diagHistory=S.diagHistory.slice(-8);
}
function save(){
  S.updatedAt=Date.now();trimState();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  if(dbRef){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)}
}
async function flush(){
  if(saving||!dirty||!dbRef)return;
  saving=true;dirty=false;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)))}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){dbRef=null;setSync(false)}else dirty=true}
  saving=false;
  if(dirty&&dbRef)saveTimer=setTimeout(flush,4000);
}
function setSync(on){const el=$('#sync');el.classList.toggle('on',!!on);el.querySelector('span').textContent=on?'Прогресс синхронизирован с тренером':'Прогресс хранится в этом браузере'}

async function initCaps(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  const [db,user,sample]=await Promise.all([
    claude.use('db').catch(()=>null),claude.use('user').catch(()=>null),claude.use('sample').catch(()=>null)]);
  if(sample){sampleFn=sample;rerender()}
  if(!db||!user)return;
  let owner=false;try{owner=await user.isOwner()}catch(e){}
  if(!owner)return;
  try{
    const ref=db.doc('coach/state');
    const snap=await ref.get();
    dbRef=ref;setSync(true);
    if(snap.exists){
      const remote=normalize(snap.data());
      if((remote.updatedAt||0)>(S.updatedAt||0)){S=JSON.parse(JSON.stringify(remote));try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}rerender()}
      else if((S.updatedAt||0)>(remote.updatedAt||0)){dirty=true;flush()}
    }else if(S.updatedAt){dirty=true;flush()}
  }catch(e){dbRef=null;setSync(false)}
}

/* ============================== stats / srs ============================== */
function logEvent(kind,cat,c,t,extra){S.log.push(Object.assign({d:today(),ts:Date.now(),kind,cat,c,t},extra||{}))}
function recordAnswer(q,ok){
  const st=S.stats[q.cat]||(S.stats[q.cat]={c:0,t:0});st.t++;if(ok)st.c++;
  const r=S.srs[q.id]||{box:0,due:0,seen:0,wrong:0};
  r.seen++;
  if(ok){r.box=Math.min(5,r.box+1);r.due=Date.now()+SRS_DAYS[r.box]*DAY}
  else{r.wrong++;r.box=0;r.due=Date.now()+8*60000}
  S.srs[q.id]=r;
}
function allQs(){return BANK.concat(S.aiQs||[])}
function poolQs(){return S.prefs&&S.prefs.adv?allQs():allQs().filter(q=>q.simple||q.ai)}
function qById(id){return allQs().find(q=>q.id===id)}
function dueQs(){const n=Date.now();return poolQs().filter(q=>{const r=S.srs[q.id];return r&&r.due<=n})}
function axisScore(id){
  // blend: latest diagnostic and drill accuracy (drills weigh more as volume grows)
  const d=S.diag&&S.diag.axes[id];const st=S.stats[id];
  const dv=d?d.score:null;const tv=st&&st.t?st.c/st.t:null;
  if(dv==null&&tv==null)return null;
  if(dv==null)return tv;if(tv==null)return dv;
  const w=Math.min(.7,st.t/40);
  return dv*(1-w)+tv*w;
}
function weakestAxes(){
  const arr=AXES.map(a=>({id:a.id,s:axisScore(a.id)})).filter(x=>x.s!=null).sort((a,b)=>a.s-b.s);
  return arr.length?arr:AXES.map(a=>({id:a.id,s:null}));
}
function doneToday(kind){return S.log.some(e=>e.d===today()&&e.kind===kind)}
function streak(){
  const days=new Set(S.log.map(e=>e.d));let n=0;const d=new Date();
  if(!days.has(today()))d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(days.has(k)){n++;d.setDate(d.getDate()-1)}else break}
  return n;
}

function radar(series,size){
  size=size||300;const cx=size/2,cy=size/2,R=size/2-58;const n=AXES.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
  let g='';
  [.25,.5,.75,1].forEach(l=>{g+=`<polygon points="${AXES.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="var(--line-2)" stroke-width="1"/>`});
  AXES.forEach((a,i)=>{const[x,y]=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const[lx,ly]=pt(i,1.2);const anchor=Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end';
    g+=`<text x="${lx}" y="${ly+4}" text-anchor="${anchor}" font-size="11.5" fill="var(--muted)" font-weight="600">${esc(a.short)}</text>`});
  series.forEach(s=>{
    const pts=AXES.map((a,i)=>pt(i,Math.max(.03,s.vals[a.id]??0)));
    g+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="2" ${s.dash?'stroke-dasharray="4 4"':''}/>`;
    if(!s.dash)pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.stroke}"/>`});
  });
  return `<svg viewBox="-40 0 ${size+80} ${size}" width="100%" style="max-width:${size+80}px;display:block;margin:0 auto" role="img" aria-label="Профиль навыков">${g}</svg>`;
}
function lineChart(points,opts){
  opts=opts||{};const W=600,H=170,pl=34,pr=12,pt=12,pb=26;
  if(points.length<2)return `<p class="muted">Нужно минимум два дня тренировок, чтобы появился график.</p>`;
  const xs=i=>pl+i*(W-pl-pr)/(points.length-1);const ys=v=>pt+(1-v)*(H-pt-pb);
  let g='';[0,.25,.5,.75,1].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${ys(v)+4}" text-anchor="end" font-size="10" fill="var(--faint)">${pct(v)}</text>`});
  const path=points.map((p,i)=>(i?'L':'M')+xs(i)+','+ys(p.v)).join(' ');
  g+=`<path d="${path} L${xs(points.length-1)},${ys(0)} L${xs(0)},${ys(0)} Z" fill="var(--brass)" opacity=".12"/>`;
  g+=`<path d="${path}" fill="none" stroke="var(--brass)" stroke-width="2.2"/>`;
  const step=Math.ceil(points.length/7);
  points.forEach((p,i)=>{if(i%step===0||i===points.length-1)g+=`<text x="${xs(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--faint)">${esc(p.l)}</text>`});
  const last=points[points.length-1];g+=`<circle cx="${xs(points.length-1)}" cy="${ys(last.v)}" r="4.5" fill="var(--brass)"/>`;
  return `<div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:340px;display:block" role="img" aria-label="${esc(opts.label||'График')}">${g}</svg></div>`;
}

const D={phase:'intro',qs:[],i:0,ans:[],sel:null,conf:null,t0:0,profile:{}};
function buildDiag(){
  const out=[];
  const adv=S.prefs&&S.prefs.adv;const per=adv?4:2;
  AXES.forEach(ax=>{
    const pool=BANK.filter(q=>q.cat===ax.id&&(adv?!q.simple:q.simple));
    const by=l=>shuffle(pool.filter(q=>q.level===l));
    let chosen=adv?[...by(1).slice(0,1),...by(2).slice(0,2),...by(3).slice(0,1)]:[...by(1).slice(0,1),...by(2).slice(0,1)];
    if(chosen.length<per)chosen=chosen.concat(shuffle(pool.filter(q=>!chosen.includes(q))).slice(0,per-chosen.length));
    out.push(chosen);
  });
  const res=[];for(let i=0;i<per;i++)shuffle(AXES.map((_,k)=>k)).forEach(k=>{if(out[k][i])res.push(out[k][i])});
  return res;
}

function buildSession(cat,n){
  n=n||10;const all=poolQs();const now=Date.now();
  let pool=cat==='smart'?all:cat==='review'?dueQs():all.filter(q=>q.cat===cat);
  const due=shuffle(pool.filter(q=>S.srs[q.id]&&S.srs[q.id].due<=now));
  const fresh=shuffle(pool.filter(q=>!S.srs[q.id]));
  const later=pool.filter(q=>S.srs[q.id]&&S.srs[q.id].due>now).sort((a,b)=>S.srs[a.id].due-S.srs[b.id].due);
  let out=due.slice(0,Math.ceil(n*.5));
  if(cat==='smart'){
    const w=weakestAxes();const weights={};w.forEach((x,i)=>weights[x.id]=Math.max(1,w.length-i));
    const f2=fresh.slice().sort((a,b)=>(weights[b.cat]||1)*Math.random()-(weights[a.cat]||1)*Math.random());
    out=out.concat(f2.slice(0,n-out.length));
  }else out=out.concat(fresh.slice(0,n-out.length));
  if(out.length<n)out=out.concat(due.filter(q=>!out.includes(q)).slice(0,n-out.length));
  if(out.length<n)out=out.concat(later.filter(q=>!out.includes(q)).slice(0,n-out.length));
  return{cat,qs:shuffle(out).slice(0,n),i:0,sel:null,done:false,c:0,res:[]};
}

const RG={spot:'mtt-early',sel:new Set(),checked:false,painting:null};
function rangeSpot(){return RANGE_SPOTS.find(s=>s.id===RG.spot)}
function scoreRange(spot,sel){
  const core=parseRange(spot.core),border=parseRange(spot.border);
  let hit=0,coreTot=0,extra=0,missed=0,selC=0;
  for(let i=0;i<13;i++)for(let j=0;j<13;j++){const h=handAt(i,j),c=combos(h),inSel=sel.has(h);
    if(inSel)selC+=c;
    if(core.has(h)){coreTot+=c;if(inSel)hit+=c;else missed+=c}
    else if(!border.has(h)&&inSel)extra+=c;}
  const score=Math.max(0,(hit-extra)/(coreTot+0.0001));
  return{score:clamp(score,0,1),hit,coreTot,extra,missed,selC,core,border};
}

    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))">
      <div class="panel stack">
        <div class="stack-s"><h2>${esc(sp.t)}</h2><p class="muted">${txg(sp.d)}</p></div>
        <div class="rg-wrap"><div class="rg" id="rg">${grid}</div></div>

ACTS['rg-spot']=(el)=>{RG.spot=el.dataset.id;RG.sel=new Set();RG.checked=false;render()};
ACTS['rg-clear']=()=>{RG.sel=new Set();RG.checked=false;render()};
ACTS['rg-retry']=()=>{RG.sel=new Set();RG.checked=false;render()};
ACTS['rg-check']=()=>{const sp=rangeSpot();const r=scoreRange(sp,RG.sel);RG.checked=true;
  if(S.rangeBest[sp.id]==null||r.score>S.rangeBest[sp.id])S.rangeBest[sp.id]=r.score;
  logEvent('range','ranges',Math.round(r.score*10),10,{spot:sp.id});save();render()};
function paintCell(el){if(RG.checked||!el||!el.dataset.h)return;const h=el.dataset.h;if(RG.painting==='add'){RG.sel.add(h);el.className=(el.className.includes('pair')?'pair ':'')+'on'}else{RG.sel.delete(h);el.className=el.className.includes('pair')?'pair':''}}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('#rg div');if(!el||RG.checked)return;e.preventDefault();RG.painting=RG.sel.has(el.dataset.h)?'del':'add';paintCell(el)});
document.addEventListener('pointermove',e=>{if(!RG.painting)return;const el=document.elementFromPoint(e.clientX,e.clientY);if(el&&el.closest('#rg'))paintCell(el.closest('#rg div'))});
document.addEventListener('pointerup',()=>{if(RG.painting){RG.painting=null;render()}});
document.addEventListener('pointercancel',()=>{if(RG.painting){RG.painting=null;render()}});

const SP={phase:'intro',qs:[],i:0,c:0,sel:null,left:0,ms:[],res:[]};
const SPEED_SEC=12;
const r1=x=>Math.round(x*100);
function numOpts(correct,cands,fmt){
  const seen=new Set([fmt(correct)]);const opts=[correct];
  for(const c of cands){const f=fmt(c);if(c>0&&!seen.has(f)){seen.add(f);opts.push(c)}if(opts.length===4)break}
  let k=1;while(opts.length<4){const c=correct*(1+.18*k*(k%2?1:-1));const f=fmt(c);if(c>0&&!seen.has(f)){seen.add(f);opts.push(c)}k++}
  const sh=shuffle(opts);return{opts:sh.map(fmt),ans:sh.indexOf(correct)};
}
const P=x=>r1(x)+'%';
const PS=x=>{const n=Math.round(1/x);return r1(x)+'% · 1 из '+n};
const FRACS=[[.25,'25%'],[1/3,'33%'],[.5,'50%'],[2/3,'66%'],[.75,'75%'],[1,'100%'],[1.5,'150%'],[2,'200%']];
function genMath(){
  const adv=S.prefs&&S.prefs.adv;
  if(!adv)return genSimple();
  const t=pick(['potodds','potodds','mdf','alpha','bluff','outs2','outs1','combo','combo','pairs']);
  const pot=pick([6,8,10,12,15,20,24,30,40,50,60,80,100]);
  if(t==='potodds'){const [f]=pick(FRACS);const b=Math.round(pot*f*10)/10;const eq=b/(pot+2*b);
    const o=numOpts(eq,[b/(pot+b),pot/(pot+2*b),b/pot*.5],P);return{q:`Банк ${pot} bb. Оппонент ставит ${b} bb. Какое минимальное эквити нужно для окупаемого колла (без учёта будущих улиц)?`,...o,why:`Колл ${b} в банк ${pot}+${b}+${b}=${pot+2*b}. Эквити = колл / итоговый банк = ${b}/${pot+2*b} ≈ ${P(eq)}. Частая ошибка — делить на банк без своего колла.`,tag:'шансы банка'}}
  if(t==='mdf'){const [f,fl]=pick(FRACS);const mdf=1/(1+f);const o=numOpts(mdf,[1-1/(1+2*f),f/(1+f),1-mdf+.05],P);
    return{q:`Оппонент ставит ${fl} банка. Какая минимальная частота защиты (MDF) не даёт ему авто-профита любыми двумя картами?`,...o,why:`MDF = банк / (банк + ставка) = 1 / (1 + ${f.toFixed(2)}) ≈ ${P(mdf)}. Это ориентир, а не закон: против игрока, который недоблефовывает, защищайся меньше.`,tag:'MDF'}}
  if(t==='alpha'){const [f,fl]=pick(FRACS);const a=f/(1+f);const o=numOpts(a,[f/(1+2*f),1/(1+f),a+.1],P);
    return{q:`Ты блефуешь ставкой ${fl} банка с рукой, у которой нет эквити. Как часто оппонент должен фолдить, чтобы блеф был в нуле?`,...o,why:`Нужная фолд-эквити = ставка / (банк + ставка) = ${f.toFixed(2)}/${(1+f).toFixed(2)} ≈ ${P(a)}. Чем больше ставка, тем чаще должен фолдить оппонент.`,tag:'фолд-эквити'}}
  if(t==='bluff'){const [f,fl]=pick(FRACS);const bl=f/(1+2*f);const o=numOpts(bl,[f/(1+f),1/(1+f),bl*1.5],P);
    return{q:`Ривер, поляризованный диапазон, ставка ${fl} банка. Какая доля блефов в диапазоне ставки делает оппонента безразличным между коллом и фолдом?`,...o,why:`Доля блефов = шансы, которые получает коллер = ставка / (банк + 2·ставка) ≈ ${P(bl)}. При ставке в банк это 1 блеф на 2 вэлью-комбо. Больше блефов — оппонент коллирует, меньше — фолдит.`,tag:'баланс блефа'}}
  if(t==='outs2'){const n=pick([4,5,6,8,9,10,12,15]);const eq=1-((47-n)*(46-n))/(47*46);const o=numOpts(eq,[n/47,n*2/100,n*4/100+.06,eq*.6],P);
    return{q:`Флоп, ты олл-ин и оппонент уже с готовой рукой. У тебя ${n} чистых аутов. Какое примерно эквити до ривера (две карты)?`,...o,why:`Точно: 1 − (${47-n}/47)·(${46-n}/46) ≈ ${P(eq)}. Правило ×4 даёт ${n*4}%: на 8+ аутах оно завышает, правило «×4 − (ауты − 8)» точнее.`,tag:'ауты'}}
  if(t==='outs1'){const n=pick([4,6,8,9,10,12,15]);const eq=n/46;const o=numOpts(eq,[n/52,n*4/100,eq*1.4],P);
    return{q:`Тёрн. У тебя ${n} аутов против готовой руки. Какова вероятность прикупить на ривере?`,...o,why:`${n} аутов из 46 неизвестных карт = ${P(eq)}. Правило ×2 даёт ${n*2}% и слегка занижает.`,tag:'ауты'}}
  if(t==='combo'){const hs=pick([['A','K'],['A','Q'],['K','Q'],['A','J'],['Q','J'],['K','J']]);const [x,y]=hs;const onBoard=pick([0,1]);const heroHas=pick([0,1]);
    let nx=4-onBoard,ny=4-heroHas;const corr=nx*ny;const desc=`${onBoard?`На борде одна ${x}. `:''}${heroHas?`У тебя на руках ${y}. `:''}`;
    const o=numOpts(corr,[16,12,9,8,6,4,3].filter(v=>v!==corr),v=>String(Math.round(v)));
    return{q:`${desc}Сколько всего комбинаций ${x}${y} (одномастных + разномастных) может быть у оппонента?`,...o,why:`Карт ${x} осталось ${nx}, карт ${y} осталось ${ny}: ${nx}×${ny} = ${corr} комбо. Без блокеров у неспаренной руки 16 комбо (4 одномастных + 12 разномастных).`,tag:'комбинаторика'}}
  {const r=pick(['A','K','Q','J','T','9']);const seen=pick([0,1,2]);const left=4-seen;const corr=left*(left-1)/2;const desc=seen===1?`На борде одна карта ${r}. `:seen===2?`На борде две карты ${r} (борд спарен). `:'';
    const o=numOpts(corr,[6,3,1,4,2,12].filter(v=>v!==corr),v=>String(Math.round(v)));
    return{q:`${desc}Сколько комбинаций пары ${r}${r} возможно у оппонента?`,...o,why:`Осталось ${left} карт ${r}; число пар = C(${left},2) = ${corr}. Поэтому сет на флопе — всего 3 комбо, а оверпара без блокеров — 6.`,tag:'комбинаторика'}}
}
const SFR=[[1/3,'треть банка'],[.5,'полбанка'],[2/3,'2/3 банка'],[1,'размер банка']];
const DRAWS=[[9,'флеш-дро'],[8,'двустороннее стрит-дро'],[4,'гатшот (стрит в середину)'],[15,'флеш-дро + стрит-дро']];
function genSimple(){
  const t=pick(['need','need','outs','outs','call','call','call']);
  if(t==='need'){const [f,fl]=pick(SFR);const eq=f/(1+2*f);
    const o=numOpts(eq,[f/(1+f),.5,eq*.5,eq*1.6],PS);
    return{q:`Соперник ставит ${fl}. Как часто твой колл должен выигрывать, чтобы быть в плюс на дистанции?`,...o,why:`Ставка ${fl} → колл должен выигрывать примерно ${PS(eq)}. Запомни четыре точки: треть банка — 1 из 5, полбанка — 1 из 4, 2/3 — чуть реже 1 из 3, банк — 1 из 3.`,tag:'сколько нужно выигрывать'}}
  if(t==='outs'){const [n,nm]=pick(DRAWS);const flop=Math.random()<.5;const eq=flop?1-((47-n)*(46-n))/(47*46):n/46;

const COACH_RULES=`Ты — сильный и практичный тренер по холдему. Твой ученик — любитель среднего уровня: играет в основном турниры (онлайн и вживую) и немного живого кэша. Базу он знает, но сложная теория и математика его перегружают. Отвечай по-русски простыми словами, короткими предложениями, как опытный друг за столом. Не используй термины MDF, EV, SPR, GTO, ICM, солвер, эквити, поляризованный, частоты, комбинаторика. Вместо этого говори «в плюс на дистанции», «шансы», «на баббле вылет стоит дороже». Обычные слова (рейз, колл, 3-бет, c-bet, топ-пара, дро, натсы) можно. Числа — максимум одно-два и в виде «1 раз из 4». Опирайся на практику: какие руки у соперника по его действиям (корзины: сильные, средние, дро, ничего), кто заплатит и кто сбросит, какой тип соперника (станция, нит, маньяк, регуляр) и как против него играть. Давай простое правило, которое можно унести за стол. Если данных не хватает, назови допущение и иди дальше.`;
function profileBrief(){
  const p=S.profile||{};const parts=[];
  if(Object.values(p).some(Boolean))parts.push('Анкета ученика: '+PROFILE_Q.map(q=>p[q.k]?q.l+' — '+p[q.k]:null).filter(Boolean).join('; ')+'.');
  const sc=AXES.map(a=>{const v=axisScore(a.id);return v==null?null:a.name+' '+pct(v)+'%'}).filter(Boolean);
  if(sc.length)parts.push('Оценки по осям мастерства (диагностика + тренажёр): '+sc.join(', ')+'.');
  const ar=archetype();if(ar)parts.push('Тип: '+ar.n+'. '+(ar.cal||''));
  if(S.tilt&&S.tilt.top)parts.push('Главные типы тилта по самооценке: '+S.tilt.top.join(', ')+'.');
  const j=S.journal.slice(-5);if(j.length)parts.push('Последние сессии: '+j.map(x=>`${x.d}: A-game ${x.a}%, макс. тилт ${x.tilt}/10${x.trig&&x.trig.length?', триггеры: '+x.trig.join('/'):''}`).join('; ')+'.');
  return parts.join('\n')||'Данных об ученике пока нет.';
}
function sampleErr(e){const c=e&&e.code;

  if(c==='rate_limited')return 'Слишком много запросов подряд или исчерпан лимит. Попробуй через несколько минут.';
  if(c==='cancelled')return 'Остановлено.';
  if(c==='refused')return 'Claude отказался отвечать на этот запрос. Переформулируй его.';
  if(c==='invalid_json')return 'Тренер ответил в неправильном формате. Нажми ещё раз.';
  if(c==='session_expired')return 'Сессия истекла. Войди в Claude заново.';
  return 'Связь с тренером прервалась. Попробуй ещё раз.'}

const GL_RX=GLOSS.map(([n,src,d])=>({n,d,rx:new RegExp('(?<![А-Яа-яЁёA-Za-z0-9\\-])('+src+')(?![А-Яа-яЁёA-Za-z0-9])','i')}));
function gl(html){
  const used=[];let out=html;
  GL_RX.forEach((g,i)=>{out=out.replace(g.rx,m=>{used.push([i,m]);return '\u0001'+(used.length-1)+'\u0002'})});
  return out.replace(/\u0001(\d+)\u0002/g,(_,k)=>{const [i,m]=used[+k];return `<span class="term" tabindex="0" role="button" data-gl="${i}">${m}</span>`});
}
