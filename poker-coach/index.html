<script>
"use strict";
/* ============================== constants ============================== */
const AXES=[
  {id:'math',short:'Математика',name:'Математика',desc:'шансы банка, MDF, ауты, комбинаторика'},
  {id:'ranges',short:'Диапазоны',name:'Чтение диапазонов',desc:'сужение диапазона по линии, комбо, блокеры'},
  {id:'postflop',short:'Постфлоп',name:'Постфлоп-стратегия',desc:'c-bet, сайзинги, баррели, value/блеф на ривере'},
  {id:'exploit',short:'Игроки',name:'Чтение игроков',desc:'профили, статы, тайминги, эксплойты'},
  {id:'preflop',short:'Префлоп',name:'Префлоп',desc:'3-бет/4-бет, сквиз, защита, SPR'},
  {id:'mental',short:'Ментал',name:'Ментальная игра',desc:'тилт, процесс решений, дисциплина'},
];
const AXIS=Object.fromEntries(AXES.map(a=>[a.id,a]));
const RANKS='AKQJT98765432';
const SUITS={s:'♠',h:'♥',d:'♦',c:'♣'};
const SRS_DAYS=[0,1,3,7,16,35];
const DAY=86400000;
const LS_KEY='pokerstab.v1';

/* ============================== utils ============================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>Math.round(x*100);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{try{const [y,m,d]=s.split('-');return d+'.'+m}catch(e){return s}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function card(c,sm){
  if(!c||c.length<2)return '';
  const r=c[0].toUpperCase().replace('1','T'),s=c[1].toLowerCase();
  if(!SUITS[s])return '';
  const cls=s==='s'?'s_':s;
  return `<span class="pc ${cls}${sm?' sm':''}" aria-label="${esc(r+s)}">${r==='T'?'10':esc(r)}<span class="s">${SUITS[s]}</span></span>`;
}
const tx=s=>esc(s).replace(/[♠♥♦♣]/g,m=>`<span class="st ${{'♠':'s','♥':'h','♦':'d','♣':'c'}[m]}">${m}&#xFE0E;</span>`);
const cardsOf=(str,sm)=>String(str||'').trim().split(/\s+/).filter(x=>/^[2-9TJQKA1][shdc]$/i.test(x)).map(c=>card(c,sm)).join('');

/* ============================== state ============================== */
function defaultState(){return{v:1,updatedAt:0,profile:null,diag:null,diagHistory:[],stats:{},srs:{},log:[],journal:[],tilt:null,plan:{done:{},start:null},aiQs:[],mathBest:null,rangeBest:{},routine:{}}}
let S=defaultState();
function normalize(o){const d=defaultState();if(!o||typeof o!=='object')return d;for(const k in d){if(o[k]!==undefined)d[k]=o[k]}return d}
try{const raw=localStorage.getItem(LS_KEY);if(raw)S=normalize(JSON.parse(raw))}catch(e){}
let dbRef=null,saveTimer=null,saving=false,dirty=false,sampleFn=null;
function trimState(){
  if(S.log.length>400)S.log=S.log.slice(-400);
  if(S.journal.length>120)S.journal=S.journal.slice(-120);
  if(S.aiQs.length>60)S.aiQs=S.aiQs.slice(-60);
  if(S.diagHistory.length>8)S.diagHistory=S.diagHistory.slice(-8);
}
function save(){
  S.updatedAt=Date.now();trimState();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  if(dbRef){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)}
}
async function flush(){
  if(saving||!dirty||!dbRef)return;
  saving=true;dirty=false;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)))}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){dbRef=null;setSync(false)}else dirty=true}
  saving=false;
  if(dirty&&dbRef)saveTimer=setTimeout(flush,4000);
}
function setSync(on){const el=$('#sync');el.classList.toggle('on',!!on);el.querySelector('span').textContent=on?'Прогресс синхронизирован с тренером':'Прогресс хранится в этом браузере'}

async function initCaps(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  const [db,user,sample]=await Promise.all([
    claude.use('db').catch(()=>null),claude.use('user').catch(()=>null),claude.use('sample').catch(()=>null)]);
  if(sample){sampleFn=sample;rerender()}
  if(!db||!user)return;
  let owner=false;try{owner=await user.isOwner()}catch(e){}
  if(!owner)return;
  try{
    const ref=db.doc('coach/state');
    const snap=await ref.get();
    dbRef=ref;setSync(true);
    if(snap.exists){
      const remote=normalize(snap.data());
      if((remote.updatedAt||0)>(S.updatedAt||0)){S=JSON.parse(JSON.stringify(remote));try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}rerender()}
      else if((S.updatedAt||0)>(remote.updatedAt||0)){dirty=true;flush()}
    }else if(S.updatedAt){dirty=true;flush()}
  }catch(e){dbRef=null;setSync(false)}
}

/* ============================== stats / srs ============================== */
function logEvent(kind,cat,c,t,extra){S.log.push(Object.assign({d:today(),ts:Date.now(),kind,cat,c,t},extra||{}))}
function recordAnswer(q,ok){
  const st=S.stats[q.cat]||(S.stats[q.cat]={c:0,t:0});st.t++;if(ok)st.c++;
  const r=S.srs[q.id]||{box:0,due:0,seen:0,wrong:0};
  r.seen++;
  if(ok){r.box=Math.min(5,r.box+1);r.due=Date.now()+SRS_DAYS[r.box]*DAY}
  else{r.wrong++;r.box=0;r.due=Date.now()+8*60000}
  S.srs[q.id]=r;
}
function allQs(){return BANK.concat(S.aiQs||[])}
function qById(id){return allQs().find(q=>q.id===id)}
function dueQs(){const n=Date.now();return allQs().filter(q=>{const r=S.srs[q.id];return r&&r.due<=n})}
function axisScore(id){
  // blend: latest diagnostic and drill accuracy (drills weigh more as volume grows)
  const d=S.diag&&S.diag.axes[id];const st=S.stats[id];
  const dv=d?d.score:null;const tv=st&&st.t?st.c/st.t:null;
  if(dv==null&&tv==null)return null;
  if(dv==null)return tv;if(tv==null)return dv;
  const w=Math.min(.7,st.t/40);
  return dv*(1-w)+tv*w;
}
function weakestAxes(){
  const arr=AXES.map(a=>({id:a.id,s:axisScore(a.id)})).filter(x=>x.s!=null).sort((a,b)=>a.s-b.s);
  return arr.length?arr:AXES.map(a=>({id:a.id,s:null}));
}
function doneToday(kind){return S.log.some(e=>e.d===today()&&e.kind===kind)}
function streak(){
  const days=new Set(S.log.map(e=>e.d));let n=0;const d=new Date();
  if(!days.has(today()))d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(days.has(k)){n++;d.setDate(d.getDate()-1)}else break}
  return n;
}

/* ============================== charts ============================== */
function radar(series,size){
  size=size||300;const cx=size/2,cy=size/2,R=size/2-58;const n=AXES.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
  let g='';
  [.25,.5,.75,1].forEach(l=>{g+=`<polygon points="${AXES.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="var(--line-2)" stroke-width="1"/>`});
  AXES.forEach((a,i)=>{const[x,y]=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const[lx,ly]=pt(i,1.2);const anchor=Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end';
    g+=`<text x="${lx}" y="${ly+4}" text-anchor="${anchor}" font-size="11.5" fill="var(--muted)" font-weight="600">${esc(a.short)}</text>`});
  series.forEach(s=>{
    const pts=AXES.map((a,i)=>pt(i,Math.max(.03,s.vals[a.id]??0)));
    g+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="2" ${s.dash?'stroke-dasharray="4 4"':''}/>`;
    if(!s.dash)pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.stroke}"/>`});
  });

function lineChart(points,opts){

  let g='';[0,.25,.5,.75,1].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${ys(v)+4}" text-anchor="end" font-size="10" fill="var(--faint)">${pct(v)}</text>`});
  const path=points.map((p,i)=>(i?'L':'M')+xs(i)+','+ys(p.v)).join(' ');
  g+=`<path d="${path} L${xs(points.length-1)},${ys(0)} L${xs(0)},${ys(0)} Z" fill="var(--brass)" opacity=".12"/>`;
  g+=`<path d="${path}" fill="none" stroke="var(--brass)" stroke-width="2.2"/>`;
  const step=Math.ceil(points.length/7);
  points.forEach((p,i)=>{if(i%step===0||i===points.length-1)g+=`<text x="${xs(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--faint)">${esc(p.l)}</text>`});

  return `<div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:340px;display:block" role="img" aria-label="${esc(opts.label||'График')}">${g}</svg></div>`;
}

function buildDiag(){
  const out=[];
  AXES.forEach(ax=>{
    const pool=BANK.filter(q=>q.cat===ax.id);
    const by=l=>shuffle(pool.filter(q=>q.level===l));
    let chosen=[...by(1).slice(0,1),...by(2).slice(0,2),...by(3).slice(0,1)];
    if(chosen.length<4)chosen=chosen.concat(shuffle(pool.filter(q=>!chosen.includes(q))).slice(0,4-chosen.length));
    out.push(chosen);
  });
  const res=[];for(let i=0;i<4;i++)shuffle(AXES.map((_,k)=>k)).forEach(k=>{if(out[k][i])res.push(out[k][i])});
  return res;
}

const T={cat:'smart',session:null};
function buildSession(cat,n){
  n=n||12;const all=allQs();const now=Date.now();
  let pool=cat==='smart'?all:cat==='review'?dueQs():all.filter(q=>q.cat===cat);
  const due=shuffle(pool.filter(q=>S.srs[q.id]&&S.srs[q.id].due<=now));
  const fresh=shuffle(pool.filter(q=>!S.srs[q.id]));
  const later=pool.filter(q=>S.srs[q.id]&&S.srs[q.id].due>now).sort((a,b)=>S.srs[a.id].due-S.srs[b.id].due);
  let out=due.slice(0,Math.ceil(n*.5));
  if(cat==='smart'){
    const w=weakestAxes();const weights={};w.forEach((x,i)=>weights[x.id]=Math.max(1,w.length-i));
    const f2=fresh.slice().sort((a,b)=>(weights[b.cat]||1)*Math.random()-(weights[a.cat]||1)*Math.random());
    out=out.concat(f2.slice(0,n-out.length));
  }else out=out.concat(fresh.slice(0,n-out.length));
  if(out.length<n)out=out.concat(due.filter(q=>!out.includes(q)).slice(0,n-out.length));
  if(out.length<n)out=out.concat(later.filter(q=>!out.includes(q)).slice(0,n-out.length));
  return{cat,qs:shuffle(out).slice(0,n),i:0,sel:null,done:false,c:0,res:[]};
}

function handAt(i,j){if(i===j)return RANKS[i]+RANKS[j];return i<j?RANKS[i]+RANKS[j]+'s':RANKS[j]+RANKS[i]+'o'}
function combos(h){return h.length===2?6:h[2]==='s'?4:12}
function expand(tok){
  tok=tok.trim();if(!tok)return[];const R=RANKS,ix=c=>R.indexOf(c);const out=[];
  let m;
  if((m=tok.match(/^([2-9TJQKA])\1\+$/))){for(let k=ix(m[1]);k>=0;k--)out.push(R[k]+R[k]);return out}
  if((m=tok.match(/^([2-9TJQKA])\1-([2-9TJQKA])\2$/))){let a=ix(m[1]),b=ix(m[2]);if(a>b)[a,b]=[b,a];for(let k=a;k<=b;k++)out.push(R[k]+R[k]);return out}
  if((m=tok.match(/^([2-9TJQKA])\1$/)))return[tok];
  if((m=tok.match(/^([2-9TJQKA])([2-9TJQKA])([so])\+$/))){const hi=ix(m[1]);for(let k=ix(m[2]);k>hi;k--)out.push(m[1]+R[k]+m[3]);return out}
  if((m=tok.match(/^([2-9TJQKA])([2-9TJQKA])([so])-\1([2-9TJQKA])\3$/))){let a=ix(m[2]),b=ix(m[4]);if(a>b)[a,b]=[b,a];for(let k=a;k<=b;k++)out.push(m[1]+R[k]+m[3]);return out}
  if((m=tok.match(/^([2-9TJQKA])([2-9TJQKA])([so])$/)))return[tok];
  if((m=tok.match(/^([2-9TJQKA])([2-9TJQKA])$/)))return[tok+'s',tok+'o'];
  console.warn('bad range token',tok);return[];
}

const r1=x=>Math.round(x*100);
function numOpts(correct,cands,fmt){
  const seen=new Set([fmt(correct)]);const opts=[correct];
  for(const c of cands){const f=fmt(c);if(c>0&&!seen.has(f)){seen.add(f);opts.push(c)}if(opts.length===4)break}
  let k=1;while(opts.length<4){const c=correct*(1+.18*k*(k%2?1:-1));const f=fmt(c);if(c>0&&!seen.has(f)){seen.add(f);opts.push(c)}k++}
  const sh=shuffle(opts);return{opts:sh.map(fmt),ans:sh.indexOf(correct)};
}
const P=x=>r1(x)+'%';
const FRACS=[[.25,'25%'],[1/3,'33%'],[.5,'50%'],[2/3,'66%'],[.75,'75%'],[1,'100%'],[1.5,'150%'],[2,'200%']];
function genMath(){
  const t=pick(['potodds','potodds','mdf','alpha','bluff','outs2','outs1','combo','combo','pairs']);
  const pot=pick([6,8,10,12,15,20,24,30,40,50,60,80,100]);
  if(t==='potodds'){const [f]=pick(FRACS);const b=Math.round(pot*f*10)/10;const eq=b/(pot+2*b);
    const o=numOpts(eq,[b/(pot+b),pot/(pot+2*b),b/pot*.5],P);return{q:`Банк ${pot} bb. Оппонент ставит ${b} bb. Какое минимальное эквити нужно для окупаемого колла (без учёта будущих улиц)?`,...o,why:`Колл ${b} в банк ${pot}+${b}+${b}=${pot+2*b}. Эквити = колл / итоговый банк = ${b}/${pot+2*b} ≈ ${P(eq)}. Частая ошибка — делить на банк без своего колла.`,tag:'шансы банка'}}
  if(t==='mdf'){const [f,fl]=pick(FRACS);const mdf=1/(1+f);const o=numOpts(mdf,[1-1/(1+2*f),f/(1+f),1-mdf+.05],P);
    return{q:`Оппонент ставит ${fl} банка. Какая минимальная частота защиты (MDF) не даёт ему авто-профита любыми двумя картами?`,...o,why:`MDF = банк / (банк + ставка) = 1 / (1 + ${f.toFixed(2)}) ≈ ${P(mdf)}. Это ориентир, а не закон: против игрока, который недоблефовывает, защищайся меньше.`,tag:'MDF'}}
  if(t==='alpha'){const [f,fl]=pick(FRACS);const a=f/(1+f);const o=numOpts(a,[f/(1+2*f),1/(1+f),a+.1],P);
    return{q:`Ты блефуешь ставкой ${fl} банка с рукой, у которой нет эквити. Как часто оппонент должен фолдить, чтобы блеф был в нуле?`,...o,why:`Нужная фолд-эквити = ставка / (банк + ставка) = ${f.toFixed(2)}/${(1+f).toFixed(2)} ≈ ${P(a)}. Чем больше ставка, тем чаще должен фолдить оппонент.`,tag:'фолд-эквити'}}
  if(t==='bluff'){const [f,fl]=pick(FRACS);const bl=f/(1+2*f);const o=numOpts(bl,[f/(1+f),1/(1+f),bl*1.5],P);
    return{q:`Ривер, поляризованный диапазон, ставка ${fl} банка. Какая доля блефов в диапазоне ставки делает оппонента безразличным между коллом и фолдом?`,...o,why:`Доля блефов = шансы, которые получает коллер = ставка / (банк + 2·ставка) ≈ ${P(bl)}. При ставке в банк это 1 блеф на 2 вэлью-комбо. Больше блефов — оппонент коллирует, меньше — фолдит.`,tag:'баланс блефа'}}
  if(t==='outs2'){const n=pick([4,5,6,8,9,10,12,15]);const eq=1-((47-n)*(46-n))/(47*46);const o=numOpts(eq,[n/47,n*2/100,n*4/100+.06,eq*.6],P);
    return{q:`Флоп, ты олл-ин и оппонент уже с готовой рукой. У тебя ${n} чистых аутов. Какое примерно эквити до ривера (две карты)?`,...o,why:`Точно: 1 − (${47-n}/47)·(${46-n}/46) ≈ ${P(eq)}. Правило ×4 даёт ${n*4}%: на 8+ аутах оно завышает, правило «×4 − (ауты − 8)» точнее.`,tag:'ауты'}}
  if(t==='outs1'){const n=pick([4,6,8,9,10,12,15]);const eq=n/46;const o=numOpts(eq,[n/52,n*4/100,eq*1.4],P);
    return{q:`Тёрн. У тебя ${n} аутов против готовой руки. Какова вероятность прикупить на ривере?`,...o,why:`${n} аутов из 46 неизвестных карт = ${P(eq)}. Правило ×2 даёт ${n*2}% и слегка занижает.`,tag:'ауты'}}
  if(t==='combo'){const hs=pick([['A','K'],['A','Q'],['K','Q'],['A','J'],['Q','J'],['K','J']]);const [x,y]=hs;const onBoard=pick([0,1]);const heroHas=pick([0,1]);
    let nx=4-onBoard,ny=4-heroHas;const corr=nx*ny;const desc=`${onBoard?`На борде одна ${x}. `:''}${heroHas?`У тебя на руках ${y}. `:''}`;

    return{q:`${desc}Сколько всего комбинаций ${x}${y} (одномастных + разномастных) может быть у оппонента?`,...o,why:`Карт ${x} осталось ${nx}, карт ${y} осталось ${ny}: ${nx}×${ny} = ${corr} комбо. Без блокеров у неспаренной руки 16 комбо (4 одномастных + 12 разномастных).`,tag:'комбинаторика'}}
  {const r=pick(['A','K','Q','J','T','9']);const seen=pick([0,1,2]);const left=4-seen;const corr=left*(left-1)/2;const desc=seen===1?`На борде одна карта ${r}. `:seen===2?`На борде две карты ${r} (борд спарен). `:'';
    const o=numOpts(corr,[6,3,1,4,2,12].filter(v=>v!==corr),v=>String(Math.round(v)));
    return{q:`${desc}Сколько комбинаций пары ${r}${r} возможно у оппонента?`,...o,why:`Осталось ${left} карт ${r}; число пар = C(${left},2) = ${corr}. Поэтому сет на флопе — всего 3 комбо, а оверпара без блокеров — 6.`,tag:'комбинаторика'}}
}

ACTS['ai-review']=async(el)=>{
  const hand=($('#ai-hand')||{}).value||'';if(hand.trim().length<20){toast('Опиши раздачу подробнее');return}
  AI.review=hand;AI.ctl=new AbortController();busy=true;el.disabled=true;$('[data-act="ai-stop"]').disabled=false;
  const out=$('#ai-review-out');out.textContent='Тренер думает над раздачей… (обычно 20–60 секунд)';
  const prompt=`${COACH_RULES}\n\nПРОФИЛЬ УЧЕНИКА\n${profileBrief()}\n\nРАЗДАЧА УЧЕНИКА\n${hand.slice(0,6000)}\n\nСделай тренерский разбор строго в такой структуре, простым текстом без markdown-разметки (заголовки — отдельной строкой ЗАГЛАВНЫМИ буквами):\nВЕРДИКТ — 2 предложения: главная ошибка или подтверждение, что сыграно хорошо.\nПО УЛИЦАМ — для каждой улицы: диапазон героя, диапазон оппонента (с учётом его профиля), лучшее действие и сайзинг, почему.\nМЫШЛЕНИЕ — разбери то, что ученик думал в моменте: где логика верна, где ошибка процесса (например, думал о конкретной руке, а не о диапазоне; игнорировал профиль; result-oriented).\nСВЯЗЬ С ПРОФИЛЕМ — как эта раздача связана с его слабыми осями.\nЗАДАНИЕ — одно конкретное упражнение на неделю.\nВОПРОСЫ — два сократических вопроса, которые ученик должен задать себе в похожем споте.\nОбъём до 450 слов.`;
  try{await sampleFn(prompt,{modelTier:'complex',signal:AI.ctl.signal,cache:false,onText:({text})=>{out.textContent=text;AI.reviewOut=text}});logEvent('review','ai',0,0)}
  catch(e){if(e&&e.text){out.textContent=e.text+'\n\n['+sampleErr(e)+']';AI.reviewOut=out.textContent}else{out.textContent=sampleErr(e)}}

ACTS['ai-send']=async(el)=>{
  const ta=$('#ai-q');const txt=(ta&&ta.value||'').trim();if(!txt)return;
  AI.chat.push({role:'user',content:txt});ta.value='';busy=true;el.disabled=true;
  const chat=$('#chat');chat.insertAdjacentHTML('beforeend',`<div class="msg me">${esc(txt)}</div><div class="msg ai" id="ai-live">Тренер думает…</div>`);
  const live=$('#ai-live');
  const turns=[{role:'user',content:`${COACH_RULES}\n\nПРОФИЛЬ УЧЕНИКА\n${profileBrief()}\n\nОтвечай кратко и по делу, до 250 слов, простым текстом без markdown. Дальше — разговор с учеником.`},...AI.chat.slice(-12)];
  AI.ctl=new AbortController();
  try{const {text}=await sampleFn(turns,{cache:false,signal:AI.ctl.signal,onText:({text})=>{live.textContent=text}});AI.chat.push({role:'assistant',content:text})}
  catch(e){live.textContent=(e&&e.text?e.text+'\n\n':'')+'['+sampleErr(e)+']';AI.chat.pop()}
  live.removeAttribute('id');AI.ctl=null;busy=false;el.disabled=false;
};
ACTS['ai-clear']=()=>{AI.chat=[];render()};
ACTS['ai-gen-from']=(el)=>{go('ai');setTimeout(()=>{const b=document.querySelector(`[data-act="ai-gen"][data-cat="${el.dataset.cat}"]`);b&&b.click()},50)};
ACTS['ai-gen']=async(el)=>{
  const cat=el.dataset.cat;const st=$('#ai-gen-status');document.querySelectorAll('[data-act="ai-gen"]').forEach(b=>b.disabled=true);
  st.textContent=`Тренер составляет споты: ${AXIS[cat].name}… (до минуты)`;busy=true;
  const wrongTags=Object.entries(S.srs).filter(([id,r])=>r.wrong).map(([id])=>qById(id)).filter(q=>q&&q.cat===cat).map(q=>q.tag).filter(Boolean);
  const examples=BANK.filter(q=>q.cat===cat).slice(0,2).map(q=>JSON.stringify(q)).join('\n');
  const prompt=`${COACH_RULES}\n\nПРОФИЛЬ УЧЕНИКА\n${profileBrief()}\n${wrongTags.length?'Навыки, на которых ученик ошибался: '+[...new Set(wrongTags)].slice(0,8).join(', ')+'.':''}\n\nСоставь 4 НОВЫХ тренировочных спота по оси «${AXIS[cat].name}» (${AXIS[cat].desc}). Уровень: средний и продвинутый, под этого ученика. Только споты, где лучший ответ однозначно защищается солверной логикой или ясным эксплойтом (тогда опиши профиль оппонента). Математику проверь дважды. Правильный ответ ставь на разные позиции.\n\nОтветь ТОЛЬКО JSON-массивом из 4 объектов такой формы (тексты на русском):\n{"level":2,"pos":"BTN vs BB","hero":"As Kd","board":"Kh 7c 2d","pot":12.5,"stack":87.5,"q":"ситуация и вопрос","opts":["...","...","...","..."],"ans":1,"why":"разбор процесса мышления, 3-5 предложений","tag":"короткий навык"}\nКарты в формате ранг+масть (s,h,d,c), ранги 2-9,T,J,Q,K,A; пустая строка, если не нужно. pot и stack в bb или null.\nПримеры формата:\n${examples}`;
  try{
    const arr=await sampleFn.json(prompt,{modelTier:'complex',cache:false});
    const ok=(Array.isArray(arr)?arr:[]).map((x,i)=>validQ(x,cat,i)).filter(Boolean);
    if(!ok.length)throw{code:'invalid_json'};
    S.aiQs=S.aiQs.concat(ok);save();AI.genStatus=`Готово: ${ok.length} новых спота по оси «${AXIS[cat].name}».`;st.innerHTML=`${esc(AI.genStatus)} <button class="link" data-act="t-start-ai" data-cat="${cat}">Решать сейчас</button>`;
  }catch(e){st.textContent=sampleErr(e)}
  busy=false;document.querySelectorAll('[data-act="ai-gen"]').forEach(b=>b.disabled=false);
};
ACTS['t-start-ai']=(el)=>{const cat=el.dataset.cat;const fresh=S.aiQs.filter(q=>q.cat===cat&&!S.srs[q.id]);T.cat=cat;T.session={cat,qs:fresh.length?fresh:S.aiQs.filter(q=>q.cat===cat).slice(-4),i:0,sel:null,done:false,c:0,res:[]};go('train')};
function validQ(x,cat,i){
  if(!x||typeof x!=='object')return null;
  const opts=Array.isArray(x.opts)?x.opts.map(String).filter(Boolean).slice(0,4):[];
  const ans=Number(x.ans);if(opts.length<2||!Number.isInteger(ans)||ans<0||ans>=opts.length)return null;
  if(!x.q||!x.why)return null;
  const cardsOk=s=>typeof s==='string'&&s.trim().split(/\s+/).every(c=>/^[2-9TJQKA][shdc]$/.test(c))?s.trim():'';
  const num=v=>v==null||v===''||isNaN(+v)?null:+v;
  return{id:'ai-'+Date.now().toString(36)+'-'+i,cat,ai:true,level:clamp(Number(x.level)||2,1,3),pos:String(x.pos||'').slice(0,40),hero:cardsOk(x.hero),board:cardsOk(x.board),pot:num(x.pot),stack:num(x.stack),q:String(x.q).slice(0,1500),opts:opts.map(o=>o.slice(0,300)),ans,why:String(x.why).slice(0,1500),tag:String(x.tag||'').slice(0,60)};
}

function planWeeks(){
  const w=weakestAxes().map(x=>x.id);const order=[...w,...AXES.map(a=>a.id).filter(id=>!w.includes(id))];
  const uniq=[...new Set(order)];
  const weeks=[{id:'w0',t:'Неделя 1 · База и ритм',goal:'Установить ежедневную структуру и снять точный профиль.',tasks:['Пройти диагностику','Профиль тилта + чек-лист перед каждой сессией','Ежедневная программа минимум 5 дней из 7','Разминка «Счёт на скорость» каждый день','Журнал после каждой сессии']}];
  uniq.slice(0,6).forEach((id,i)=>{const L=WEEK_LIB[id];weeks.push({id:'w'+(i+1)+'-'+id,t:`Неделя ${i+2} · ${L.t}`,goal:L.goal,tasks:L.tasks,axis:id})});
  weeks.push({id:'w7',t:'Неделя 8 · Контрольная',goal:'Повторная диагностика и новый план.',tasks:['Пройти диагностику заново и сравнить радар','Разобрать с AI-тренером 3 самые дорогие раздачи месяца','Сравнить долю A-game в журнале с первой неделей','Выбрать две оси на следующий цикл']});
  return weeks;
}
function currentWeek(){if(!S.plan.start)return 0;const d=Math.floor((Date.now()-new Date(S.plan.start+'T00:00:00').getTime())/(7*DAY));return clamp(d,0,7)}
function renderPlan(){
  const weeks=planWeeks();const cw=currentWeek();
  return `<div class="hero"><span class="eyebrow">Программа на 8 недель</span><h1>План, собранный под твои слабые места</h1><p>${S.diag?'Порядок недель выстроен от самой слабой оси к сильной и пересчитывается по мере тренировок.':'Пока порядок стандартный. После диагностики недели перестроятся под твои слабые оси.'} Каждый день: 60–90 минут = 15 мин разминка + 25 мин тренажёр/диапазоны + игра с одной целью + 10 мин журнал.</p></div>
    <div class="panel stack-s"><h3>Пропорция учёбы и игры</h3><p class="muted" style="font-size:14px">На этапе роста держи 30–40% времени на учёбу. Игра без разбора закрепляет и хорошие, и плохие привычки одинаково. Учёба без игры не проверяется реальностью.</p></div>
    <div class="stack">${weeks.map((w,i)=>{const done=w.tasks.filter((_,k)=>S.plan.done[w.id+':'+k]).length;return `<details class="week" ${i===cw?'open':''}><summary><span class="stack-s" style="gap:4px;min-width:0"><span class="wk-n">${i===cw&&S.plan.start?'ТЕКУЩАЯ НЕДЕЛЯ':'НЕДЕЛЯ '+(i+1)}</span><h3>${esc(w.t.replace(/^Неделя \d+ · /,''))}</h3></span><span class="pill ${done===w.tasks.length?'good':''}">${done}/${w.tasks.length}</span></summary><div class="wb stack-s"><p class="muted">${esc(w.goal)}</p>${w.tasks.map((t,k)=>{const key=w.id+':'+k;const d=!!S.plan.done[key];return `<div class="check ${d?'done':''}"><input type="checkbox" id="pl-${esc(key)}" data-act="plan" data-k="${esc(key)}" ${d?'checked':''}><label for="pl-${esc(key)}"><span>${esc(t)}</span></label></div>`}).join('')}${w.axis?`<div class="row"><button class="btn small" data-act="train-cat" data-cat="${w.axis}">Тренажёр по этой оси</button></div>`:''}</div></details>`}).join('')}</div>
    <div class="panel stack-s"><span class="eyebrow">Как работать с тренером дальше</span><p class="muted" style="font-size:14px">Раз в неделю возвращайся в чат с Claude и скажи «проверь мой прогресс в штабе». Твои результаты синхронизируются, и я скорректирую план, добавлю споты и упражнения под то, что увижу.</p></div>`;
}
ACTS.plan=(el)=>{const k=el.dataset.k;if(el.checked)S.plan.done[k]=true;else delete S.plan.done[k];save();render()};
